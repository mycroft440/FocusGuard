# ============================================================================
# FocusGuard — Version Catalog (libs.versions.toml)
# ============================================================================
# Centraliza todas as versões e dependências do projeto. Facilita upgrades
# coordenados e remove versões hardcoded em build.gradle.
#
# Convenção: aliases usam notation dash-case (ex: androidx-core-ktx vira
# androidx.core.ktx no Kotlin DSL).
# ============================================================================

[versions]
# ─── Build tools ───────────────────────────────────────────────────────────
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
detekt = "1.23.6"
hilt = "2.52"
androidxHiltNavigationCompose = "1.2.0"

# ─── AndroidX Core ─────────────────────────────────────────────────────────
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
androidxBiometric = "1.1.0"
androidxWebkit = "1.14.0"

# ─── Compose ───────────────────────────────────────────────────────────────
composeBom = "2024.10.01"

# ─── Room ──────────────────────────────────────────────────────────────────
room = "2.6.1"

# ─── Coroutines ────────────────────────────────────────────────────────────
coroutines = "1.9.0"

# ─── Security ──────────────────────────────────────────────────────────────
securityCrypto = "1.1.0-alpha06"

# ─── CameraX ───────────────────────────────────────────────────────────────
camerax = "1.4.0"

# ─── Image loading ─────────────────────────────────────────────────────────
coil = "2.6.0"

# ─── Material (View system) ────────────────────────────────────────────────
googleMaterial = "1.12.0"

# ─── Testing ───────────────────────────────────────────────────────────────
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestEspresso = "3.6.1"
mockk = "1.13.13"
robolectric = "4.13"
kotlinxCoroutinesTest = "1.9.0"
truth = "1.4.4"


[libraries]
# ─── AndroidX Core ─────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }

# ─── Lifecycle ─────────────────────────────────────────────────────────────
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# ─── Compose (BOM + modules) ───────────────────────────────────────────────
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }

# ─── Room ──────────────────────────────────────────────────────────────────
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ─── Coroutines ────────────────────────────────────────────────────────────
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ─── Security ──────────────────────────────────────────────────────────────
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# ─── CameraX ───────────────────────────────────────────────────────────────
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }

# ─── Coil ──────────────────────────────────────────────────────────────────
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# ─── Material (View system, for legacy XML) ────────────────────────────────
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }

# ─── Kotlin stdlib ─────────────────────────────────────────────────────────
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }

# ─── Hilt (DI) ─────────────────────────────────────────────────────────────
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigationCompose" }

# ─── Architecture components ────────────────────────────────────────────────
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }

# ─── Testing ───────────────────────────────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }


[plugins]
# ─── Build plugins ─────────────────────────────────────────────────────────
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
