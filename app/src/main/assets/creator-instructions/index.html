<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Instruções do Criador</title>
  <link rel="stylesheet" href="assets/css/book.css">
</head>
<body data-page="index.html">
  <main>
    <section class="cover" aria-labelledby="book-title">
      <div class="book-mark" aria-hidden="true">✦</div>
      <h1 id="book-title">Instruções do Criador</h1>
      <p class="subtitle">Tudo que existe para sair da pornografia começa aqui.</p>
      <span class="status">Disponível offline</span>
    </section>

    <section class="progress" aria-label="Seu progresso">
      <div class="progress-label" data-progress-label></div>
      <div class="progress-track">
        <div class="progress-value" data-progress-bar></div>
      </div>
    </section>

    <section class="trail" data-trail aria-label="Caminho dos capítulos"></section>

    <p class="trail-end" data-trail-end></p>

    <div class="map-foot">
      <button type="button" class="ghost-button" data-reset>Zerar meu progresso</button>
    </div>
  </main>

  <script src="assets/js/chapters.js"></script>
  <script src="assets/js/book.js"></script>
</body>
</html>
