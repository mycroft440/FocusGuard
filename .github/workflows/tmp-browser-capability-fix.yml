name: Temporary browser capability pipeline fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tmp-browser-capability-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
