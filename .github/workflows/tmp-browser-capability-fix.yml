name: Temporary browser capability pipeline fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tmp-browser-capability-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply, test and publish
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup_failure() {
            git reset --hard HEAD
            rm -f .github/workflows/tmp-browser-capability-fix.yml
            rm -f scripts/tmp_apply_browser_capability_fix.py
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove temporary browser fix files"
              git push origin HEAD:main
            fi
          }

          if ! python3 scripts/tmp_apply_browser_capability_fix.py; then
            cleanup_failure
            exit 1
          fi

          chmod +x gradlew
          if ! ./gradlew testDebugUnitTest --tests com.focusguard.service.WebsiteBlockNavigationTest --tests com.focusguard.accessibility.website.identification.WebsiteIdentificationStatusPolicyTest --no-daemon --stacktrace 2>&1 | tee browser-capability-tests.log; then
            cleanup_failure
            exit 1
          fi

          rm -f .github/workflows/tmp-browser-capability-fix.yml
          rm -f scripts/tmp_apply_browser_capability_fix.py
          rm -f browser-capability-tests.log
          git add -A
          if ! git diff --cached --check; then
            cleanup_failure
            exit 1
          fi
          git commit -m "fix(web): generalize browser identification and redirect fallback"
          git push origin HEAD:main
