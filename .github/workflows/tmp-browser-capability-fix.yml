        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup_failure() {
            git reset --hard HEAD
            rm -f .github/workflows/tmp-browser-capability-fix.yml
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove temporary browser fix workflow"
              git push origin HEAD:main
            fi
          }

          if ! printf '%s' "$PATCH_SCRIPT_B64" | tr -d ' ' | base64 --decode > /tmp/apply-browser-fix.py; then
            cleanup_failure
            exit 1
          fi
          if ! python3 /tmp/apply-browser-fix.py; then
            cleanup_failure
            exit 1
          fi

          chmod +x gradlew
          if ! ./gradlew testDebugUnitTest             --tests com.focusguard.service.WebsiteBlockNavigationTest             --tests com.focusguard.accessibility.website.identification.WebsiteIdentificationStatusPolicyTest             --no-daemon --stacktrace 2>&1 | tee browser-capability-tests.log; then
            cleanup_failure
            exit 1
          fi

          rm -f .github/workflows/tmp-browser-capability-fix.yml
          git add -A
          if ! git diff --cached --check; then
            cleanup_failure
            exit 1
          fi
          git commit -m "fix(web): generalize browser identification and redirect fallback"
          git push origin HEAD:main
