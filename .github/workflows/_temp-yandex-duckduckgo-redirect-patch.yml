name: Temporary redirect patch runner

on:
  push:
    branches:
      - fix/yandex-duckduckgo-redirect-fallback

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yandex-duckduckgo-redirect-fallback
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/_temp_yandex_duckduckgo_redirect_patch.py
      - name: Verify and commit
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-yandex-duckduckgo-redirect-patch.yml
          git rm scripts/_temp_yandex_duckduckgo_redirect_patch.py
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git diff --cached --check
          git commit -m "fix(web): redirect Yandex and DuckDuckGo after same-tab fallback"
          git push origin HEAD:fix/yandex-duckduckgo-redirect-fallback
