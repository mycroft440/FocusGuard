name: Temporary blocked app eviction patch

on:
  push:
    branches: ["fix/evict-blocked-app"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evict-blocked-app
          fetch-depth: 0
      - name: Apply focused source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          service = "app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt"
          tests = "app/src/test/java/com/focusguard/service/BlockingAccessibilityServiceIntentTest.kt"
          plan = ".agents/implementation_plan.md"

          replace_once(
              service,
              '''    private fun launchBlockNotice(\n        blockedPackage: String?,\n        blockedDomain: String?,\n        redirectBrowserPackage: String? = null\n    ): Boolean {''',
              '''    private fun evictBlockedAppFromForeground() {\n        if (performGlobalAction(GLOBAL_ACTION_HOME)) return\n\n        runCatching {\n            startActivity(createBlockedAppEvictionIntent())\n        }.onFailure { error ->\n            FocusGuardLogger.logError(\n                "A11y",\n                "Falha ao tirar app bloqueado do primeiro plano",\n                error\n            )\n        }\n    }\n\n    private fun launchBlockNotice(\n        blockedPackage: String?,\n        blockedDomain: String?,\n        redirectBrowserPackage: String? = null\n    ): Boolean {'''
          )

          replace_once(
              service,
              '''        showInstantBlockCurtain(mode = CurtainMode.BLOCK_NOTICE)\n        return try {''',
              '''        showInstantBlockCurtain(mode = CurtainMode.BLOCK_NOTICE)\n        if (shouldEvictBlockedAppBeforeNotice(blockedPackage)) {\n            evictBlockedAppFromForeground()\n        }\n        return try {'''
          )

          replace_once(
              service,
              '''        internal fun shouldLaunchBlockNotice(\n            previousKey: String?,\n            previousLaunchElapsed: Long,\n            requestedKey: String,\n            nowElapsed: Long\n        ): Boolean = previousKey != requestedKey ||\n            nowElapsed - previousLaunchElapsed >= BLOCK_NOTICE_RELAUNCH_COOLDOWN_MILLIS\n\n        internal fun createRefreshBlockingIntent(''',
              '''        internal fun shouldLaunchBlockNotice(\n            previousKey: String?,\n            previousLaunchElapsed: Long,\n            requestedKey: String,\n            nowElapsed: Long\n        ): Boolean = previousKey != requestedKey ||\n            nowElapsed - previousLaunchElapsed >= BLOCK_NOTICE_RELAUNCH_COOLDOWN_MILLIS\n\n        internal fun shouldEvictBlockedAppBeforeNotice(blockedPackage: String?): Boolean =\n            !blockedPackage.isNullOrBlank()\n\n        internal fun createBlockedAppEvictionIntent(): Intent =\n            Intent(Intent.ACTION_MAIN).apply {\n                addCategory(Intent.CATEGORY_HOME)\n                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)\n            }\n\n        internal fun createRefreshBlockingIntent('''
          )

          replace_once(
              tests,
              '''    @Test\n    fun `settings event storm cannot execute the protection animation twice`() {''',
              '''    @Test\n    fun `blocked app notice evicts app while website notice does not`() {\n        assertThat(\n            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice(\n                "com.example.blocked"\n            )\n        ).isTrue()\n        assertThat(\n            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice(null)\n        ).isFalse()\n        assertThat(\n            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice("")\n        ).isFalse()\n    }\n\n    @Test\n    fun `blocked app eviction fallback opens launcher in a new task`() {\n        val intent = BlockingAccessibilityService.createBlockedAppEvictionIntent()\n\n        assertThat(intent.action).isEqualTo(android.content.Intent.ACTION_MAIN)\n        assertThat(intent.categories).contains(android.content.Intent.CATEGORY_HOME)\n        assertThat(intent.flags and android.content.Intent.FLAG_ACTIVITY_NEW_TASK).isNotEqualTo(0)\n        assertThat(intent.flags and android.content.Intent.FLAG_ACTIVITY_CLEAR_TOP).isNotEqualTo(0)\n    }\n\n    @Test\n    fun `settings event storm cannot execute the protection animation twice`() {'''
          )

          replace_once(
              plan,
              '''## Estado da solicitação atual\n\n- CUMPRIDO: localizar o botão discreto de sugestões/Instagram já existente.\n- CUMPRIDO: remover a dependência do estado do convite temporário para exibir o botão.\n- CUMPRIDO: atualizar o teste da política para exigir o botão em todos os estados do convite.\n- PRÓXIMO OBJETIVO: revisar a alteração e validar que somente o comportamento solicitado foi afetado.''',
              '''## Estado da solicitação atual\n\n- CUMPRIDO: tornar permanente o botão discreto de sugestões/Instagram.\n- CUMPRIDO: identificar que o bloqueio comum apenas abria a tela do HardBlock sobre o app bloqueado.\n- CUMPRIDO: fazer o fluxo de app bloqueado enviar o usuário para a Home antes de abrir a tela de bloqueio, com fallback explícito para o launcher se a ação global falhar.\n- CUMPRIDO: manter o bloqueio de sites fora dessa mudança.\n- PRÓXIMO OBJETIVO: validar testes, lint e compilação e revisar o diff antes de integrar na main.'''
          )
          PY

          git diff --check
      - name: Commit focused fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/test/java/com/focusguard/service/BlockingAccessibilityServiceIntentTest.kt \
            .agents/implementation_plan.md
          git rm -- .github/workflows/temp-evict-blocked-app.yml
          git commit -m "Fix blocked app foreground eviction"
          git push origin HEAD:fix/evict-blocked-app
