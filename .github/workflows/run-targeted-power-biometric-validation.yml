name: Run targeted power and biometric validation

on:
  push:
    branches:
      - fix/power-biometric-flow-20260926

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply the reviewed narrow patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/validate-targeted-power-biometric-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install Android 16 SDK"
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply_targeted_fix.py').write_text(body, encoding='utf-8')
          PY
          python3 /tmp/apply_targeted_fix.py

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile, unit test and lint
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-targeted-power-biometric-fix.yml
          rm -f .github/workflows/run-targeted-power-biometric-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix power actions and biometric unlock flow [validated-targeted-fix]"
          git push origin HEAD:fix/power-biometric-flow-20260926
