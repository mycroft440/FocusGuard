name: Run targeted power and biometric validation

on:
  push:
    branches:
      - fix/power-biometric-flow-20260926

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply the reviewed narrow patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/validate-targeted-power-biometric-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install Android 16 SDK"
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply_targeted_fix.py').write_text(body, encoding='utf-8')
          PY
          python3 /tmp/apply_targeted_fix.py

      - name: Add localized power confirmation text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          translations = {
              "values-de": "Tippe erneut auf %1$s, um zu bestätigen.",
              "values-hi": "पुष्टि करने के लिए %1$s पर फिर से टैप करें।",
              "values-ru": "Нажмите %1$s ещё раз для подтверждения.",
              "values-pt": "Toque em %1$s novamente para confirmar.",
              "values-pt-rBR": "Toque em %1$s novamente para confirmar.",
              "values-sw": "Gusa %1$s tena ili kuthibitisha.",
              "values-mr": "पुष्टी करण्यासाठी %1$s वर पुन्हा टॅप करा.",
              "values-en": "Tap %1$s again to confirm.",
              "values-bn": "নিশ্চিত করতে %1$s আবার ট্যাপ করুন।",
              "values-fr": "Appuyez de nouveau sur %1$s pour confirmer.",
              "values-es": "Toca %1$s de nuevo para confirmar.",
              "values-ar": "انقر على %1$s مرة أخرى للتأكيد.",
              "values-te": "నిర్ధారించడానికి %1$sపై మళ్లీ నొక్కండి.",
              "values-vi": "Nhấn lại %1$s để xác nhận.",
              "values-ja": "確認するには、%1$s をもう一度タップしてください。",
              "values-ha": "Taɓa %1$s kuma don tabbatarwa.",
              "values-id": "Ketuk %1$s lagi untuk mengonfirmasi.",
              "values-ur": "تصدیق کے لیے %1$s پر دوبارہ ٹیپ کریں۔",
          }

          for folder, text in translations.items():
              path = Path("app/src/main/res") / folder / "power_menu_strings.xml"
              if not path.exists():
                  raise SystemExit(f"Missing expected localized power menu file: {path}")
              content = path.read_text(encoding="utf-8")
              if 'name="protected_power_menu_confirm_action"' in content:
                  continue
              line = f'    <string name="protected_power_menu_confirm_action">{text}</string>\n'
              if "</resources>" not in content:
                  raise SystemExit(f"Malformed resource file: {path}")
              path.write_text(content.replace("</resources>", line + "</resources>", 1), encoding="utf-8")
          PY

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile, unit test and lint
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-targeted-power-biometric-fix.yml
          rm -f .github/workflows/run-targeted-power-biometric-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix power actions and biometric unlock flow [validated-targeted-fix]"
          git push origin HEAD:fix/power-biometric-flow-20260926
