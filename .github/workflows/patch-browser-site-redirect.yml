name: Patch browser site redirect

on:
  push:
    branches: ["fix/browser-site-redirect"]
    paths:
      - ".github/workflows/patch-browser-site-redirect.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/browser-site-redirect

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply browser redirect hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = service_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)

          replace_once(
              '''        internal var sanitizationRequested: Boolean = false,
                  internal var sanitizationRequestedAtUptimeMillis: Long = Long.MAX_VALUE,
                  internal var destinationRequested: Boolean = false,
              ''',
              '''        internal var sanitizationRequested: Boolean = false,
                  internal var sanitizationRequestedAtUptimeMillis: Long = Long.MAX_VALUE,
                  internal var externalRedirectRequested: Boolean = false,
                  internal var externalRedirectRequestedAtUptimeMillis: Long = Long.MAX_VALUE,
                  internal var destinationRequested: Boolean = false,
              ''',
              'transition external redirect state',
          )

          mark_anchor = '''        @Synchronized
              fun markDestinationRequested(
          '''
          external_method = '''        @Synchronized
              fun markExternalRedirectRequested(
                  browserPackageName: String,
                  transitionId: Long,
                  requestedAtUptimeMillis: Long
              ): Boolean {
                  val transition = activeTransitions[browserPackageName] ?: return false
                  if (transition.id != transitionId || transition.destinationRequested ||
                      requestedAtUptimeMillis < transition.detectionEventUptimeMillis
                  ) return false
                  transition.sanitizationRequested = true
                  transition.sanitizationRequestedAtUptimeMillis = requestedAtUptimeMillis
                  transition.externalRedirectRequested = true
                  transition.externalRedirectRequestedAtUptimeMillis = requestedAtUptimeMillis
                  return true
              }

          '''
          if mark_anchor not in text:
              raise SystemExit('destination marker not found')
          text = text.replace(mark_anchor, external_method + mark_anchor, 1)

          replace_once(
              '''                it.sanitizationRequested &&
                          (it.expectedWindowId == windowId || it.closeConfirmed) &&
                          eventUptimeMillis >= it.sanitizationRequestedAtUptimeMillis &&
              ''',
              '''                it.sanitizationRequested &&
                          (it.expectedWindowId == windowId ||
                              it.closeConfirmed ||
                              it.externalRedirectRequested) &&
                          eventUptimeMillis >= it.sanitizationRequestedAtUptimeMillis &&
              ''',
              'confirmation external window condition',
          )

          replace_once(
              '''            if (transition.id != transitionId || !transition.closeConfirmed ||
                      !transition.sanitizationRequested || windowId < 0 ||
                      eventUptimeMillis < transition.sanitizationRequestedAtUptimeMillis
                  ) return false
              ''',
              '''            if (transition.id != transitionId ||
                      (!transition.closeConfirmed && !transition.externalRedirectRequested) ||
                      !transition.sanitizationRequested || windowId < 0 ||
                      eventUptimeMillis < transition.sanitizationRequestedAtUptimeMillis
                  ) return false
              ''',
              'rebind external browser window',
          )

          replace_once(
              '''            val postCloseCandidate = transition.closeClickedAtUptimeMillis > 0L &&
                      eventUptimeMillis >= transition.closeClickedAtUptimeMillis
                  if (transition.expectedWindowId != windowId &&
                      !postCloseCandidate &&
                      !(transition.closeConfirmed && transition.sanitizationRequested)
                  ) return
              ''',
              '''            val postCloseCandidate = transition.closeClickedAtUptimeMillis > 0L &&
                      eventUptimeMillis >= transition.closeClickedAtUptimeMillis
                  val externalRedirectCandidate = transition.externalRedirectRequested &&
                      eventUptimeMillis >= transition.externalRedirectRequestedAtUptimeMillis
                  if (transition.expectedWindowId != windowId &&
                      !postCloseCandidate &&
                      !externalRedirectCandidate &&
                      !(transition.closeConfirmed && transition.sanitizationRequested)
                  ) return
              ''',
              'observe external browser window',
          )

          replace_once(
              '''            blockedWebsitesDomainSet = blockedWebsitesDomainSet + exceededRules
                  if (usage.packageName in browserPackages) {
                      blockWebsite(usage.packageName)
                  } else {
              ''',
              '''            blockedWebsitesDomainSet = blockedWebsitesDomainSet + exceededRules
                  if (usage.packageName in browserPackages) {
                      blockWebsite(
                          browserPackageName = usage.packageName,
                          blockedCandidate = usage.domain,
                          detectionEventUptimeMillis = SystemClock.uptimeMillis()
                      )
                  } else {
              ''',
              'usage limit website transition context',
          )

          replace_once(
              '''            showInstantBlockCurtain(mode = CurtainMode.BLOCK_NOTICE)
              ''',
              '''            showInstantBlockCurtain(
                      mode = CurtainMode.BLOCK_NOTICE,
                      messageRes = R.string.website_block_redirect_notice
                  )
              ''',
              'website blocking curtain message',
          )

          old_fallback = '''                // If the browser/API cannot expose a certifiable editable
                      // omnibox, restore and positively re-identify the original
                      // blocked surface before trying to close only that exact tab.
                      if (!redirectRequested) {
                          val blockedSurfaceRestored =
                              restoreBlockedSurfaceAfterAddressEdit(transition)
                          redirectRequested = blockedSurfaceRestored &&
                              closeBlockedTabAndRequestSafeGoogle(
                                  browserPackageName = browserPackageName,
                                  expectedWindowId = expectedWindowId,
                                  transition = transition
                              )
                      }
          '''
          new_fallback = '''                // If the browser/API cannot expose a certifiable editable
                      // omnibox, restore the page and use a package-scoped browser intent while
                      // the opaque curtain remains on top. This is deliberately browser-generic:
                      // Firefox, Samsung Internet and Chromium forks do not expose identical
                      // accessibility actions. If Back later reveals the old blocked history
                      // entry, the finished transition guard is already re-armed and the normal
                      // URL detector starts a brand-new block + redirect cycle.
                      if (!redirectRequested) {
                          val blockedSurfaceRestored =
                              restoreBlockedSurfaceAfterAddressEdit(transition)
                          redirectRequested = blockedSurfaceRestored &&
                              requestSafeGoogleThroughBrowserIntent(transition)
                      }

                      // Last resort for Chromium surfaces: close only the positively identified
                      // blocked tab before opening the safe destination. HOME remains the final
                      // fail-closed escape when no safe navigation can be confirmed.
                      if (!redirectRequested && !transition.externalRedirectRequested) {
                          redirectRequested = closeBlockedTabAndRequestSafeGoogle(
                              browserPackageName = browserPackageName,
                              expectedWindowId = expectedWindowId,
                              transition = transition
                          )
                      }
          '''
          replace_once(old_fallback, new_fallback, 'website redirect fallback flow')

          safe_surface_anchor = '''    private fun activeBrowserRoot(
          '''
          helper = '''    private fun currentBrowserSurfaceMatchesBlockedTransition(
              transition: WebsiteBlockTransitionHandle
          ): Boolean {
              val root = activeBrowserRoot(
                  transition.browserPackageName,
                  transition.expectedWindowId
              ) ?: return false
              val currentAddress = try {
                  WebsiteBlocker.extractUrlFromRoot(
                      root,
                      transition.browserPackageName,
                      isVerifiedHttpsHandler(transition.browserPackageName)
                  ) ?: WebsiteBlocker.extractAddressBarTextFromRoot(
                      root,
                      transition.browserPackageName,
                      isVerifiedHttpsHandler(transition.browserPackageName)
                  )
              } finally {
                  recycleSafely(root)
              }
              val detected = transition.blockedCandidate?.takeIf(String::isNotBlank)
                  ?: return false
              val detectedRule = WebsiteBlocker.findMatchingRule(
                  detected,
                  transition.blockedRules
              ) ?: return false
              val currentRule = currentAddress?.let {
                  WebsiteBlocker.findMatchingRule(it, transition.blockedRules)
              } ?: return false
              return detectedRule == currentRule
          }

          '''
          if safe_surface_anchor not in text:
              raise SystemExit('activeBrowserRoot anchor not found')
          text = text.replace(safe_surface_anchor, helper + safe_surface_anchor, 1)

          close_anchor = '''    private suspend fun closeBlockedTabAndRequestSafeGoogle(
          '''
          browser_intent_method = '''    private fun requestSafeGoogleThroughBrowserIntent(
              transition: WebsiteBlockTransitionHandle
          ): Boolean {
              if (!curtainReadyForTransition(transition) ||
                  !currentBrowserSurfaceMatchesBlockedTransition(transition)
              ) return false

              val requestedAt = SystemClock.uptimeMillis()
              if (!websiteBlockTransitionGuard.markExternalRedirectRequested(
                      browserPackageName = transition.browserPackageName,
                      transitionId = transition.id,
                      requestedAtUptimeMillis = requestedAt
                  )
              ) return false

              return runCatching {
                  startActivity(createSafeBrowserRedirectIntent(transition.browserPackageName))
                  true
              }.getOrElse { error ->
                  FocusGuardLogger.logError(
                      "A11y",
                      "Falha ao solicitar redirecionamento seguro no navegador",
                      error
                  )
                  false
              }
          }

          '''
          if close_anchor not in text:
              raise SystemExit('close fallback anchor not found')
          text = text.replace(close_anchor, browser_intent_method + close_anchor, 1)

          replace_once(
              '        internal const val WEBSITE_MIN_BLOCK_NOTICE_MILLIS = 120L\n',
              '        internal const val WEBSITE_MIN_BLOCK_NOTICE_MILLIS = 600L\n',
              'website notice visibility duration',
          )

          intent_anchor = '''        internal fun createBlockNoticeIntent(
          '''
          safe_intent = '''        internal fun createSafeBrowserRedirectIntent(
              browserPackageName: String
          ): Intent {
              require(browserPackageName.isNotBlank())
              return Intent(Intent.ACTION_VIEW, Uri.parse(SAFE_REDIRECT_URL)).apply {
                  addCategory(Intent.CATEGORY_BROWSABLE)
                  setPackage(browserPackageName)
                  addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK or
                          Intent.FLAG_ACTIVITY_CLEAR_TOP or
                          Intent.FLAG_ACTIVITY_SINGLE_TOP
                  )
              }
          }

          '''
          if intent_anchor not in text:
              raise SystemExit('block notice intent anchor not found')
          text = text.replace(intent_anchor, safe_intent + intent_anchor, 1)

          service_path.write_text(text)

          # Make the full-screen accessibility curtain explicitly communicate that
          # the blocked page is being redirected while browser UI automation runs beneath it.
          resources = [
              (
                  Path('app/src/main/res/values/strings.xml'),
                  '<string name="block_notice_instant_title">Blocked by HardBlock</string>\n',
                  '    <string name="website_block_redirect_notice">Site blocked. Redirecting to a safe page…</string>\n',
              ),
              (
                  Path('app/src/main/res/values-pt/strings.xml'),
                  '<string name="block_notice_instant_title">Bloqueado pelo HardBlock</string>\n',
                  '    <string name="website_block_redirect_notice">Site bloqueado. Redirecionando para uma página segura…</string>\n',
              ),
          ]
          for path, anchor, addition in resources:
              value = path.read_text()
              if anchor not in value:
                  raise SystemExit(f'resource anchor not found in {path}')
              value = value.replace(anchor, '    ' + anchor + addition if not anchor.startswith('    ') else anchor + addition, 1)
              # The anchor passed above intentionally omits indentation for robust matching;
              # normalize an accidental doubled indent if necessary.
              value = value.replace('        <string name="block_notice_instant_title">', '    <string name="block_notice_instant_title">', 1)
              path.write_text(value)

          test_path = Path('app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt')
          tests = test_path.read_text()

          old_notice = '''    @Test
              fun `website curtain perceptual minimum stays low latency`() {
                  assertThat(BlockingAccessibilityService.WEBSITE_MIN_BLOCK_NOTICE_MILLIS)
                      .isAtMost(150L)
              }
          '''
          new_notice = '''    @Test
              fun `website curtain remains visible while redirect starts immediately`() {
                  assertThat(BlockingAccessibilityService.WEBSITE_MIN_BLOCK_NOTICE_MILLIS)
                      .isAtLeast(400L)
                  assertThat(BlockingAccessibilityService.WEBSITE_MIN_BLOCK_NOTICE_MILLIS)
                      .isAtMost(1_000L)
              }
          '''
          if old_notice not in tests:
              raise SystemExit('website curtain duration test not found')
          tests = tests.replace(old_notice, new_notice, 1)

          insert_before = '''    @Test
              fun `Chromium capability policy is package based and rejects stale surfaces`() {
          '''
          new_tests = '''    @Test
              fun `browser intent redirect may confirm on a fresh window from the same browser`() {
                  val guard = BlockingAccessibilityService.WebsiteBlockTransitionGuard()
                  val transition = guard.tryStart(
                      FIREFOX_PACKAGE,
                      transitionId = 25L,
                      destination = BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
                      expectedWindowId = 7,
                      blockedCandidate = "https://facebook.com/feed",
                      blockedRules = setOf("facebook.com"),
                      detectionEventUptimeMillis = 100L
                  )!!
                  assertThat(
                      guard.markExternalRedirectRequested(
                          FIREFOX_PACKAGE,
                          transitionId = 25L,
                          requestedAtUptimeMillis = 110L
                      )
                  ).isTrue()

                  guard.observeBrowserEvent(
                      browserPackageName = FIREFOX_PACKAGE,
                      windowId = 8,
                      eventUptimeMillis = 111L,
                      eventType = AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED
                  )
                  assertThat(
                      guard.transitionForConfirmation(
                          FIREFOX_PACKAGE,
                          windowId = 8,
                          eventUptimeMillis = 111L,
                          eventType = AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED
                      )
                  ).isSameInstanceAs(transition)
                  assertThat(
                      guard.rebindPostCloseGoogleWindow(
                          FIREFOX_PACKAGE,
                          transitionId = 25L,
                          windowId = 8,
                          eventUptimeMillis = 111L
                      )
                  ).isTrue()
                  assertThat(guard.confirmGoogle(FIREFOX_PACKAGE, 8, 111L)).isTrue()
              }

              @Test
              fun `finished website transition re-arms the same browser for Back navigation`() {
                  val guard = BlockingAccessibilityService.WebsiteBlockTransitionGuard()
                  assertThat(
                      guard.tryStart(
                          CHROME_PACKAGE,
                          transitionId = 26L,
                          destination = BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
                          expectedWindowId = 7,
                          detectionEventUptimeMillis = 100L
                      )
                  ).isNotNull()
                  assertThat(guard.finish(CHROME_PACKAGE, transitionId = 26L)).isTrue()

                  assertThat(
                      guard.tryStart(
                          CHROME_PACKAGE,
                          transitionId = 27L,
                          destination = BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
                          expectedWindowId = 7,
                          detectionEventUptimeMillis = 200L
                      )
                  ).isNotNull()
              }

              @Test
              fun `safe redirect intent stays inside the browser that exposed the blocked site`() {
                  val intent = BlockingAccessibilityService.createSafeBrowserRedirectIntent(
                      FIREFOX_PACKAGE
                  )

                  assertThat(intent.action).isEqualTo(Intent.ACTION_VIEW)
                  assertThat(intent.data?.toString()).isEqualTo("https://www.google.com")
                  assertThat(intent.`package`).isEqualTo(FIREFOX_PACKAGE)
                  assertThat(intent.categories).contains(Intent.CATEGORY_BROWSABLE)
                  assertThat(intent.flags and Intent.FLAG_ACTIVITY_NEW_TASK).isNotEqualTo(0)
                  assertThat(intent.flags and Intent.FLAG_ACTIVITY_CLEAR_TOP).isNotEqualTo(0)
                  assertThat(intent.flags and Intent.FLAG_ACTIVITY_SINGLE_TOP).isNotEqualTo(0)
              }

          '''
          if insert_before not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(insert_before, new_tests + insert_before, 1)
          test_path.write_text(tests)
          PY

      - name: Run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.focusguard.service.WebsiteBlockNavigationTest --no-daemon --stacktrace

      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-browser-site-redirect.yml
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden blocked website redirect and re-entry"
          git push origin HEAD:fix/browser-site-redirect
