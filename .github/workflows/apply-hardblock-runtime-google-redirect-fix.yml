name: Apply HardBlock runtime Google redirect fix

on:
  push:
    branches:
      - fix/hardblock-runtime-google-redirect

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply runtime redirect fix
        run: python3 scripts/apply_hardblock_runtime_redirect_fix.py

      - name: Compile and test runtime redirect flow
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.focusguard.service.BrowserTransitionRaceTest' \
            --tests 'com.focusguard.service.ExternalRedirectNeutralizationTest' \
            --tests 'com.focusguard.service.WebsiteBlockNavigationTest' \
            --tests 'com.focusguard.service.BrowserInspectionCoordinatorTest' \
            --tests 'com.focusguard.accessibility.website.redirection.AddressBarRedirectionActionsPolicyTest' \
            --no-daemon

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-hardblock-runtime-google-redirect-fix.yml
          git rm scripts/apply_hardblock_runtime_redirect_fix.py
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
                  app/src/test/java/com/focusguard/service/BrowserTransitionRaceTest.kt \
                  app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git commit -m "Fix HardBlock runtime Google redirect handoff [runtime-redirect-fix-applied]"
          git push origin HEAD:fix/hardblock-runtime-google-redirect
