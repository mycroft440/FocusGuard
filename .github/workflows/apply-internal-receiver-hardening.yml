name: Apply internal receiver hardening patch

on:
  push:
    branches:
      - fix-internal-refresh-receiver-export

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-internal-refresh-receiver-export

      - name: Apply exact receiver hardening patch
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt")
          service = service_path.read_text()

          old_import = "import androidx.core.app.NotificationCompat\n"
          new_import = old_import + "import androidx.core.content.ContextCompat\n"
          assert service.count(old_import) == 1, "NotificationCompat import context changed"
          assert "import androidx.core.content.ContextCompat\n" not in service, "ContextCompat already imported"
          service = service.replace(old_import, new_import, 1)

          start_marker = "    private fun registerRefreshReceiver() {\n"
          end_marker = "\n    private fun registerScreenStateReceiver() {"
          assert service.count(start_marker) == 1, "refresh receiver function count changed"
          start = service.index(start_marker)
          end = service.index(end_marker, start)
          old_registration = service[start:end]
          required_fragments = (
              "addAction(ACTION_REFRESH_BLOCKING)",
              "addAction(ACTION_DEV_RELINQUISH_ACCESSIBILITY)",
              "registerReceiver(refreshReceiver, filter, Context.RECEIVER_NOT_EXPORTED)",
              "registerReceiver(refreshReceiver, filter)",
          )
          for fragment in required_fragments:
              assert fragment in old_registration, f"refresh receiver context missing: {fragment}"

          new_registration = (
              "    private fun registerRefreshReceiver() {\n"
              "        val filter = IntentFilter().apply {\n"
              "            addAction(ACTION_REFRESH_BLOCKING)\n"
              "            addAction(ACTION_DEV_RELINQUISH_ACCESSIBILITY)\n"
              "        }\n"
              "        ContextCompat.registerReceiver(\n"
              "            this,\n"
              "            refreshReceiver,\n"
              "            filter,\n"
              "            internalRefreshReceiverFlags()\n"
              "        )\n"
              "    }"
          )
          service = service[:start] + new_registration + service[end:]

          anchor = (
              "        internal fun createDevelopmentRelinquishIntent(context: Context): Intent =\n"
              "            Intent(ACTION_DEV_RELINQUISH_ACCESSIBILITY).setPackage(context.packageName)\n"
          )
          replacement = (
              "        internal fun internalRefreshReceiverFlags(): Int =\n"
              "            ContextCompat.RECEIVER_NOT_EXPORTED\n\n"
              "        internal fun createDevelopmentRelinquishIntent(context: Context): Intent =\n"
              "            Intent(ACTION_DEV_RELINQUISH_ACCESSIBILITY).setPackage(context.packageName)\n"
          )
          assert service.count(anchor) == 1, "companion receiver anchor changed"
          service = service.replace(anchor, replacement, 1)
          service_path.write_text(service)

          test_path = Path("app/src/test/java/com/focusguard/service/BlockingAccessibilityServiceIntentTest.kt")
          test = test_path.read_text()
          old_test_import = "import android.graphics.Rect\n"
          new_test_import = old_test_import + "import androidx.core.content.ContextCompat\n"
          assert test.count(old_test_import) == 1, "test import context changed"
          assert "import androidx.core.content.ContextCompat\n" not in test, "test ContextCompat already imported"
          test = test.replace(old_test_import, new_test_import, 1)

          test_anchor = (
              "    @Test\n"
              "    fun `development relinquish broadcast is package scoped`() {\n"
          )
          test_insert = (
              "    @Test\n"
              "    fun `internal refresh receiver is never exported to other apps`() {\n"
              "        assertThat(BlockingAccessibilityService.internalRefreshReceiverFlags())\n"
              "            .isEqualTo(ContextCompat.RECEIVER_NOT_EXPORTED)\n"
              "    }\n\n"
              "    @Test\n"
              "    fun `development relinquish broadcast is package scoped`() {\n"
          )
          assert test.count(test_anchor) == 1, "intent test anchor changed"
          test = test.replace(test_anchor, test_insert, 1)
          test_path.write_text(test)

      - name: Remove temporary patch workflow
        run: git rm .github/workflows/apply-internal-receiver-hardening.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
                  app/src/test/java/com/focusguard/service/BlockingAccessibilityServiceIntentTest.kt
          git diff --cached --check
          git commit -m "Protect internal accessibility refresh receiver"
          git push origin HEAD:fix-internal-refresh-receiver-export
