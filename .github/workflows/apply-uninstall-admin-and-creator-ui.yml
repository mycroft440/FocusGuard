name: Apply remaining creator UI fixes

on:
  push:
    branches:
      - fix/uninstall-admin-shortcut-and-creator-ui
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/fix/uninstall-admin-shortcut-and-creator-ui' || github.head_ref == 'fix/uninstall-admin-shortcut-and-creator-ui')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uninstall-admin-shortcut-and-creator-ui
          fetch-depth: 0

      - name: Apply remaining requested UI changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          nav = 'app/src/main/java/com/focusguard/ui/compose/navigation/FocusGuardNavHost.kt'
          replace_once(
              nav,
              '                    showCreatorInstagramCard = showCreatorInstagramCard,\n',
              '                    showCreatorInstagramCard = false,\n'
          )
          replace_once(
              nav,
              '                    showCreatorInstagramEntry = creatorInstagramPresented,\n',
              ''
          )

          main = 'app/src/main/java/com/focusguard/ui/compose/screens/MainScreen.kt'
          replace_once(
              main,
              '''private fun CreatorFeedbackButton(\n    onClick: () -> Unit,\n    compact: Boolean = false\n) {\n    Card(\n        onClick = onClick,\n        modifier = Modifier.fillMaxWidth(),\n''',
              '''private fun CreatorFeedbackButton(\n    onClick: () -> Unit,\n    compact: Boolean = false\n) {\n    val attentionTransition = rememberInfiniteTransition(label = "FeedbackAttention")\n    val attentionAlpha by attentionTransition.animateFloat(\n        initialValue = 1f,\n        targetValue = 0f,\n        animationSpec = infiniteRepeatable(\n            animation = keyframes {\n                durationMillis = 7_000\n                1f at 0\n                1f at 5_500\n                0f at 7_000 using LinearEasing\n            },\n            repeatMode = RepeatMode.Restart\n        ),\n        label = "FeedbackAttentionAlpha"\n    )\n\n    Card(\n        onClick = onClick,\n        modifier = Modifier\n            .fillMaxWidth()\n            .graphicsLayer { alpha = attentionAlpha },\n'''
          )

          plan = '.agents/implementation_plan.md'
          p = Path(plan)
          text = p.read_text(encoding='utf-8')
          if '14. Bloquear o atalho de Apps do administrador do dispositivo' not in text:
              text = text.replace(
                  '13. Proteger o menu de energia sem exigir Device Owner, bloqueando o gesto prolongado que aciona Modo Seguro e preservando desligar, reiniciar, emergência e informações médicas por cliques simples encaminhados ao System UI.\n',
                  '13. Proteger o menu de energia sem exigir Device Owner, bloqueando o gesto prolongado que aciona Modo Seguro e preservando desligar, reiniciar, emergência e informações médicas por cliques simples encaminhados ao System UI.\n'
                  '14. Bloquear o atalho de Apps do administrador do dispositivo exibido pelo System UI após uma tentativa de desinstalação enquanto houver proteção ativa.\n'
                  '15. Manter “Siga o criador no Instagram” como o último item acionável do menu de Configurações.\n'
                  '16. Aplicar o efeito de sumir gradualmente e reaparecer instantaneamente somente ao botão “Sugestões de melhorias ou funções” da tela Proteção.\n',
                  1
              )
          old_next = '- PRÓXIMO OBJETIVO: conferir o CI disponível e integrar a PR na `main`, mesmo que as validações ainda estejam em andamento, conforme a regra atual do FocusGuard.\n'
          if old_next in text:
              text = text.replace(
                  old_next,
                  '- CUMPRIDO: bloquear no System UI o clique do atalho de administrador do dispositivo exibido após falha de desinstalação.\n'
                  '- CUMPRIDO: manter “Siga o criador no Instagram” no fim das Configurações e ocultar seu antigo card temporário da tela Proteção.\n'
                  '- CUMPRIDO: aplicar exclusivamente ao botão de sugestões um ciclo de fade-out seguido de reaparecimento instantâneo.\n'
                  '- PRÓXIMO OBJETIVO: revisar o diff com o Crítico, validar testes/compilação disponíveis e integrar na `main` mesmo se o CI ainda estiver em andamento.\n',
                  1
              )
          p.write_text(text, encoding='utf-8')

          Path('.agents/trigger-uninstall-admin-creator-ui').unlink(missing_ok=True)
          Path('.github/workflows/apply-uninstall-admin-and-creator-ui.yml').unlink(missing_ok=True)
          PY

      - name: Commit remaining fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .agents/implementation_plan.md \
            .agents/trigger-uninstall-admin-creator-ui \
            .github/workflows/apply-uninstall-admin-and-creator-ui.yml \
            app/src/main/java/com/focusguard/ui/compose/navigation/FocusGuardNavHost.kt \
            app/src/main/java/com/focusguard/ui/compose/screens/MainScreen.kt
          git commit -m "Finish creator UI behavior"
          git push origin HEAD:fix/uninstall-admin-shortcut-and-creator-ui
