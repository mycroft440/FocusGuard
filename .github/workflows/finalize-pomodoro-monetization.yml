name: Finalize Pomodoro robustness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-pomodoro-monetization.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager 'platforms;android-36' >/dev/null || true

      - name: Apply reviewed Pomodoro robustness fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('app/src/main/java/com/focusguard/service/PomodoroForegroundService.kt')
          service = service_path.read_text()

          primary_old = """                } else {
                              alarmManager.set(AlarmManager.RTC_WAKEUP, triggerAt, pendingIntent)
                          }"""
          primary_new = """                } else {
                              scheduleInexactAllowWhileIdle(alarmManager, triggerAt, pendingIntent)
                          }"""
          if service.count(primary_old) != 1:
              raise SystemExit(f'primary fallback count={service.count(primary_old)}')
          service = service.replace(primary_old, primary_new, 1)

          security_old = """                runCatching {
                              alarmManager.set(AlarmManager.RTC_WAKEUP, triggerAt, pendingIntent)
                          }"""
          security_new = """                runCatching {
                              scheduleInexactAllowWhileIdle(alarmManager, triggerAt, pendingIntent)
                          }"""
          if service.count(security_old) != 1:
              raise SystemExit(f'security fallback count={service.count(security_old)}')
          service = service.replace(security_old, security_new, 1)

          anchor = "        fun cancelWatchdogAlarm(context: Context) {"
          helper = """        /**
                   * Fallback que continua elegível durante Doze sem exigir alarme exato.
                   */
                  private fun scheduleInexactAllowWhileIdle(
                      alarmManager: AlarmManager,
                      triggerAt: Long,
                      pendingIntent: PendingIntent
                  ) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          alarmManager.setAndAllowWhileIdle(
                              AlarmManager.RTC_WAKEUP,
                              triggerAt,
                              pendingIntent
                          )
                      } else {
                          alarmManager.set(AlarmManager.RTC_WAKEUP, triggerAt, pendingIntent)
                      }
                  }

          """
          if anchor not in service:
              raise SystemExit('helper anchor missing')
          service = service.replace(anchor, helper + anchor, 1)

          loop_old = """                    // O alarme fica continuamente armado. Enquanto o serviço está
                              // saudável ele é apenas renovado; se o processo morrer, a última
                              // reserva acorda o receiver e restaura o ciclo persistido.
                              scheduleWatchdogAlarm(applicationContext)"""
          loop_new = """                    // O watchdog já é armado no início, nas transições de fase,
                              // em onTaskRemoved() e onDestroy(). Evite regravar o AlarmManager
                              // a cada 2 segundos: reduz trabalho sem perder recuperação."""
          if service.count(loop_old) != 1:
              raise SystemExit(f'watchdog loop count={service.count(loop_old)}')
          service = service.replace(loop_old, loop_new, 1)
          service_path.write_text(service)

          manager_path = Path('app/src/main/java/com/focusguard/manager/PomodoroManager.kt')
          manager = manager_path.read_text()
          needle = 'ensureForegroundService = false'
          if manager.count(needle) != 2:
              raise SystemExit(f'phase transition count={manager.count(needle)}')
          manager = manager.replace(needle, 'ensureForegroundService = true')
          manager_path.write_text(manager)
          PY

      - name: Validate unit tests, lint and debug build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Commit final patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/finalize-pomodoro-monetization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/focusguard/service/PomodoroForegroundService.kt \
                  app/src/main/java/com/focusguard/manager/PomodoroManager.kt
          git commit -m 'fix: harden Pomodoro recovery after process death'
          git push origin HEAD:main
