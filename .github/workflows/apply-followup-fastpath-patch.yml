name: Apply follow-up fast path patch

on:
  push:
    branches: ["perf/cache-fast-path"]
    paths:
      - "tools/followup-fastpath.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-fast-path
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/followup-fastpath.patch
          git apply tools/followup-fastpath.patch
          rm tools/followup-fastpath.patch
          rm .github/workflows/apply-followup-fastpath-patch.yml
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add -u -- tools/followup-fastpath.patch .github/workflows/apply-followup-fastpath-patch.yml
          git commit -m "perf: use cached Device Owner maintenance decision"
          git push origin HEAD:perf/cache-fast-path
