name: Apply instant website blocking

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-instant-website-blocking.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Normalize current companion indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          s = p.read_text()
          old = "\n    internal fun settingsInterceptionEventTypesForTest(): Set<Int> =\n        settingsInterceptionEventTypes\n\n        internal fun settingsTransitionGuardMillisForTest(): Long =\n"
          new = "\n        internal fun settingsInterceptionEventTypesForTest(): Set<Int> =\n        settingsInterceptionEventTypes\n\n        internal fun settingsTransitionGuardMillisForTest(): Long =\n"
          if old not in s:
              raise SystemExit('expected companion indentation marker not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply instant website blocking patch
        run: python3 .github/scripts/apply_instant_website_blocking.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile lint and test
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin lintDebug testDebugUnitTest --stacktrace

      - name: Commit verified instant website blocking
        run: |
          rm -f .github/scripts/apply_instant_website_blocking.py
          rm -f .github/workflows/apply-instant-website-blocking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Torna bloqueio de sites instantâneo"
          git pull --rebase origin main
          git push origin HEAD:main
