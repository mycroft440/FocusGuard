name: Complete PR 170 integration

on:
  push:
    branches:
      - fix/async-a11y-inspection-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/async-a11y-inspection-20260916
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Finish async inspection integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          # Keep the accessibility callback primitive-only for browser work, update the
          # generation before any optional window lookup, and invalidate it with service
          # lifecycle changes.
          service_path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          service = service_path.read_text()

          service = replace_once(
              service,
              '''            val directPackage = event.packageName?.toString().orEmpty()\n            val inspectWindowEarly = directPackage.isBlank() ||\n                event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED\n            if (consumeInputUiEvent(event, directPackage, inspectWindowEarly)) return''',
              '''            val directPackage = event.packageName?.toString().orEmpty()\n            val browserInspectionEvent =\n                event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||\n                    event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED ||\n                    event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED ||\n                    event.eventType == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED ||\n                    event.eventType == AccessibilityEvent.TYPE_VIEW_FOCUSED\n            val observedWindowPackage = directPackage.ifBlank { foregroundPackageName.orEmpty() }\n            if ((event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||\n                    event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED) &&\n                observedWindowPackage.isNotBlank()\n            ) {\n                browserInspectionCoordinator.observeWindow(observedWindowPackage, event.windowId)\n            }\n            val inspectWindowEarly = directPackage.isBlank() ||\n                event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED\n            if (consumeInputUiEvent(event, directPackage, inspectWindowEarly)) return''',
              'advance browser generation before callback lookups'
          )

          service = replace_once(
              service,
              '''            val browserInspectionEvent = event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||\n                event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED ||\n                event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED ||\n                event.eventType == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED ||\n                event.eventType == AccessibilityEvent.TYPE_VIEW_FOCUSED\n            if (browserInspectionEvent && directPackage.isNotBlank()) {\n                if (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||\n                    event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED\n                ) {\n                    browserInspectionCoordinator.observeWindow(directPackage, event.windowId)\n                }\n                if (websiteSurfaceInspectionNeeded()) scheduleBrowserInspection(event, directPackage)\n            }''',
              '''            if (browserInspectionEvent && directPackage.isNotBlank() &&\n                websiteSurfaceInspectionNeeded()\n            ) {\n                scheduleBrowserInspection(event, directPackage)\n            }''',
              'queue browser inspection without duplicate generation observation'
          )

          service = replace_once(
              service,
              '''            val outcome = if (browserInspectionCoordinator.isCurrent(snapshot.token)) {\n                inspectBrowserSnapshot(snapshot)\n            } else null''',
              '''            val outcome = if (browserInspectionCoordinator.isCurrent(\n                    snapshot.token,\n                    requireLatestSequence = true\n                )\n            ) {\n                inspectBrowserSnapshot(snapshot)\n            } else null''',
              'skip stale same-window inspection before work'
          )

          plain_current = 'browserInspectionCoordinator.isCurrent(token)'
          if plain_current not in service:
              raise SystemExit('latest-sequence checks: no generation-only token checks found')
          service = service.replace(
              plain_current,
              'browserInspectionCoordinator.isCurrent(token, requireLatestSequence = true)'
          )

          service = replace_once(
              service,
              '''                    isVerifiedHttpsHandler(token.packageName),\n                    requireUnique = false\n                )\n            BrowserInspectionOutcome(''',
              '''                    isVerifiedHttpsHandler(token.packageName),\n                    requireUnique = false\n                )\n            if (!browserInspectionCoordinator.isCurrent(\n                    token,\n                    requireLatestSequence = true\n                )\n            ) return null\n            BrowserInspectionOutcome(''',
              'revalidate after editor inspection'
          )

          service = replace_once(
              service,
              '''    override fun onServiceConnected() {\n        super.onServiceConnected()\n        accessibilityServiceConnected = true''',
              '''    override fun onServiceConnected() {\n        super.onServiceConnected()\n        browserInspectionCoordinator.invalidate()\n        accessibilityServiceConnected = true''',
              'invalidate browser inspection on service connect'
          )

          service = replace_once(
              service,
              '''                Intent.ACTION_SCREEN_OFF -> {\n                    foregroundPackageName = null\n                    stopWebsiteTracking()''',
              '''                Intent.ACTION_SCREEN_OFF -> {\n                    browserInspectionCoordinator.invalidate()\n                    foregroundPackageName = null\n                    stopWebsiteTracking()''',
              'invalidate browser inspection on screen off'
          )

          service = replace_once(
              service,
              '''    override fun onInterrupt() {\n        foregroundPackageName = null\n        stopWebsiteTracking()''',
              '''    override fun onInterrupt() {\n        browserInspectionCoordinator.invalidate()\n        foregroundPackageName = null\n        stopWebsiteTracking()''',
              'invalidate browser inspection on interrupt'
          )

          service = replace_once(
              service,
              '''    override fun onDestroy() {\n        accessibilityServiceConnected = false\n        stopWebsiteTracking()''',
              '''    override fun onDestroy() {\n        browserInspectionCoordinator.invalidate()\n        accessibilityServiceConnected = false\n        stopWebsiteTracking()''',
              'invalidate browser inspection on destroy'
          )

          # Every redirect action tied to a WebsiteBlockTransitionHandle receives the
          # generation predicate. Read-only editor checks remain unchanged.
          service = replace_once(
              service,
              '''                AddressBarRedirectionActions.activate(root, browserPackageName, expectedWindowId, action, https)''',
              '''                AddressBarRedirectionActions.activate(\n                    root, browserPackageName, expectedWindowId, action, https,\n                    isCurrent = { curtainReadyForTransition(transition) }\n                )''',
              'activate action freshness'
          )

          service = replace_once(
              service,
              '''                        AddressBarRedirectionActions.selectAll(selectionRoot, browserPackageName, expectedWindowId, https)''',
              '''                        AddressBarRedirectionActions.selectAll(\n                            selectionRoot, browserPackageName, expectedWindowId, https,\n                            isCurrent = { curtainReadyForTransition(transition) }\n                        )''',
              'selection action freshness'
          )

          service = replace_once(
              service,
              '''                        BrowserWriteMethod.SET_TEXT -> AddressBarRedirectionActions.setText(\n                            editRoot, browserPackageName, expectedWindowId, SAFE_REDIRECT_URL, https)\n                        BrowserWriteMethod.PASTE -> ClipboardPasteFallback.pasteSafely(SAFE_REDIRECT_URL) {\n                            AddressBarRedirectionActions.paste(editRoot, browserPackageName, expectedWindowId, https)\n                        }''',
              '''                        BrowserWriteMethod.SET_TEXT -> AddressBarRedirectionActions.setText(\n                            editRoot, browserPackageName, expectedWindowId, SAFE_REDIRECT_URL, https,\n                            isCurrent = { curtainReadyForTransition(transition) }\n                        )\n                        BrowserWriteMethod.PASTE -> ClipboardPasteFallback.pasteSafely(SAFE_REDIRECT_URL) {\n                            AddressBarRedirectionActions.paste(\n                                editRoot, browserPackageName, expectedWindowId, https,\n                                isCurrent = { curtainReadyForTransition(transition) }\n                            )\n                        }''',
              'write action freshness'
          )

          service = replace_once(
              service,
              '''                    BrowserSubmitMethod.IME_ENTER -> AddressBarRedirectionActions.submitImeEnter(\n                        root, browserPackageName, expectedWindowId, ::isSafeGoogleRedirectSurface, https)\n                    BrowserSubmitMethod.ANNOUNCED_EDITOR_ACTION -> AddressBarRedirectionActions.submitAnnouncedEditorAction(\n                        root, browserPackageName, expectedWindowId, ::isSafeGoogleRedirectSurface, https)\n                    BrowserSubmitMethod.CERTIFIED_GO_BUTTON -> AddressBarRedirectionActions.clickCertifiedGoButton(\n                        root, browserPackageName, expectedWindowId)''',
              '''                    BrowserSubmitMethod.IME_ENTER -> AddressBarRedirectionActions.submitImeEnter(\n                        root, browserPackageName, expectedWindowId, ::isSafeGoogleRedirectSurface, https,\n                        isCurrent = { curtainReadyForTransition(transition) }\n                    )\n                    BrowserSubmitMethod.ANNOUNCED_EDITOR_ACTION -> AddressBarRedirectionActions.submitAnnouncedEditorAction(\n                        root, browserPackageName, expectedWindowId, ::isSafeGoogleRedirectSurface, https,\n                        isCurrent = { curtainReadyForTransition(transition) }\n                    )\n                    BrowserSubmitMethod.CERTIFIED_GO_BUTTON -> AddressBarRedirectionActions.clickCertifiedGoButton(\n                        root, browserPackageName, expectedWindowId,\n                        isCurrent = { curtainReadyForTransition(transition) }\n                    )''',
              'submit action freshness'
          )

          service = replace_once(
              service,
              '''                    if (verified) {\n                        transition.editorAddressViewId = written.selectedViewId\n                        BrowserCompatibilityStore.recordActivationSuccess(''',
              '''                    if (verified) {\n                        if (!curtainReadyForTransition(transition)) return 0L\n                        transition.editorAddressViewId = written.selectedViewId\n                        BrowserCompatibilityStore.recordActivationSuccess(''',
              'guard activation compatibility learning'
          )

          service = replace_once(
              service,
              '''            BrowserCompatibilityStore.recordSubmitAccepted(browserPackageName, submitted.selectedViewId, method)\n            websiteBlockTransitionGuard.markSanitizationRequested(browserPackageName, transition.id, submittedAt)''',
              '''            if (!curtainReadyForTransition(transition)) return 0L\n            BrowserCompatibilityStore.recordSubmitAccepted(browserPackageName, submitted.selectedViewId, method)\n            websiteBlockTransitionGuard.markSanitizationRequested(browserPackageName, transition.id, submittedAt)''',
              'guard submit compatibility learning'
          )

          service_path.write_text(service)

          # Preserve compatibility for synchronous legacy callers, while requiring the
          # async pipeline to explicitly pass freshness into the shared action primitive.
          actions_path = Path('app/src/main/java/com/focusguard/accessibility/website/redirection/AddressBarRedirectionActions.kt')
          actions = actions_path.read_text()
          signature = '        isCurrent: () -> Boolean\n    )'
          signature_count = actions.count(signature)
          if signature_count != 9:
              raise SystemExit(f'AddressBar freshness defaults: expected 9 signatures, got {signature_count}')
          actions = actions.replace(signature, '        isCurrent: () -> Boolean = { true }\n    )')
          actions = replace_once(
              actions,
              '''            httpsHandlerRecognized = httpsHandlerRecognized,\n            allowFallbacks = false\n        )''',
              '''            httpsHandlerRecognized = httpsHandlerRecognized,\n            allowFallbacks = false,\n            isCurrent = isCurrent\n        )''',
              'forward freshness into WebsiteBlocker'
          )
          actions_path.write_text(actions)

          blocker_path = Path('app/src/main/java/com/focusguard/utils/WebsiteBlocker.kt')
          blocker = blocker_path.read_text()
          blocker = replace_once(
              blocker,
              '''        httpsHandlerRecognized: Boolean = false,\n        allowFallbacks: Boolean = true\n    ): AddressBarActionResult {\n        if (root.packageName?.toString() != browserPackageName ||''',
              '''        httpsHandlerRecognized: Boolean = false,\n        allowFallbacks: Boolean = true,\n        isCurrent: () -> Boolean = { true }\n    ): AddressBarActionResult {\n        if (!isCurrent()) return AddressBarActionResult(AddressBarActionStatus.REJECTED)\n        if (root.packageName?.toString() != browserPackageName ||''',
              'WebsiteBlocker freshness parameter'
          )
          blocker = replace_once(
              blocker,
              '''            val selected = nodes[selectedIndex]\n            if (allowFallbacks && requiredAction == BrowserUiCapabilityPolicy.NodeAction.SET_TEXT) {''',
              '''            val selected = nodes[selectedIndex]\n            if (!isCurrent()) return AddressBarActionResult(AddressBarActionStatus.REJECTED)\n            if (allowFallbacks && requiredAction == BrowserUiCapabilityPolicy.NodeAction.SET_TEXT) {''',
              'WebsiteBlocker freshness before selected-node actions'
          )
          blocker = replace_once(
              blocker,
              '''                runCatching { selected.performAction(androidAction, arguments) }\n                    .getOrDefault(false)\n            }\n\n            if (accepted) {''',
              '''                if (!isCurrent()) return AddressBarActionResult(AddressBarActionStatus.REJECTED)\n                val actionAccepted = runCatching {\n                    selected.performAction(androidAction, arguments)\n                }.getOrDefault(false)\n                if (!isCurrent()) return AddressBarActionResult(AddressBarActionStatus.REJECTED)\n                actionAccepted\n            }\n\n            if (!isCurrent()) return AddressBarActionResult(AddressBarActionStatus.REJECTED)\n            if (accepted) {''',
              'WebsiteBlocker freshness around performAction'
          )
          blocker_path.write_text(blocker)

          recovery_path = Path('app/src/main/java/com/focusguard/accessibility/website/identification/WebsiteIdentificationRecovery.kt')
          recovery = recovery_path.read_text()
          recovery = replace_once(
              recovery,
              '''                            httpsHandlerRecognized = httpsHandlerRecognized,\n                            allowFallbacks = false\n                        ).accepted''',
              '''                            httpsHandlerRecognized = httpsHandlerRecognized,\n                            allowFallbacks = false,\n                            isCurrent = isCurrent\n                        ).accepted''',
              'recovery action freshness'
          )
          recovery_path.write_text(recovery)

          tests_path = Path('app/src/test/java/com/focusguard/service/BrowserInspectionCoordinatorTest.kt')
          tests = tests_path.read_text()
          tests = replace_once(
              tests,
              'import org.junit.Assert.assertNotEquals\nimport org.junit.Assert.assertSame',
              'import org.junit.Assert.assertNotEquals\nimport org.junit.Assert.assertNull\nimport org.junit.Assert.assertSame',
              'coordinator test assertNull import'
          )
          if 'fun invalidateDropsPendingWorkAndOldGeneration()' in tests:
              raise SystemExit('coordinator invalidation test already exists unexpectedly')
          marker = '\n}'
          index = tests.rfind(marker)
          if index < 0:
              raise SystemExit('coordinator test closing brace not found')
          new_test = '''\n\n    @Test\n    fun invalidateDropsPendingWorkAndOldGeneration() {\n        val coordinator = BrowserInspectionCoordinator()\n        val running = coordinator.offer(\n            "com.android.chrome", 10, 2048, 1L, 1L, "", emptyList(), null\n        )\n        assertSame(running.snapshot, coordinator.takePending())\n        coordinator.offer(\n            "com.android.chrome", 10, 2048, 2L, 2L, "", listOf("pending"), null\n        )\n\n        coordinator.invalidate()\n\n        assertFalse(coordinator.isCurrent(running.snapshot.token))\n        assertNull(coordinator.finishPass())\n        val replacement = coordinator.offer(\n            "com.android.chrome", 11, 2048, 3L, 3L, "", emptyList(), null\n        )\n        assertTrue(replacement.startWorker)\n        assertTrue(coordinator.isCurrent(replacement.snapshot.token, requireLatestSequence = true))\n    }'''
          tests = tests[:index] + new_test + tests[index:]
          tests_path.write_text(tests)
          PY

      - name: Run unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Commit completed Part 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/complete-pr170.yml
          git add \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/main/java/com/focusguard/accessibility/website/identification/WebsiteIdentificationRecovery.kt \
            app/src/main/java/com/focusguard/accessibility/website/redirection/AddressBarRedirectionActions.kt \
            app/src/main/java/com/focusguard/utils/WebsiteBlocker.kt \
            app/src/test/java/com/focusguard/service/BrowserInspectionCoordinatorTest.kt
          git diff --cached --check
          git commit -m "fix(a11y): complete async inspection foundation"
          git push origin HEAD:fix/async-a11y-inspection-20260916
