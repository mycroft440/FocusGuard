name: Patch instant layer handoffs

on:
  push:
    branches:
      - fix/instant-layer-handoffs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-layer-handoffs
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Repair patch anchors
        run: python3 tools/fix_patch_script.py

      - name: Apply patch
        run: python3 tools/patch_instant_layer_handoffs.py

      - name: Run hierarchy regression tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.focusguard.service.HierarchyBoundaryPolicyTest' --tests 'com.focusguard.service.WebsiteProtectionHierarchyPolicyTest' --tests 'com.focusguard.utils.WebsiteBlockerGrantIndependentMatchingTest' --tests 'com.focusguard.service.AppBlockSurfaceResolverClosureTest'

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-instant-layer-handoffs.yml tools/patch_instant_layer_handoffs.py tools/fix_patch_script.py
          git add app/src/main/java app/src/test/java
          git commit -m 'Make protection hierarchy handoffs immediate'
          git push origin HEAD:fix/instant-layer-handoffs
