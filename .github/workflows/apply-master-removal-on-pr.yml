name: Apply master removal patch on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/master-removal-gate-and-antiporn-restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply requested restoration and master gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_master_removal_fix.py
          git diff --check
          git status --short
          if git diff --quiet; then
            echo 'No code changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .agents/implementation_plan.md \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/focusguard/security/ManagedSelfProtectionPolicy.kt \
            app/src/main/java/com/focusguard/security/SettingsInterceptionPolicy.kt \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/main/java/com/focusguard/ui/MasterRemovalActivity.kt \
            app/src/main/java/com/focusguard/ui/compose/screens/RecoveryCourseGatewayScreen.kt \
            app/src/main/res/values/strings_recovery_course.xml \
            app/src/main/res/values-en/strings_recovery_course.xml \
            app/src/main/res/values-pt/strings_recovery_course.xml \
            app/src/main/res/values/strings_master_removal.xml \
            app/src/main/res/values-en/strings_master_removal.xml \
            app/src/main/res/values-pt/strings_master_removal.xml \
            app/src/test/java/com/focusguard/security/ManagedSelfProtectionPolicyTest.kt \
            app/src/test/java/com/focusguard/security/SettingsInterceptionPolicyTest.kt
          git commit -m 'Restore AntiPorn and add master removal gate'
          git push origin HEAD:${{ github.head_ref }}
