name: Restore website blocking 601f93e

on:
  push:
    branches:
      - restore/website-blocking-601f93e
    paths:
      - .agents/apply_website_blocking_601f93e_restore.py
      - .github/workflows/restore-website-blocking-601f93e.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/website-blocking-601f93e
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply mapped restoration
        run: python3 .agents/apply_website_blocking_601f93e_restore.py
      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':!.agents/apply_website_blocking_601f93e_restore.py' ':!.github/workflows/restore-website-blocking-601f93e.yml' >/dev/null || true
      - run: chmod +x gradlew
      - name: Run focused website blocking regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace \
            --tests "com.focusguard.accessibility.website.redirection.WebsiteRedirectionCoordinatorTest" \
            --tests "com.focusguard.accessibility.website.redirection.WebsiteRedirectionPlanTest" \
            --tests "com.focusguard.service.WebsiteBlockNavigationTest"
      - name: Remove temporary restoration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .agents/apply_website_blocking_601f93e_restore.py
          rm .github/workflows/restore-website-blocking-601f93e.yml
      - name: Commit restored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FocusGuard Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore 601f93e website blocking behavior"
          git push origin HEAD:restore/website-blocking-601f93e
