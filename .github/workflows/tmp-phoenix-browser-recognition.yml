name: Temporary Phoenix browser recognition fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tmp-phoenix-browser-recognition.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Add Phoenix recognition and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        "com.UCMobile.intl",\n        "com.UCMobile.intl.mi",\n        "org.mozilla.firefox",\n'''
          new = '''        "com.UCMobile.intl",\n        "com.UCMobile.intl.mi",\n        "com.transsion.phoenix",\n        "org.mozilla.firefox",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Unexpected Phoenix insertion anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
          ./gradlew :app:lintDebug --no-daemon --stacktrace

          rm -f .github/workflows/tmp-phoenix-browser-recognition.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(web): recognize Phoenix browser explicitly"
          git push origin HEAD:main
