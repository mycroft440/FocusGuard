name: Bootstrap EasyPeasy translations

on:
  push:
    branches:
      - feat/easypeasy-translations
    paths:
      - .github/workflows/bootstrap-easypeasy-translations.yml

permissions:
  contents: write

jobs:
  bundle-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and validate official EasyPeasy PDFs
        shell: bash
        run: |
          set -euo pipefail
          dir="app/src/main/assets/easypeasy/translations"
          mkdir -p "$dir"

          jq -r '.translations[] | [.file, .source] | @tsv' "$dir/catalog.json" |
          while IFS=$'\t' read -r file url; do
            echo "Downloading $file"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "FocusGuard EasyPeasy offline bundle" \
              --output "$dir/$file.tmp" "$url"
            test -s "$dir/$file.tmp"
            test "$(head -c 5 "$dir/$file.tmp")" = "%PDF-"
            mv "$dir/$file.tmp" "$dir/$file"
          done

          test "$(find "$dir" -maxdepth 1 -type f -name 'easypeasy_*.pdf' | wc -l)" -eq 19
          du -sh "$dir"

      - name: Run focused asset test
        run: ./gradlew :app:testDebugUnitTest --tests com.focusguard.ui.OfflineBookAssetsTest

      - name: Verify debug build
        run: ./gradlew :app:assembleDebug

      - name: Commit bundled PDFs and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/bootstrap-easypeasy-translations.yml
          git add app/src/main/assets/easypeasy/translations
          git diff --cached --stat

          git commit -m "Bundle official EasyPeasy translation PDFs"
          git push
