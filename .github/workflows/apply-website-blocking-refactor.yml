name: Apply Website Blocking Refactor

on:
  push:
    branches:
      - refactor/website-blocking-pipeline
    paths:
      - .github/workflows/apply-website-blocking-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/website-blocking-pipeline
          fetch-depth: 0

      - name: Apply coordinator extraction
        run: python3 .github/scripts/apply_website_blocking_refactor.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit generated refactor
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          git commit -m "refactor: move redirect sequence into coordinator"
          git push origin HEAD:refactor/website-blocking-pipeline
