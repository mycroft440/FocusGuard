name: Website test cleanup

on:
  push:
    branches:
      - refactor/website-blocking-pipeline

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[website-test-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-blocking-pipeline
          fetch-depth: 0

      - name: Remove obsolete tab-close test remnants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_test(text: str, name: str, replacement: str) -> str:
              marker = f"    @Test\n    fun `{name}`() {{"
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"test not found: {name}")
              next_test = text.find("    @Test", start + len(marker))
              if next_test < 0:
                  raise SystemExit(f"next test not found after: {name}")
              return text[:start] + replacement.rstrip() + "\n\n" + text[next_test:]

          def remove_test(text: str, name: str) -> str:
              return replace_test(text, name, "")

          service_path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          service = service_path.read_text()
          service, count = re.subn(
              r'\n        private val CHROMIUM_TAB_SWITCHER_ENTRY_NAMES = listOf\([\s\S]*?'
              r'        private const val WEBSITE_TAB_CLOSE_CONFIRM_MILLIS = 180L\n',
              '\n',
              service,
              count=1,
          )
          if count != 1:
              raise SystemExit('obsolete tab-close constants were not removed')
          service, count = re.subn(
              r'\n        internal fun chromiumTabSwitcherEntryNamesForTest\(\): List<String> =\n'
              r'            CHROMIUM_TAB_SWITCHER_ENTRY_NAMES\n',
              '\n',
              service,
              count=1,
          )
          if count != 1:
              raise SystemExit('obsolete tab-switcher helper was not removed')
          service_path.write_text(service)

          test_path = Path('app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt')
          test = test_path.read_text()
          test = replace_test(
              test,
              'Chromium capability policy is package based and rejects stale surfaces',
              '''    @Test
              fun `same tab policy is package and window bound`() {
                  val browserPackage = "org.example.chromium.fork"
                  val policy = WebsiteTabNeutralizationPolicy(
                      browserPackageName = browserPackage,
                      expectedWindowId = 7
                  )

                  assertThat(policy.mayTouchBlockedTab(browserPackage, 7)).isTrue()
                  assertThat(
                      policy.mayActivateBlockedAddressBar(
                          browserPackage,
                          activeWindowId = 7,
                          phaseStartedAtUptimeMillis = 100L,
                          latestWindowTransitionEventUptimeMillis = 101L
                      )
                  ).isTrue()
                  assertThat(policy.mayTouchBlockedTab(browserPackage, 8)).isFalse()
                  assertThat(policy.mayTouchBlockedTab(CHROME_PACKAGE, 7)).isFalse()

                  policy.markSafeAddressSet(200L)
                  assertThat(policy.mayTouchBlockedTab(browserPackage, 7)).isFalse()
                  assertThat(
                      policy.maySubmitSafeAddress(
                          browserPackage,
                          activeWindowId = 7,
                          latestWindowTransitionEventUptimeMillis = 200L
                      )
                  ).isTrue()
                  policy.markRedirectRequested()
                  assertThat(
                      policy.maySubmitSafeAddress(
                          browserPackage,
                          activeWindowId = 7,
                          latestWindowTransitionEventUptimeMillis = 201L
                      )
                  ).isFalse()
              }'''
          )
          test = remove_test(
              test,
              'Chromium tab closing supports Brave top and bottom tab switchers'
          )
          test = replace_test(
              test,
              'normal transition hides only after Google was sanitized',
              '''    @Test
              fun `normal transition hides only after redirect was confirmed`() {
                  val machine = WebsiteRedirectionCoordinator.Session(strict = false)

                  machine.begin()
                  assertThat(machine.afterRedirectConfirmed()).isEqualTo(
                      WebsiteRedirectionCoordinator.Action.HIDE_BLOCK_PRESENTATION
                  )
              }'''
          )
          test = replace_test(
              test,
              'strict transition opens Pomodoro only after Google sanitization',
              '''    @Test
              fun `strict transition opens Pomodoro only after redirect confirmation`() {
                  val machine = WebsiteRedirectionCoordinator.Session(strict = true)

                  machine.begin()
                  assertThat(machine.afterRedirectConfirmed()).isEqualTo(
                      WebsiteRedirectionCoordinator.Action.OPEN_POMODORO
                  )
                  assertThat(machine.onPomodoroConfirmed()).isEqualTo(
                      WebsiteRedirectionCoordinator.Action.HIDE_BLOCK_PRESENTATION
                  )
              }'''
          )
          test = test.replace(
              'fun `close click alone never authorizes destination`() {',
              'fun `redirect remains fail closed until destination confirmation`() {'
          )
          test_path.write_text(test)

          docs_path = Path('docs/WEBSITE_BLOCKING_ARCHITECTURE.md')
          docs = docs_path.read_text()
          docs = docs.replace(
              'O fluxo não abre outra aba como substituto do redirecionamento na aba bloqueada. O fallback externo permanece desabilitado enquanto não puder provar a neutralização da aba original.',
              'O fluxo não abre outra aba como substituto do redirecionamento na aba bloqueada. Não existe fallback externo por `ACTION_VIEW`: ao esgotar as tentativas certificáveis na mesma aba, o fluxo permanece fail-closed.'
          )
          docs_path.write_text(docs)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
                  app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt \
                  docs/WEBSITE_BLOCKING_ARCHITECTURE.md
          git commit -m "test: align website tests with final architecture [website-test-cleanup]"
          git push origin HEAD:refactor/website-blocking-pipeline
