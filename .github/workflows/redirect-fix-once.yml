name: Redirect Fix Once

on:
  push:
    branches: ["automation/fix-website-redirect"]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/fix-website-redirect
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply targeted patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_redirect_fix_once.py
          python3 scripts/apply_redirect_fix_guard_once.py
      - name: Compile modified app code
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon --stacktrace
      - name: Test redirection coordinator
        shell: bash
        run: ./gradlew testDebugUnitTest --tests "com.focusguard.accessibility.website.redirection.WebsiteRedirectionCoordinatorTest" --no-daemon --stacktrace
      - name: Test address bar redirection policy
        shell: bash
        run: ./gradlew testDebugUnitTest --tests "com.focusguard.accessibility.website.redirection.AddressBarRedirectionActionsPolicyTest" --no-daemon --stacktrace
      - name: Test redirection timing plan
        shell: bash
        run: ./gradlew testDebugUnitTest --tests "com.focusguard.accessibility.website.redirection.WebsiteRedirectionPlanTest" --no-daemon --stacktrace
      - name: Test Firefox redirection regression coverage
        shell: bash
        run: ./gradlew testDebugUnitTest --tests "com.focusguard.service.FirefoxWebsiteRedirectReliabilityTest" --no-daemon --stacktrace
      - name: Run full unit test suite
        shell: bash
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redirect-fix-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 1
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/redirect-fix-once.yml \
            scripts/apply_redirect_fix_once.py \
            scripts/apply_redirect_fix_guard_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix website redirect recovery and fallback sequencing"
          git push origin HEAD:automation/fix-website-redirect
