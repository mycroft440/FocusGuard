name: Redirect Fix Once

on:
  push:
    branches: ["automation/fix-website-redirect"]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/fix-website-redirect
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply targeted patch
        shell: bash
        run: python3 scripts/apply_redirect_fix_once.py
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/redirect-fix-once.yml scripts/apply_redirect_fix_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix website redirect recovery and fallback sequencing"
          git push origin HEAD:automation/fix-website-redirect
