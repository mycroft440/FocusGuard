name: Apply async accessibility refactor

on:
  push:
    branches:
      - fix/async-a11y-inspection-20260916
    paths:
      - scripts/apply_async_a11y_refactor.py
      - .github/workflows/apply-async-a11y-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/async-a11y-inspection-20260916
          fetch-depth: 0
      - name: Apply guarded source transformation
        run: python3 scripts/apply_async_a11y_refactor.py
      - name: Verify transformation changed only intended service flow
        run: |
          git diff --check
          git diff -- app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
      - name: Commit transformed service
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git commit -m "refactor(a11y): move browser inspection off main callback"
          git push origin HEAD:fix/async-a11y-inspection-20260916
