name: Apply website block latency patch

on:
  push:
    branches: ["fix/website-block-detection-latency"]
    paths:
      - ".github/workflows/apply-website-block-latency-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-block-detection-latency
          fetch-depth: 0

      - name: Apply scoped code changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              file.write_text(text.replace(old, new, 1))

          policy = "app/src/main/java/com/focusguard/utils/BrowserUiCapabilityPolicy.kt"
          replace_once(
              policy,
              '''        return node.editable && browserOwnedResource &&
            (node.uriInput || idLooksNative)
''',
              '''        val displayLooksAddressLike = node.text.orEmpty().trim().let { value ->
            value.isNotEmpty() &&
                value.none(Char::isWhitespace) &&
                (value.contains("://") || value.contains('.'))
        }
        return browserOwnedResource && idLooksNative &&
            (node.editable || node.uriInput || displayLooksAddressLike)
'''
          )

          service = "app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt"
          replace_once(
              service,
              '''            routeWebsiteBlockByHierarchy(
                browserPackageName = currentPackage,
                browserWindowId = windowId,
                blockedCandidate = blockedCandidate,
                detectionEventUptimeMillis = SystemClock.uptimeMillis()
            )
''',
              '''            routeWebsiteBlockByHierarchy(
                browserPackageName = currentPackage,
                browserWindowId = windowId,
                blockedCandidate = blockedCandidate,
                detectionEventUptimeMillis = SystemClock.uptimeMillis(),
                browserWindowIdValidated = true
            )
'''
          )
          replace_once(
              service,
              '''        routeWebsiteBlockByHierarchy(
            browserPackageName = packageName,
            browserWindowId = event.windowId,
            blockedCandidate = url ?: addressText ?: blockedCandidate,
            detectionEventUptimeMillis = event.eventTime
        )
        return true
''',
              '''        routeWebsiteBlockByHierarchy(
            browserPackageName = packageName,
            browserWindowId = event.windowId,
            blockedCandidate = url ?: addressText ?: blockedCandidate,
            detectionEventUptimeMillis = event.eventTime,
            browserWindowIdValidated = true
        )
        return true
'''
          )
          replace_once(
              service,
              '''        val root = if (fastUrl == null) rootInActiveWindow ?: event.source else null
        val url = fastUrl ?: WebsiteBlocker.extractUrlFromRoot(
            root,
            packageName,
            isVerifiedHttpsHandler(packageName)
        )
        val addressText = fastAddressText
            ?: WebsiteBlocker.extractAddressBarTextFromRoot(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )
        val addressBarObservable = fastAddressText != null ||
            url != null || WebsiteBlocker.hasAddressBarNode(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )

        // Even on the root-fallback path, the block decision outranks tracking,
        // policy refreshes and observability bookkeeping. Once the URL is known,
        // cover the page immediately just like blockApp() covers an app window.
        val blockedCandidate = immediateWebsiteBlockTarget(
                addressText = addressText,
                url = url,
                blockedRules = blockedWebsitesDomainSet
            )
        if (blockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = event.windowId,
                blockedCandidate = url ?: addressText ?: blockedCandidate,
                detectionEventUptimeMillis = event.eventTime
            )
            recycleSafely(root)
            return
        }
''',
              '''        // A direct omnibox event is already sufficient evidence. Decide before
        // touching rootInActiveWindow so typed blocked searches and domains never pay
        // for a browser-tree round trip.
        val fastBlockedCandidate = immediateWebsiteBlockTarget(
            addressText = fastAddressText,
            url = fastUrl,
            blockedRules = blockedWebsitesDomainSet
        )
        if (fastBlockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = event.windowId,
                blockedCandidate = fastUrl ?: fastAddressText ?: fastBlockedCandidate,
                detectionEventUptimeMillis = event.eventTime,
                browserWindowIdValidated = true
            )
            return
        }

        val root = if (fastUrl == null) rootInActiveWindow ?: event.source else null
        val url = fastUrl ?: WebsiteBlocker.extractUrlFromRoot(
            root,
            packageName,
            isVerifiedHttpsHandler(packageName)
        )
        val detectedWindowId = if (fastUrl != null) {
            event.windowId
        } else {
            root?.windowId ?: event.windowId
        }

        // A URL found in a validated address-bar node can be classified immediately.
        // Do not walk the tree again for raw text before covering a blocked domain.
        val urlBlockedCandidate = immediateWebsiteBlockTarget(
            addressText = null,
            url = url,
            blockedRules = blockedWebsitesDomainSet
        )
        if (urlBlockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = detectedWindowId,
                blockedCandidate = url ?: urlBlockedCandidate,
                detectionEventUptimeMillis = event.eventTime,
                browserWindowIdValidated = true
            )
            recycleSafely(root)
            return
        }

        val addressText = fastAddressText
            ?: WebsiteBlocker.extractAddressBarTextFromRoot(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )
        val addressBarObservable = addressText != null ||
            url != null || WebsiteBlocker.hasAddressBarNode(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )

        // Raw address text remains necessary for category/search rules that do not
        // parse as a URL. This is the slower fallback, reached only after URL rules
        // already had their first chance to block.
        val blockedCandidate = immediateWebsiteBlockTarget(
            addressText = addressText,
            url = url,
            blockedRules = blockedWebsitesDomainSet
        )
        if (blockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = detectedWindowId,
                blockedCandidate = url ?: addressText ?: blockedCandidate,
                detectionEventUptimeMillis = event.eventTime,
                browserWindowIdValidated = true
            )
            recycleSafely(root)
            return
        }
'''
          )
          replace_once(
              service,
              '''                blockWebsite(
                    browserPackageName = packageName,
                    browserWindowId = event.windowId,
                    blockedCandidate = url,
                    detectionEventUptimeMillis = event.eventTime
                )
''',
              '''                blockWebsite(
                    browserPackageName = packageName,
                    browserWindowId = detectedWindowId,
                    blockedCandidate = url,
                    detectionEventUptimeMillis = event.eventTime,
                    browserWindowIdValidated = true
                )
'''
          )
          replace_once(
              service,
              '''    private fun routeWebsiteBlockByHierarchy(
        browserPackageName: String,
        browserWindowId: Int,
        blockedCandidate: String,
        detectionEventUptimeMillis: Long
    ) {
''',
              '''    private fun routeWebsiteBlockByHierarchy(
        browserPackageName: String,
        browserWindowId: Int,
        blockedCandidate: String,
        detectionEventUptimeMillis: Long,
        browserWindowIdValidated: Boolean = false
    ) {
'''
          )
          replace_once(
              service,
              '''        blockWebsite(
            browserPackageName = browserPackageName,
            browserWindowId = browserWindowId,
            blockedCandidate = blockedCandidate,
            detectionEventUptimeMillis = detectionEventUptimeMillis
        )
''',
              '''        blockWebsite(
            browserPackageName = browserPackageName,
            browserWindowId = browserWindowId,
            blockedCandidate = blockedCandidate,
            detectionEventUptimeMillis = detectionEventUptimeMillis,
            browserWindowIdValidated = browserWindowIdValidated
        )
'''
          )
          replace_once(
              service,
              '''    private fun blockWebsite(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L
    ) {
        val now = System.currentTimeMillis()
        stopWebsiteTracking(now)
        startWebsiteBlockTransition(
            browserPackageName,
            browserWindowId,
            blockedCandidate,
            detectionEventUptimeMillis
        )
    }
''',
              '''    private fun blockWebsite(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L,
        browserWindowIdValidated: Boolean = false
    ) {
        val now = System.currentTimeMillis()
        stopWebsiteTracking(now)
        startWebsiteBlockTransition(
            browserPackageName = browserPackageName,
            browserWindowId = browserWindowId,
            blockedCandidate = blockedCandidate,
            detectionEventUptimeMillis = detectionEventUptimeMillis,
            browserWindowIdValidated = browserWindowIdValidated
        )
    }
'''
          )
          replace_once(
              service,
              '''    private fun startWebsiteBlockTransition(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L
    ) {
        val expectedWindowId = resolveBrowserWindowId(browserPackageName, browserWindowId)
''',
              '''    private fun startWebsiteBlockTransition(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L,
        browserWindowIdValidated: Boolean = false
    ) {
        val expectedWindowId = if (browserWindowIdValidated && browserWindowId >= 0) {
            browserWindowId
        } else {
            resolveBrowserWindowId(browserPackageName, browserWindowId)
        }
'''
          )

          policy_test = "app/src/test/java/com/focusguard/utils/BrowserUiCapabilityPolicyTest.kt"
          replace_once(
              policy_test,
              '''    @Test
    fun `two equally ranked editors are ambiguous`() {
''',
              '''    @Test
    fun `verified browser non editable url display is read only evidence`() {
        val display = node(
            viewId = "$BROWSER_PACKAGE:id/current_url",
            text = "https://m.youtube.com/watch?v=1",
            actions = emptySet()
        )

        assertThat(
            BrowserUiCapabilityPolicy.isReadOnlyAddressBarNode(
                display,
                BROWSER_PACKAGE,
                WINDOW_ID,
                httpsHandlerRecognized = true
            )
        ).isTrue()
        assertThat(
            BrowserUiCapabilityPolicy.isReadOnlyAddressBarNode(
                display,
                BROWSER_PACKAGE,
                WINDOW_ID,
                httpsHandlerRecognized = false
            )
        ).isFalse()
        assertThat(
            BrowserUiCapabilityPolicy.isActionableAddressBarNode(
                display,
                BROWSER_PACKAGE,
                WINDOW_ID
            )
        ).isFalse()
    }

    @Test
    fun `url named browser node without address shaped value stays rejected`() {
        val unrelated = node(
            viewId = "$BROWSER_PACKAGE:id/share_url",
            text = "YouTube",
            actions = emptySet()
        )

        assertThat(
            BrowserUiCapabilityPolicy.isReadOnlyAddressBarNode(
                unrelated,
                BROWSER_PACKAGE,
                WINDOW_ID,
                httpsHandlerRecognized = true
            )
        ).isFalse()
    }

    @Test
    fun `two equally ranked editors are ambiguous`() {
'''
          )

          nav_test = "app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt"
          replace_once(
              nav_test,
              '''    @Test
    fun `pornography search is classified before navigation finishes`() {
''',
              '''    @Test
    fun `youtube domains and aliases are classified on the first known url`() {
        assertThat(
            BlockingAccessibilityService.immediateWebsiteBlockTarget(
                addressText = "https://m.youtube.com/watch?v=abc",
                url = "https://m.youtube.com/watch?v=abc",
                blockedRules = listOf("youtube.com")
            )
        ).isEqualTo("m.youtube.com")
        assertThat(
            BlockingAccessibilityService.immediateWebsiteBlockTarget(
                addressText = "https://youtu.be/abc",
                url = "https://youtu.be/abc",
                blockedRules = listOf("youtube.com")
            )
        ).isEqualTo("youtu.be")
        assertThat(
            BlockingAccessibilityService.immediateWebsiteBlockTarget(
                addressText = "https://www.youtube-nocookie.com/embed/abc",
                url = "https://www.youtube-nocookie.com/embed/abc",
                blockedRules = listOf("youtube.com")
            )
        ).isEqualTo("youtube-nocookie.com")
    }

    @Test
    fun `pornography search is classified before navigation finishes`() {
'''
          )
          PY

          git diff --check

      - name: Commit scoped patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/focusguard/utils/BrowserUiCapabilityPolicy.kt \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/test/java/com/focusguard/utils/BrowserUiCapabilityPolicyTest.kt \
            app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git diff --cached --check
          git commit -m "fix: reduce website block detection latency"
          git push origin HEAD:fix/website-block-detection-latency
