name: Apply same-tab site redirect fix

on:
  push:
    branches: ["fix/same-tab-site-redirect"]

permissions:
  contents: write

jobs:
  patch-website-redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply scoped website redirect patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt")
          source = path.read_text(encoding="utf-8")
          old = (
              "            if (!redirectRequested) {\n"
              "                val blockedSurfaceRestored =\n"
              "                    restoreBlockedSurfaceAfterAddressEdit(transition)\n"
              "                redirectRequested = blockedSurfaceRestored &&\n"
              "                    requestSafeGoogleThroughBrowserIntent(transition)\n"
              "            }\n"
              "\n"
              "            // If even the generic browser intent cannot be launched, retain the\n"
              "            // positively-identified Chromium close-tab fallback. HOME remains the\n"
              "            // fail-closed escape when no safe destination can be confirmed.\n"
              "            if (!redirectRequested) {\n"
              "                redirectRequested = closeBlockedTabAndRequestSafeGoogle(\n"
              "                    browserPackageName = browserPackageName,\n"
              "                    expectedWindowId = expectedWindowId,\n"
              "                    transition = transition\n"
              "                )\n"
              "            }\n"
          )
          new = (
              "            // Keep the redirect in the tab that exposed the blocked site.\n"
              "            // If direct address-bar replacement is unavailable, restore the exact\n"
              "            // blocked surface and neutralize that tab before requesting Google.\n"
              "            // Never launch a generic browser intent while the blocked tab is alive.\n"
              "            if (!redirectRequested) {\n"
              "                val blockedSurfaceRestored =\n"
              "                    restoreBlockedSurfaceAfterAddressEdit(transition)\n"
              "                redirectRequested = blockedSurfaceRestored &&\n"
              "                    closeBlockedTabAndRequestSafeGoogle(\n"
              "                        browserPackageName = browserPackageName,\n"
              "                        expectedWindowId = expectedWindowId,\n"
              "                        transition = transition\n"
              "                    )\n"
              "            }\n"
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one website redirect fallback block, found {count}")
          source = source.replace(old, new, 1)
          if "requestSafeGoogleThroughBrowserIntent(transition)" in source:
              raise SystemExit("Unsafe pre-close generic browser redirect call is still present")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit only the scoped source change
        shell: bash
        run: |
          rm .github/workflows/apply-same-tab-site-redirect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt .github/workflows/apply-same-tab-site-redirect.yml
          git diff --cached --check
          git commit -m "Keep blocked website redirect in current browser flow"
          git push origin HEAD:${{ github.ref_name }}
