name: Fresh APK + AAB
# Signed artifact workflow for the current main branch.
# Release ZIPs are created locally, validated, and uploaded without GitHub re-zipping them.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fresh-apk-aab.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: fresh-apk-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build latest signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CANONICAL_SIGNER_SHA256: e8da4209d0012052b052b280fa64becb788bf6929563ce54a0707cb8c3385157

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic Android version code
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          echo "CI_VERSION_CODE=$((1000 + COMMIT_COUNT))" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require production signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required to generate signed production artifacts."
              missing=1
            fi
          done
          test "$missing" -eq 0

          KEYSTORE_PATH="$RUNNER_TEMP/focusguard-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build latest Release APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            testReleaseUnitTest \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect and verify canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p latest-artifacts
          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            | tee latest-artifacts/apksigner.txt
          "$AAPT" dump badging "$APK" | head -n 1 \
            | tee latest-artifacts/package.txt
          grep -q "package: name='com.focusguard.v2'" latest-artifacts/package.txt
          grep -qi "$CANONICAL_SIGNER_SHA256" latest-artifacts/apksigner.txt
          jarsigner -verify "$AAB"

          cp "$APK" latest-artifacts/FocusGuard-latest.apk
          cp "$AAB" latest-artifacts/FocusGuard-latest.aab
          sha256sum latest-artifacts/FocusGuard-latest.apk latest-artifacts/FocusGuard-latest.aab \
            > latest-artifacts/SHA256SUMS.txt

      - name: Create portable release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("latest-artifacts")
          archives = [
              (
                  root / "FocusGuard-latest-APK.zip",
                  [("FocusGuard-latest.apk", root / "FocusGuard-latest.apk")],
                  zipfile.ZIP_STORED,
              ),
              (
                  root / "FocusGuard-latest-AAB.zip",
                  [("FocusGuard-latest.aab", root / "FocusGuard-latest.aab")],
                  zipfile.ZIP_STORED,
              ),
              (
                  root / "FocusGuard-latest-SHA256.zip",
                  [
                      ("SHA256SUMS.txt", root / "SHA256SUMS.txt"),
                      ("apksigner.txt", root / "apksigner.txt"),
                      ("package.txt", root / "package.txt"),
                  ],
                  zipfile.ZIP_DEFLATED,
              ),
          ]

          for archive, members, compression in archives:
              for _, source in members:
                  if not source.is_file() or source.stat().st_size == 0:
                      raise SystemExit(f"Missing or empty ZIP source: {source}")
              archive.unlink(missing_ok=True)
              with zipfile.ZipFile(
                  archive,
                  mode="w",
                  compression=compression,
                  allowZip64=False,
              ) as zipped:
                  for archive_name, source in members:
                      zipped.write(source, arcname=archive_name)
              with zipfile.ZipFile(archive, mode="r") as zipped:
                  bad = zipped.testzip()
                  if bad is not None:
                      raise SystemExit(f"CRC failure in {archive}: {bad}")
                  actual_names = [info.filename for info in zipped.infolist() if not info.is_dir()]
                  expected_names = [name for name, _ in members]
                  if actual_names != expected_names:
                      raise SystemExit(
                          f"ZIP member mismatch in {archive}: expected {expected_names}, got {actual_names}"
                      )
              print(f"Created valid portable ZIP: {archive} ({archive.stat().st_size} bytes)")
          PY

          python3 scripts/verify_github_artifact_zip.py \
            --archive latest-artifacts/FocusGuard-latest-APK.zip \
            --expect "FocusGuard-latest.apk=latest-artifacts/FocusGuard-latest.apk"
          python3 scripts/verify_github_artifact_zip.py \
            --archive latest-artifacts/FocusGuard-latest-AAB.zip \
            --expect "FocusGuard-latest.aab=latest-artifacts/FocusGuard-latest.aab"
          python3 scripts/verify_github_artifact_zip.py \
            --archive latest-artifacts/FocusGuard-latest-SHA256.zip \
            --expect "SHA256SUMS.txt=latest-artifacts/SHA256SUMS.txt" \
            --expect "apksigner.txt=latest-artifacts/apksigner.txt" \
            --expect "package.txt=latest-artifacts/package.txt"

          unzip -t latest-artifacts/FocusGuard-latest-APK.zip
          unzip -t latest-artifacts/FocusGuard-latest-AAB.zip
          unzip -t latest-artifacts/FocusGuard-latest-SHA256.zip

      - name: Upload validated APK ZIP directly
        id: upload_latest_apk_zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: latest-artifacts/FocusGuard-latest-APK.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          archive: false

      - name: Verify uploaded APK ZIP digest
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_latest_apk_zip.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          LOCAL_DIGEST="$(sha256sum latest-artifacts/FocusGuard-latest-APK.zip | awk '{print $1}')"
          REMOTE_DIGEST="${ARTIFACT_DIGEST#sha256:}"
          test -n "$REMOTE_DIGEST"
          test "$LOCAL_DIGEST" = "$REMOTE_DIGEST"
          echo "APK ZIP upload digest verified: $LOCAL_DIGEST"

      - name: Upload validated AAB ZIP directly
        id: upload_latest_aab_zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: latest-artifacts/FocusGuard-latest-AAB.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          archive: false

      - name: Verify uploaded AAB ZIP digest
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_latest_aab_zip.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          LOCAL_DIGEST="$(sha256sum latest-artifacts/FocusGuard-latest-AAB.zip | awk '{print $1}')"
          REMOTE_DIGEST="${ARTIFACT_DIGEST#sha256:}"
          test -n "$REMOTE_DIGEST"
          test "$LOCAL_DIGEST" = "$REMOTE_DIGEST"
          echo "AAB ZIP upload digest verified: $LOCAL_DIGEST"

      - name: Upload validated identity ZIP directly
        id: upload_latest_identity_zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: latest-artifacts/FocusGuard-latest-SHA256.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          archive: false

      - name: Verify uploaded identity ZIP digest
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_latest_identity_zip.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          LOCAL_DIGEST="$(sha256sum latest-artifacts/FocusGuard-latest-SHA256.zip | awk '{print $1}')"
          REMOTE_DIGEST="${ARTIFACT_DIGEST#sha256:}"
          test -n "$REMOTE_DIGEST"
          test "$LOCAL_DIGEST" = "$REMOTE_DIGEST"
          echo "Identity ZIP upload digest verified: $LOCAL_DIGEST"

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focusguard-release.jks"
