name: Fresh APK + AAB
# Signed artifact workflow for the current main branch; refreshed after nested browser detection fixes.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fresh-apk-aab.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: fresh-apk-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build latest signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CANONICAL_SIGNER_SHA256: e8da4209d0012052b052b280fa64becb788bf6929563ce54a0707cb8c3385157

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic Android version code
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          echo "CI_VERSION_CODE=$((1000 + COMMIT_COUNT))" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require production signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required to generate signed production artifacts."
              missing=1
            fi
          done
          test "$missing" -eq 0

          KEYSTORE_PATH="$RUNNER_TEMP/focusguard-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build latest Release APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            testReleaseUnitTest \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect and verify canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p latest-artifacts
          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            | tee latest-artifacts/apksigner.txt
          "$AAPT" dump badging "$APK" | head -n 1 \
            | tee latest-artifacts/package.txt
          grep -q "package: name='com.focusguard.v2'" latest-artifacts/package.txt
          grep -qi "$CANONICAL_SIGNER_SHA256" latest-artifacts/apksigner.txt
          jarsigner -verify "$AAB"

          cp "$APK" latest-artifacts/FocusGuard-latest.apk
          cp "$AAB" latest-artifacts/FocusGuard-latest.aab
          sha256sum latest-artifacts/FocusGuard-latest.apk latest-artifacts/FocusGuard-latest.aab \
            > latest-artifacts/SHA256SUMS.txt

      - name: Upload latest APK
        id: upload_latest_apk
        uses: actions/upload-artifact@v7
        with:
          name: FocusGuard-latest-APK-${{ github.run_number }}
          path: latest-artifacts/FocusGuard-latest.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
          archive: true

      - name: Verify latest APK ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_latest_apk.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_latest_apk.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/FocusGuard-latest-APK-${{ github.run_number }}.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "$ARCHIVE" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --expect "FocusGuard-latest.apk=latest-artifacts/FocusGuard-latest.apk"

      - name: Upload latest AAB
        id: upload_latest_aab
        uses: actions/upload-artifact@v7
        with:
          name: FocusGuard-latest-AAB-${{ github.run_number }}
          path: latest-artifacts/FocusGuard-latest.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
          archive: true

      - name: Verify latest AAB ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_latest_aab.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_latest_aab.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/FocusGuard-latest-AAB-${{ github.run_number }}.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "$ARCHIVE" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --expect "FocusGuard-latest.aab=latest-artifacts/FocusGuard-latest.aab"

      - name: Upload checksums
        id: upload_latest_identity
        uses: actions/upload-artifact@v7
        with:
          name: FocusGuard-latest-SHA256-${{ github.run_number }}
          path: |
            latest-artifacts/SHA256SUMS.txt
            latest-artifacts/apksigner.txt
            latest-artifacts/package.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          archive: true

      - name: Verify latest identity ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_latest_identity.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_latest_identity.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/FocusGuard-latest-SHA256-${{ github.run_number }}.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "$ARCHIVE" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --expect "SHA256SUMS.txt=latest-artifacts/SHA256SUMS.txt" \
            --expect "apksigner.txt=latest-artifacts/apksigner.txt" \
            --expect "package.txt=latest-artifacts/package.txt"

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focusguard-release.jks"
