name: Fresh APK + AAB

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fresh-apk-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-apk-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build latest signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic Android version code
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          echo "CI_VERSION_CODE=$((1000 + COMMIT_COUNT))" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require production signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required to generate signed production artifacts."
              missing=1
            fi
          done
          test "$missing" -eq 0

          KEYSTORE_PATH="$RUNNER_TEMP/focusguard-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build latest Release APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            testReleaseUnitTest \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -q "package: name='com.focusguard.v2'"
          jarsigner -verify "$AAB"

          mkdir -p latest-artifacts
          cp "$APK" latest-artifacts/FocusGuard-latest.apk
          cp "$AAB" latest-artifacts/FocusGuard-latest.aab
          sha256sum latest-artifacts/FocusGuard-latest.apk latest-artifacts/FocusGuard-latest.aab \
            > latest-artifacts/SHA256SUMS.txt

      - name: Upload latest APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-latest-APK-${{ github.run_number }}
          path: latest-artifacts/FocusGuard-latest.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload latest AAB
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-latest-AAB-${{ github.run_number }}
          path: latest-artifacts/FocusGuard-latest.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-latest-SHA256-${{ github.run_number }}
          path: latest-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focusguard-release.jks"
