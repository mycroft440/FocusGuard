name: Validate targeted power and biometric fix

on:
  push:
    branches: ["fix/power-biometric-flow-20260926"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[validated-targeted-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply narrow power-menu and biometric-flow changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              start_i = text.find(start)
              if start_i < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_i = text.find(end, start_i)
              if end_i < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start_i] + replacement + text[end_i:]

          # ------------------------------------------------------------------
          # 1) Power menu: preserve the existing pre-attached fast appearance
          # path, but make primary power actions follow OEM two-step confirmation.
          # ------------------------------------------------------------------
          controller_path = "app/src/main/java/com/focusguard/service/ProtectedPowerMenuController.kt"
          controller = read(controller_path)

          controller = replace_once(
              controller,
              """    internal enum class PowerMatchOverlayDecision {\n        PASS,\n        SHIELD_AND_CONSUME,\n        REQUEST_BACK_FALLBACK\n    }\n""",
              """    internal enum class PowerMatchOverlayDecision {\n        PASS,\n        SHIELD_AND_CONSUME,\n        REQUEST_BACK_FALLBACK\n    }\n    internal enum class PrimaryActionTapDecision { START, CONFIRM }\n""",
              "power tap decision enum"
          )

          controller = replace_once(
              controller,
              """    private var screenOff = false\n    private var statusText: TextView? = null\n""",
              """    private var screenOff = false\n    private var statusText: TextView? = null\n    private var pendingPrimaryAction: Action? = null\n    private var pendingPrimaryActionAtElapsed = 0L\n""",
              "power pending state"
          )

          controller = replace_once(
              controller,
              """                    if (overlayVisible &&\n                        directSignalActive &&\n                        directMatchedWindowId >= 0 &&\n                        event.windowId == directMatchedWindowId &&\n                        event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED\n                    ) {\n                        dismiss()\n                        return false\n                    }\n""",
              """                    if (overlayVisible &&\n                        directSignalActive &&\n                        directMatchedWindowId >= 0 &&\n                        event.windowId == directMatchedWindowId &&\n                        event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED\n                    ) {\n                        // Shutdown/restart confirmations often reuse the same\n                        // SystemUI window with a different class/text signature.\n                        // Keep our shield over that trusted transition so the user\n                        // can confirm with the same HardBlock action instead of\n                        // exposing OEM-specific long-press/safe-mode controls.\n                        if (hasActivePrimaryActionConfirmation()) {\n                            scheduleRecheck()\n                            return true\n                        }\n                        dismiss()\n                        return false\n                    }\n""",
              "power confirmation transition"
          )

          method_start = "    private fun performNativeSinglePress(action: Action) {"
          method_end = "    /**\n     * The first System UI global-actions event can identify the native window"
          new_methods = r'''    private fun performNativeSinglePress(action: Action) {
        val primary = action == Action.POWER_OFF || action == Action.RESTART
        val nowElapsed = SystemClock.elapsedRealtime()
        val confirmationAttempt = primary && primaryActionTapDecision(
            pendingAction = pendingPrimaryAction,
            tappedAction = action,
            pendingForMillis = if (pendingPrimaryActionAtElapsed > 0L) {
                (nowElapsed - pendingPrimaryActionAtElapsed).coerceAtLeast(0L)
            } else {
                Long.MAX_VALUE
            }
        ) == PrimaryActionTapDecision.CONFIRM

        if (primary && !confirmationAttempt) {
            clearPendingPrimaryAction()
        }
        performNativeSinglePressWithRetry(action, confirmationAttempt)
    }

    private fun performNativeSinglePressWithRetry(
        action: Action,
        confirmationAttempt: Boolean
    ) {
        if (tryPerformNativeSinglePress(action)) {
            onNativeActionClicked(action, confirmationAttempt)
            return
        }

        // SystemUI can identify the window before its actionable children are
        // attached. A single short retry uses a fresh accessibility root without
        // adding any delay to the menu's initial appearance.
        mainHandler.postDelayed({
            if (!overlayVisible) return@postDelayed
            if (tryPerformNativeSinglePress(action)) {
                onNativeActionClicked(action, confirmationAttempt)
            } else {
                if (!confirmationAttempt) clearPendingPrimaryAction()
                showStatus(R.string.protected_power_menu_action_unavailable)
            }
        }, NATIVE_ACTION_RETRY_DELAY_MILLIS)
    }

    private fun onNativeActionClicked(action: Action, confirmationAttempt: Boolean) {
        val primary = action == Action.POWER_OFF || action == Action.RESTART
        if (primary && !confirmationAttempt) {
            pendingPrimaryAction = action
            pendingPrimaryActionAtElapsed = SystemClock.elapsedRealtime()
            val actionLabel = service.getString(
                if (action == Action.POWER_OFF) {
                    R.string.protected_power_menu_power_off
                } else {
                    R.string.protected_power_menu_restart
                }
            )
            statusText?.apply {
                text = service.getString(
                    R.string.protected_power_menu_confirm_action,
                    actionLabel
                )
                visibility = View.VISIBLE
            }
        } else {
            clearPendingPrimaryAction()
            showStatus(R.string.protected_power_menu_action_sent)
        }
        scheduleRecheck()
    }

    private fun tryPerformNativeSinglePress(action: Action): Boolean {
        val root = if (action == Action.POWER_OFF || action == Action.RESTART) {
            findTrackedPowerMenuRootForPrimaryAction() ?: findPowerMenuRoot()
        } else {
            findPowerMenuRoot()
        } ?: return false

        val node = findActionNode(root, action)
        val clicked = node?.let(::clickNodeOrParent) == true
        recycleSafely(node)
        recycleSafely(root)
        return clicked
    }

    private fun hasActivePrimaryActionConfirmation(
        nowElapsed: Long = SystemClock.elapsedRealtime()
    ): Boolean {
        if (pendingPrimaryAction == null || pendingPrimaryActionAtElapsed <= 0L) return false
        if (nowElapsed - pendingPrimaryActionAtElapsed > PRIMARY_ACTION_CONFIRM_WINDOW_MILLIS) {
            clearPendingPrimaryAction()
            return false
        }
        return true
    }

    private fun clearPendingPrimaryAction() {
        pendingPrimaryAction = null
        pendingPrimaryActionAtElapsed = 0L
    }

'''
