              """            onFallbackRequested = {\n                if (latest.hasTypedCredential) {\n                    error = null\n                    credentialSurfaceLaunched = true\n                    showCredentialDialog = true\n                }\n            },\n            onCancelled = {\n                if (latest.hasTypedCredential) {\n                    // The prompt's negative button is the explicit alternate route.\n                    error = null\n                    credentialSurfaceLaunched = true\n                    showCredentialDialog = true\n                } else {\n                    onCancelled()\n                }\n            },\n""",
