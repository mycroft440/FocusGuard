name: Patch PR 126 transactional companions

on:
  push:
    branches:
      - feature/link-app-site-blocks

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/link-app-site-blocks
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/patch_pr126_transactional.py

      - name: Commit final fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pr126-transactional.yml tools/patch_pr126_transactional.py
          git add app/src/main/java/com/focusguard/ui/compose/screens/ProtectionSetupScreen.kt \
                  app/src/main/java/com/focusguard/utils/AssociatedBlockTargets.kt \
                  app/src/test/java/com/focusguard/utils/AssociatedBlockTargetsTest.kt
          git commit -m "Fix transactional companion selection"
          git push origin HEAD:feature/link-app-site-blocks
