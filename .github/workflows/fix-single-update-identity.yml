name: Fix single update identity

on:
  push:
    branches: ["fix/single-update-identity"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patcher and switch to main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/fix_single_update_identity.py /tmp/fix_single_update_identity.py
          git fetch origin main
          git checkout -B main origin/main

      - name: Apply identity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/fix_single_update_identity.py
          git diff --check

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts .github/workflows/android-ci.yml .github/workflows/release.yml
          git diff --cached --check
          git commit -m "Fixa identidade única para atualizações Android"
          git push origin HEAD:main
