name: Fix Pomodoro widget

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-pomodoro-widget.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Apply widget fixes
        run: python3 .github/scripts/fix_pomodoro_widget.py

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile, lint and test
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin lintDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Commit verified widget fixes
        run: |
          rm -f .github/workflows/fix-pomodoro-widget.yml
          rm -f .github/scripts/fix_pomodoro_widget.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mantém widget Pomodoro atualizado durante a sessão"
          git push origin HEAD:main
