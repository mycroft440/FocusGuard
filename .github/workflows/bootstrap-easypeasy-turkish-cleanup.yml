name: Clean EasyPeasy Turkish offline snapshot

on:
  push:
    branches:
      - fix/easypeasy-html-offline-cleanup
    paths:
      - .github/workflows/bootstrap-easypeasy-turkish-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup-turkish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Keep book pages and localize Turkish content images
        shell: bash
        run: |
          set -euo pipefail

          translation_root="app/src/main/assets/easypeasy/translations/tr"
          thread_dir="$translation_root/mirror/www.neverfapturkiye.com/konu/pornoyu-birakmanin-kolay-yolu.1259"

          find "$thread_dir" -maxdepth 1 -type f -name 'post-*.html' -delete

          TRANSLATION_ROOT="$translation_root" THREAD_DIR="$thread_dir" python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlsplit

          translation_root = Path(os.environ["TRANSLATION_ROOT"])
          thread_dir = Path(os.environ["THREAD_DIR"])
          mirror_root = translation_root / "mirror"
          pages = [thread_dir / "index.html", thread_dir / "page-2.html"]
          url_pattern = re.compile(
              r"https://(?:www\.)?neverfapturkiye\.com/data/(?:attachments|assets)/[^\"'<>\s]+",
              re.IGNORECASE,
          )

          def download(url: str, destination: Path) -> None:
              destination.parent.mkdir(parents=True, exist_ok=True)
              if destination.is_file() and destination.stat().st_size > 0:
                  return
              candidates = [url]
              parts = urlsplit(url)
              if parts.netloc == "neverfapturkiye.com":
                  candidates.append(url.replace("https://neverfapturkiye.com/", "https://www.neverfapturkiye.com/", 1))
              for candidate in candidates:
                  result = subprocess.run(
                      [
                          "curl",
                          "--fail",
                          "--location",
                          "--retry",
                          "5",
                          "--retry-all-errors",
                          "--connect-timeout",
                          "20",
                          "--max-time",
                          "120",
                          "--user-agent",
                          "Mozilla/5.0 (Android; FocusGuard offline EasyPeasy snapshot)",
                          "--output",
                          str(destination),
                          candidate,
                      ],
                      check=False,
                  )
                  if result.returncode == 0 and destination.is_file() and destination.stat().st_size > 0:
                      return
                  destination.unlink(missing_ok=True)
              raise RuntimeError(f"Unable to download {url}")

          for page in pages:
              text = page.read_text(encoding="utf-8")
              for url in sorted(set(url_pattern.findall(text))):
                  parts = urlsplit(url)
                  destination = mirror_root / parts.netloc / parts.path.lstrip("/")
                  download(url, destination)
                  relative = os.path.relpath(destination, page.parent).replace(os.sep, "/")
                  text = text.replace(url, relative)
              page.write_text(text, encoding="utf-8")

          for page in pages:
              text = page.read_text(encoding="utf-8")
              if "https://neverfapturkiye.com/data/attachments/" in text:
                  raise RuntimeError(f"Remote attachment remains in {page}")
          PY

          test "$(find "$thread_dir" -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 2
          du -sh "$translation_root"

      - name: Run focused offline-book asset test
        run: ./gradlew :app:testDebugUnitTest --tests com.focusguard.ui.OfflineBookAssetsTest

      - name: Verify debug build
        run: ./gradlew :app:assembleDebug

      - name: Commit cleanup and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/bootstrap-easypeasy-turkish-cleanup.yml
          git add -A app/src/main/assets/easypeasy/translations/tr
          git diff --cached --stat

          git commit -m "Trim Turkish EasyPeasy offline snapshot"
          git push
