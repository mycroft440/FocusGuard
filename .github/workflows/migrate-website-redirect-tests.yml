name: Migrate Website Redirect Tests

on:
  push:
    branches:
      - refactor/website-blocking-pipeline
    paths:
      - .github/workflows/migrate-website-redirect-tests.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/website-blocking-pipeline
          fetch-depth: 0

      - name: Migrate tests
        run: python3 .github/scripts/migrate_website_redirect_tests.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test
          git commit -m "test: migrate website redirect tests to extracted coordinator"
          git push origin HEAD:refactor/website-blocking-pipeline
