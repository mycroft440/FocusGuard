name: Apply isolated admin cache field

on:
  push:
    branches: ["perf/cache-fast-path"]
    paths:
      - ".github/workflows/apply-single-admin-cache.yml"
      - "tools/fastpath-round2.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-fast-path
          fetch-depth: 0
      - name: Apply checked patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/fastpath-round2.patch
          git apply tools/fastpath-round2.patch
          rm tools/fastpath-round2.patch
          rm .github/workflows/apply-fastpath-round2.yml
          rm .github/workflows/apply-single-admin-cache.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add -u -- tools/fastpath-round2.patch .github/workflows/apply-fastpath-round2.yml .github/workflows/apply-single-admin-cache.yml
          git commit -m "perf: cache Device Admin state for accessibility"
          git push origin HEAD:perf/cache-fast-path
