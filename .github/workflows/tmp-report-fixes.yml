name: Temporary report fixes

on:
  push:
    branches: ["fix/report-bugs-2026-09-16"]
    paths: [".github/workflows/tmp-report-fixes.yml"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-bugs-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply reviewed fixes
        run: python3 .github/scripts/apply-report-fixes.py
      - name: Review patch integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git status --short
      - run: chmod +x gradlew
      - name: Run focused unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace \
            --tests 'com.focusguard.utils.UsageLimitForegroundPolicyTest' \
            --tests 'com.focusguard.utils.AppUsageLimitActivationUsageTest' \
            --tests 'com.focusguard.utils.UsageLimitBehaviorPolicyTest' \
            --tests 'com.focusguard.focusmode.FocusModePolicyTest' \
            --tests 'com.focusguard.manager.BlockingSessionManagerTargetsTest'
      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-report-fixes.yml .github/scripts/apply-report-fixes.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve reported blocking and limit bugs"
          git push origin HEAD:fix/report-bugs-2026-09-16
