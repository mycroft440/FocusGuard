name: Patch password config fluidity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/password-block-config-fluidity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Isolate password text field recomposition
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/focusguard/ui/FinalConfigStep.kt')
          text = path.read_text()
          if 'private fun PasswordCredentialEditor(' in text:
              raise SystemExit(0)

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    // Credenciais são intencionalmente mantidas apenas em memória e nunca no SavedState.\n'
              '    var unlockPassword by remember { mutableStateOf("") }\n'
              '    var unlockPasswordConfirmation by remember { mutableStateOf("") }',
              '    // Credenciais são intencionalmente mantidas apenas em memória e nunca no SavedState.\n'
              '    // O composable raiz guarda somente os objetos de estado, sem observar seus valores.\n'
              '    // Assim cada tecla invalida apenas PasswordCredentialEditor, e não o Scaffold inteiro.\n'
              '    val unlockPasswordState = remember { mutableStateOf("") }\n'
              '    val unlockPasswordConfirmationState = remember { mutableStateOf("") }'
          )

          replace_once('        unlockPassword = ""', '        unlockPasswordState.value = ""')
          replace_once(
              '        unlockPasswordConfirmation = ""',
              '        unlockPasswordConfirmationState.value = ""'
          )

          old_editor = '''                            PasswordAppUnlockMode.PASSWORD -> {
                                OutlinedTextField(
                                    value = unlockPassword,
                                    onValueChange = {
                                        unlockPassword = it
                                        configError = null
                                    },
                                    modifier = Modifier.fillMaxWidth(),
                                    label = {
                                        Text(stringResource(R.string.password_app_unlock_password))
                                    },
                                    singleLine = true,
                                    visualTransformation = PasswordVisualTransformation(),
                                    keyboardOptions = KeyboardOptions(
                                        keyboardType = KeyboardType.Password
                                    )
                                )
                                OutlinedTextField(
                                    value = unlockPasswordConfirmation,
                                    onValueChange = {
                                        unlockPasswordConfirmation = it
                                        configError = null
                                    },
                                    modifier = Modifier.fillMaxWidth(),
                                    label = {
                                        Text(
                                            stringResource(
                                                R.string.password_app_unlock_password_confirm
                                            )
                                        )
                                    },
                                    singleLine = true,
                                    visualTransformation = PasswordVisualTransformation(),
                                    keyboardOptions = KeyboardOptions(
                                        keyboardType = KeyboardType.Password
                                    )
                                )
                                Text(
                                    stringResource(
                                        R.string.password_app_unlock_password_requirement,
                                        PasswordAppUnlockStore.MIN_PASSWORD_LENGTH
                                    ),
                                    color = TextHint,
                                    fontSize = 11.sp
                                )
                            }'''
          new_editor = '''                            PasswordAppUnlockMode.PASSWORD -> {
                                PasswordCredentialEditor(
                                    passwordState = unlockPasswordState,
                                    confirmationState = unlockPasswordConfirmationState,
                                    onEdited = {
                                        if (configError != null) configError = null
                                    }
                                )
                            }'''
          replace_once(old_editor, new_editor)

          replace_once(
              '!PasswordAppUnlockStore.isPasswordValid(unlockPassword)',
              '!PasswordAppUnlockStore.isPasswordValid(unlockPasswordState.value)'
          )
          replace_once(
              'unlockPassword != unlockPasswordConfirmation',
              'unlockPasswordState.value != unlockPasswordConfirmationState.value'
          )
          replace_once(
              'PasswordAppUnlockMode.PASSWORD -> unlockPassword',
              'PasswordAppUnlockMode.PASSWORD -> unlockPasswordState.value'
          )

          insertion = '''
@Composable
private fun PasswordCredentialEditor(
    passwordState: androidx.compose.runtime.MutableState<String>,
    confirmationState: androidx.compose.runtime.MutableState<String>,
    onEdited: () -> Unit
) {
    OutlinedTextField(
        value = passwordState.value,
        onValueChange = { value ->
            passwordState.value = value
            onEdited()
        },
        modifier = Modifier.fillMaxWidth(),
        label = { Text(stringResource(R.string.password_app_unlock_password)) },
        singleLine = true,
        visualTransformation = PasswordVisualTransformation(),
        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password)
    )
    OutlinedTextField(
        value = confirmationState.value,
        onValueChange = { value ->
            confirmationState.value = value
            onEdited()
        },
        modifier = Modifier.fillMaxWidth(),
        label = { Text(stringResource(R.string.password_app_unlock_password_confirm)) },
        singleLine = true,
        visualTransformation = PasswordVisualTransformation(),
        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password)
    )
    Text(
        stringResource(
            R.string.password_app_unlock_password_requirement,
            PasswordAppUnlockStore.MIN_PASSWORD_LENGTH
        ),
        color = TextHint,
        fontSize = 11.sp
    )
}

'''
          marker = '@Composable\nprivate fun UnlockModeSelectionPage('
          replace_once(marker, insertion + marker)

          path.write_text(text)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/focusguard/ui/FinalConfigStep.kt
          git commit -m 'perf: isolate password setup typing state'
          git push origin HEAD:${{ github.head_ref }}
