name: Apply overlapping block targets

on:
  push:
    branches:
      - fix/allow-overlapping-block-targets
    paths:
      - .agents/apply_overlapping_block_targets.py
      - .github/workflows/apply-overlapping-block-targets.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allow-overlapping-block-targets
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply mapped change
        run: python3 .agents/apply_overlapping_block_targets.py
      - name: Validate exact wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -n -A8 '0 -> AppSelectionStep(' app/src/main/java/com/focusguard/ui/CreateSessionActivity.kt | grep 'allowCompatibleProtection = true'
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FocusGuard Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/ui/CreateSessionActivity.kt
          git diff --cached --check
          git commit -m "Allow overlapping block targets"
          git push origin HEAD:fix/allow-overlapping-block-targets
      - run: chmod +x gradlew
      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace \
            --tests "com.focusguard.manager.BlockingSessionManagerTargetsTest"
      - name: Remove temporary change machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .agents/apply_overlapping_block_targets.py
          rm .github/workflows/apply-overlapping-block-targets.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary overlap fix workflow"
          git push origin HEAD:fix/allow-overlapping-block-targets
