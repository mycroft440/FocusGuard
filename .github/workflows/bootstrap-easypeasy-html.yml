name: Bootstrap EasyPeasy HTML translations

on:
  push:
    branches:
      - fix/easypeasy-html-offline
    paths:
      - .github/workflows/bootstrap-easypeasy-html.yml

permissions:
  contents: write

jobs:
  bundle-html:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HTML translation branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download offline HTML snapshots
        shell: bash
        run: |
          set -euo pipefail

          root="app/src/main/assets/easypeasy/translations"
          find "$root" -maxdepth 1 -type f -name '*.pdf' -delete
          find "$root" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

          jq -r '.translations[] | [.code, .name, .source] | @tsv' "$root/catalog.json" |
          while IFS=$'\t' read -r code name url; do
            echo "::group::Downloading $name ($code)"
            lang_dir="$root/$code"
            mirror_dir="$lang_dir/mirror"
            mkdir -p "$mirror_dir"

            set +e
            wget \
              --page-requisites \
              --convert-links \
              --adjust-extension \
              --span-hosts \
              --execute robots=off \
              --timeout=30 \
              --tries=5 \
              --retry-on-host-error \
              --retry-on-http-error=429,500,502,503,504,522 \
              --waitretry=3 \
              --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
              --header="Accept-Language: en-US,en;q=0.9" \
              --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
              --directory-prefix="$mirror_dir" \
              "$url"
            wget_status=$?
            set -e

            main_html="$(
              find "$mirror_dir" -type f -iname '*.html' -printf '%s\t%p\n' \
                | sort -nr \
                | head -n 1 \
                | cut -f2-
            )"

            if [[ -z "$main_html" || ! -s "$main_html" ]]; then
              echo "No HTML document was downloaded for $code from $url" >&2
              exit 1
            fi

            if [[ "$wget_status" -ne 0 ]]; then
              echo "wget returned $wget_status for $code; continuing because the HTML document was captured."
            fi

            relative_main="${main_html#"$lang_dir/"}"
            CODE="$code" NAME="$name" SOURCE="$url" TARGET="$relative_main" LANG_DIR="$lang_dir" python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          lang_dir = Path(os.environ["LANG_DIR"])
          name = os.environ["NAME"]
          source = os.environ["SOURCE"]
          target = os.environ["TARGET"]
          code = os.environ["CODE"]

          entry = f"""<!doctype html>
          <html lang="{html.escape(code)}">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url={html.escape(target, quote=True)}">
            <title>{html.escape(name)} · EasyPeasy offline</title>
          </head>
          <body>
            <p><a href="{html.escape(target, quote=True)}">Open {html.escape(name)} EasyPeasy</a></p>
          </body>
          </html>
          """
          (lang_dir / "index.html").write_text(entry, encoding="utf-8")
          (lang_dir / "snapshot.json").write_text(
              json.dumps(
                  {
                      "code": code,
                      "name": name,
                      "source": source,
                      "format": "html",
                      "offlineDocument": target,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

            echo "Captured $main_html"
            echo "::endgroup::"
          done

          pdf_count="$(find "$root" -type f -iname '*.pdf' | wc -l)"
          entry_count="$(find "$root" -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)"
          html_count="$(find "$root" -type f -iname '*.html' | wc -l)"

          test "$pdf_count" -eq 0
          test "$entry_count" -eq 15
          test "$html_count" -ge 30
          du -sh "$root"

      - name: Run focused offline-book asset test
        run: ./gradlew :app:testDebugUnitTest --tests com.focusguard.ui.OfflineBookAssetsTest

      - name: Verify debug build
        run: ./gradlew :app:assembleDebug

      - name: Commit HTML snapshots and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/bootstrap-easypeasy-html.yml
          git add -A app/src/main/assets/easypeasy/translations
          git diff --cached --stat

          git commit -m "Replace EasyPeasy PDFs with offline HTML translations"
          git push
