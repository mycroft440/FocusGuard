name: Apply same-tab redirect fix

on:
  push:
    branches:
      - fix/same-tab-fast-redirect
    paths:
      - .github/workflows/apply-same-tab-redirect-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/same-tab-fast-redirect
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused patch
        run: python3 tools/apply_same_tab_redirect_fix.py

      - name: Validate patch
        run: git diff --check

      - name: Run redirect unit tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests com.focusguard.accessibility.website.redirection.WebsiteRedirectionPlanTest
          --tests com.focusguard.service.WebsiteBlockNavigationTest

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Keep blocked website redirect in the current tab"
          git push origin HEAD:fix/same-tab-fast-redirect
