name: Apply Power Menu Vector Refinement

on:
  push:
    branches:
      - ui/power-menu-hardblock-style

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[power-menu-vectors]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/power-menu-hardblock-style
          fetch-depth: 0
      - name: Replace glyphs with native vectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/focusguard/service/ProtectedPowerMenuController.kt')
          text = p.read_text()

          def rep(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          rep(
              'import android.widget.FrameLayout\nimport android.widget.LinearLayout\nimport android.widget.TextView\n',
              'import android.widget.FrameLayout\nimport android.widget.ImageView\nimport android.widget.LinearLayout\nimport android.widget.TextView\n'
          )

          rep(
              '''        sheet.addView(TextView(service).apply {\n            text = service.getString(R.string.protected_power_menu_badge)\n            setTextColor(HardBlockPowerMenuColors.accent)\n            textSize = 10f\n            typeface = Typeface.MONOSPACE\n            letterSpacing = 0.12f\n            gravity = Gravity.CENTER\n            setPadding(dp(10), dp(6), dp(10), dp(6))\n            background = roundedBackground(\n                Color.argb(18, 0, 188, 212),\n                radiusDp = 99,\n                strokeColor = Color.argb(76, 0, 188, 212)\n            )\n        }, LinearLayout.LayoutParams(\n            WindowManager.LayoutParams.WRAP_CONTENT,\n            WindowManager.LayoutParams.WRAP_CONTENT\n        ).apply { bottomMargin = dp(16) })\n''',
              '''        val protectionBadge = LinearLayout(service).apply {\n            orientation = LinearLayout.HORIZONTAL\n            gravity = Gravity.CENTER_VERTICAL\n            setPadding(dp(8), dp(6), dp(11), dp(6))\n            background = roundedBackground(\n                Color.argb(18, 0, 188, 212),\n                radiusDp = 99,\n                strokeColor = Color.argb(76, 0, 188, 212)\n            )\n        }\n        protectionBadge.addView(ImageView(service).apply {\n            setImageResource(R.drawable.ic_hardblock_shield_check)\n            setColorFilter(HardBlockPowerMenuColors.accent)\n            importantForAccessibility = View.IMPORTANT_FOR_ACCESSIBILITY_NO\n        }, LinearLayout.LayoutParams(dp(13), dp(13)).apply {\n            marginEnd = dp(7)\n        })\n        protectionBadge.addView(TextView(service).apply {\n            text = service.getString(R.string.protected_power_menu_badge)\n            setTextColor(HardBlockPowerMenuColors.accent)\n            textSize = 10f\n            typeface = Typeface.MONOSPACE\n            letterSpacing = 0.12f\n            gravity = Gravity.CENTER_VERTICAL\n        }, LinearLayout.LayoutParams(\n            WindowManager.LayoutParams.WRAP_CONTENT,\n            WindowManager.LayoutParams.WRAP_CONTENT\n        ))\n        sheet.addView(protectionBadge, LinearLayout.LayoutParams(\n            WindowManager.LayoutParams.WRAP_CONTENT,\n            WindowManager.LayoutParams.WRAP_CONTENT\n        ).apply { bottomMargin = dp(16) })\n'''
          )

          rep(
              '''        row.addView(TextView(service).apply {\n            text = actionIcon(action)\n            setTextColor(accent)\n            textSize = if (action == Action.POWER_OFF) 22f else 21f\n            gravity = Gravity.CENTER\n            background = roundedBackground(\n                if (emergency) {\n                    Color.argb(20, 229, 57, 53)\n                } else {\n                    Color.argb(18, 0, 188, 212)\n                },\n                radiusDp = 11,\n                strokeColor = if (emergency) {\n                    Color.argb(58, 229, 57, 53)\n                } else {\n                    Color.argb(52, 0, 188, 212)\n                }\n            )\n        }, LinearLayout.LayoutParams(dp(36), dp(36)).apply {\n            marginEnd = dp(14)\n        })\n''',
              '''        val iconWell = FrameLayout(service).apply {\n            background = roundedBackground(\n                if (emergency) {\n                    Color.argb(20, 229, 57, 53)\n                } else {\n                    Color.argb(18, 0, 188, 212)\n                },\n                radiusDp = 11,\n                strokeColor = if (emergency) {\n                    Color.argb(58, 229, 57, 53)\n                } else {\n                    Color.argb(52, 0, 188, 212)\n                }\n            )\n        }\n        iconWell.addView(ImageView(service).apply {\n            setImageResource(actionIconRes(action))\n            setColorFilter(accent)\n            importantForAccessibility = View.IMPORTANT_FOR_ACCESSIBILITY_NO\n        }, FrameLayout.LayoutParams(dp(21), dp(21), Gravity.CENTER))\n        row.addView(iconWell, LinearLayout.LayoutParams(dp(36), dp(36)).apply {\n            marginEnd = dp(14)\n        })\n'''
          )

          rep(
              '''    private fun actionIcon(action: Action): String = when (action) {\n        Action.POWER_OFF -> "⏻"\n        Action.RESTART -> "↻"\n        Action.EMERGENCY -> "☎"\n        Action.MEDICAL_INFO -> "✚"\n    }\n''',
              '''    private fun actionIconRes(action: Action): Int = when (action) {\n        Action.POWER_OFF -> R.drawable.ic_hardblock_power\n        Action.RESTART -> R.drawable.ic_hardblock_restart\n        Action.EMERGENCY -> R.drawable.ic_hardblock_emergency\n        Action.MEDICAL_INFO -> R.drawable.ic_hardblock_medical\n    }\n'''
          )

          p.write_text(text)

          plan = Path('.agents/power_menu_visual_plan.md')
          plan_text = plan.read_text()
          marker = '- [x] Cartões para Chamada de emergência e Informações médicas.\n'
          addition = marker + '- [x] Ícones vetoriais nativos derivados dos SVGs da referência, evitando variação de glifos entre OEMs.\n'
          if plan_text.count(marker) != 1:
              raise SystemExit('plan marker not found exactly once')
          plan.write_text(plan_text.replace(marker, addition, 1))
          PY
      - name: Commit vector refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/focusguard/service/ProtectedPowerMenuController.kt .agents/power_menu_visual_plan.md
          git commit -m "[power-menu-vectors] ui: use native power menu icons"
          git push origin HEAD:ui/power-menu-hardblock-style
