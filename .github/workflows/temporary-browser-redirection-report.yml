name: Temporary browser redirection hardening

on:
  push:
    branches:
      - improve/android-browser-redirection-report

permissions:
  contents: write

jobs:
  patch-browser-redirection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply report-driven patch
        run: python .github/scripts/apply_browser_redirection_report.py

      - name: Check patch formatting
        run: git diff --check

      - name: Commit hardened browser redirection
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/main/java/com/focusguard/utils/BrowserUiCapabilityPolicy.kt \
            app/src/main/java/com/focusguard/utils/WebsiteBlocker.kt \
            app/src/test/java/com/focusguard/utils/BrowserSemanticActionPolicyTest.kt \
            docs/WEBSITE_BLOCKING.md
          git commit -m "Harden Android browser same-tab redirection"
          git push origin HEAD:${{ github.ref_name }}