name: Temporary browser redirection hardening

on:
  push:
    branches:
      - improve/android-browser-redirection-report

permissions:
  contents: write

jobs:
  patch-browser-redirection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply report-driven browser redirection hardening
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def patch(path_str, old, new, label):
              path = Path(path_str)
              source = path.read_text(encoding="utf-8")
              if new in source:
                  return False
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one old block, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
              return True

          service = "app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt"
          policy = "app/src/main/java/com/focusguard/utils/BrowserUiCapabilityPolicy.kt"
          blocker = "app/src/main/java/com/focusguard/utils/WebsiteBlocker.kt"
          docs = "docs/WEBSITE_BLOCKING.md"

          patch(
              service,
              '''            val browserIntent = Intent(
                  Intent.ACTION_VIEW,
                  android.net.Uri.parse("https://example.com")
              )
''',
              '''            val browserIntent = Intent(
                  Intent.ACTION_VIEW,
                  android.net.Uri.parse("https://example.com")
              ).apply {
                  addCategory(Intent.CATEGORY_BROWSABLE)
              }
''',
              "browser discovery must use BROWSABLE"
          )

          patch(
              service,
              '''    private fun isVerifiedHttpsHandler(packageName: String): Boolean =
          packageName in verifiedHttpsHandlerPackages || packageName in knownBrowserPackages
''',
              '''    private fun isVerifiedHttpsHandler(packageName: String): Boolean =
          packageName in verifiedHttpsHandlerPackages
''',
              "weak browser evidence must require a verified HTTPS handler"
          )

          patch(
              service,
              '''                // Same-tab rewrite is the only website redirect path. Never close the
                  // current tab/browser as a fallback: if the browser UI is temporarily late,
                  // keep it open and let the next accessibility event retry the blocked URL.
                  if (!redirectRequested) {
                      stateMachine.onFailureOrTimeout()
                      releaseWebsiteCurtainAfterMinimumNotice(
                          curtainGeneration = curtainGeneration,
                          curtainShownAtUptimeMillis = curtainShownAtUptimeMillis
                      )
                      return@launch
                  }
''',
              '''                // Same-tab rewrite is the only website redirect path. If the first
                  // attempt raced an editor/focus animation, restore the exact blocked surface
                  // and retry once with a fresh capability state. We still never close a tab,
                  // launch a second browser document or evict the browser to HOME.
                  if (!redirectRequested) {
                      val blockedSurfaceRestored =
                          restoreBlockedSurfaceAfterAddressEdit(transition)
                      if (blockedSurfaceRestored && curtainReadyForTransition(transition)) {
                          FocusGuardLogger.log(
                              "A11y",
                              "Repetindo redirecionamento seguro na mesma aba de $browserPackageName"
                          )
                          delay(WEBSITE_ADDRESS_BAR_ACTION_RETRY_MILLIS)
                          redirectRequested = requestSafeGoogleInCurrentTab(
                              browserPackageName = browserPackageName,
                              expectedWindowId = expectedWindowId,
                              policy = WebsiteTabNeutralizationPolicy(
                                  browserPackageName = browserPackageName,
                                  expectedWindowId = expectedWindowId
                              ),
                              transition = transition
                          )
                      }
                  }

                  if (!redirectRequested) {
                      FocusGuardLogger.log(
                          "A11y",
                          "Navegador preservado: redirecionamento na mesma aba não pôde ser certificado " +
                              "para $browserPackageName (API ${Build.VERSION.SDK_INT})"
                      )
                      stateMachine.onFailureOrTimeout()
                      releaseWebsiteCurtainAfterMinimumNotice(
                          curtainGeneration = curtainGeneration,
                          curtainShownAtUptimeMillis = curtainShownAtUptimeMillis
                      )
                      return@launch
                  }
''',
              "same-tab redirect retry"
          )

          patch(
              service,
              '''        val focusResult = WebsiteBlocker.performUniqueAddressBarAction(
              root = root,
              browserPackageName = browserPackageName,
              expectedWindowId = expectedWindowId,
              requiredAction = BrowserUiCapabilityPolicy.NodeAction.FOCUS
          )
''',
              '''        val focusResult = WebsiteBlocker.performUniqueAddressBarAction(
              root = root,
              browserPackageName = browserPackageName,
              expectedWindowId = expectedWindowId,
              requiredAction = BrowserUiCapabilityPolicy.NodeAction.FOCUS,
              httpsHandlerRecognized = isVerifiedHttpsHandler(browserPackageName)
          )
''',
              "focus action handler proof"
          )

          patch(
              service,
              '''            WebsiteBlocker.performUniqueAddressBarAction(
                  root = root,
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  requiredAction = BrowserUiCapabilityPolicy.NodeAction.CLICK
              )
''',
              '''            WebsiteBlocker.performUniqueAddressBarAction(
                  root = root,
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  requiredAction = BrowserUiCapabilityPolicy.NodeAction.CLICK,
                  httpsHandlerRecognized = isVerifiedHttpsHandler(browserPackageName)
              )
''',
              "click action handler proof"
          )

          patch(
              service,
              '''                val replaced = WebsiteBlocker.performUniqueAddressBarAction(
                  root = editRoot,
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  requiredAction = BrowserUiCapabilityPolicy.NodeAction.SET_TEXT,
                  arguments = arguments
              )
''',
              '''                val replaced = WebsiteBlocker.performUniqueAddressBarAction(
                  root = editRoot,
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  requiredAction = BrowserUiCapabilityPolicy.NodeAction.SET_TEXT,
                  arguments = arguments,
                  httpsHandlerRecognized = isVerifiedHttpsHandler(browserPackageName)
              )
''',
              "set-text action handler proof"
          )

          patch(
              service,
              '''                val submitted = WebsiteBlocker.performUniqueAddressBarAction(
                  root = root,
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  requiredAction = BrowserUiCapabilityPolicy.NodeAction.IME_ENTER,
                  textPredicate = ::isSafeGoogleRedirectSurface
              )
''',
              '''                val submitted = WebsiteBlocker.performUniqueAddressBarAction(
                  root = root,
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  requiredAction = BrowserUiCapabilityPolicy.NodeAction.IME_ENTER,
                  textPredicate = ::isSafeGoogleRedirectSurface,
                  httpsHandlerRecognized = isVerifiedHttpsHandler(browserPackageName)
              )
''',
              "IME action handler proof"
          )

          patch(
              policy,
              '''    fun isActionableAddressBarNode(
          node: Node,
          expectedBrowserPackage: String,
          expectedWindowId: Int
      ): Boolean = node.visible &&
          node.packageName == expectedBrowserPackage &&
          node.windowId == expectedWindowId &&
          isStrongAddressBarResource(node.viewIdResourceName, expectedBrowserPackage)
''',
              '''    fun isSemanticActionableAddressBarNode(
          node: Node,
          expectedBrowserPackage: String,
          expectedWindowId: Int,
          httpsHandlerRecognized: Boolean
      ): Boolean {
          if (!httpsHandlerRecognized ||
              !node.visible || !node.editable || !node.uriInput ||
              node.packageName != expectedBrowserPackage ||
              node.windowId != expectedWindowId
          ) return false

          val prefix = "$expectedBrowserPackage:id/"
          val viewId = node.viewIdResourceName
          return viewId.startsWith(prefix) && viewId.length > prefix.length
      }

      fun isActionableAddressBarNode(
          node: Node,
          expectedBrowserPackage: String,
          expectedWindowId: Int,
          httpsHandlerRecognized: Boolean = false
      ): Boolean = node.visible &&
          node.packageName == expectedBrowserPackage &&
          node.windowId == expectedWindowId &&
          (isStrongAddressBarResource(node.viewIdResourceName, expectedBrowserPackage) ||
              isSemanticActionableAddressBarNode(
                  node = node,
                  expectedBrowserPackage = expectedBrowserPackage,
                  expectedWindowId = expectedWindowId,
                  httpsHandlerRecognized = httpsHandlerRecognized
              ))
''',
              "semantic native URI action capability"
          )

          patch(
              policy,
              '''        requiredAction: NodeAction,
          textPredicate: ((String?) -> Boolean)? = null
      ): Selection {
''',
              '''        requiredAction: NodeAction,
          textPredicate: ((String?) -> Boolean)? = null,
          httpsHandlerRecognized: Boolean = false
      ): Selection {
''',
              "resolver HTTPS proof parameter"
          )

          patch(
              policy,
              '''                ) || !supports(node, requiredAction) ||
''',
              '''                    httpsHandlerRecognized = httpsHandlerRecognized
                  ) || !supports(node, requiredAction) ||
''',
              "resolver semantic action proof"
          )

          patch(
              policy,
              '''        @Suppress("UNUSED_PARAMETER") httpsHandlerRecognized: Boolean,
''',
              '''        httpsHandlerRecognized: Boolean,
''',
              "use HTTPS proof in compatibility selector"
          )

          patch(
              policy,
              '''                nodes[index],
                  expectedBrowserPackage,
                  expectedWindowId
              )
''',
              '''                nodes[index],
                  expectedBrowserPackage,
                  expectedWindowId,
                  httpsHandlerRecognized = httpsHandlerRecognized
              )
''',
              "compatibility selector semantic proof"
          )

          patch(
              policy,
              '''            textPredicate = expectedText?.let { expected ->
              { actual: String? -> actual?.trim() == expected.trim() }
          }
      ).index
''',
              '''            textPredicate = expectedText?.let { expected ->
              { actual: String? -> actual?.trim() == expected.trim() }
          },
          httpsHandlerRecognized = httpsHandlerRecognized
      ).index
''',
              "compatibility resolver semantic proof"
          )

          patch(
              blocker,
              '''        requiredAction: BrowserUiCapabilityPolicy.NodeAction,
          arguments: Bundle? = null,
          textPredicate: ((String?) -> Boolean)? = null
      ): AddressBarActionResult {
''',
              '''        requiredAction: BrowserUiCapabilityPolicy.NodeAction,
          arguments: Bundle? = null,
          textPredicate: ((String?) -> Boolean)? = null,
          httpsHandlerRecognized: Boolean = false
      ): AddressBarActionResult {
''',
              "WebsiteBlocker semantic action parameter"
          )

          patch(
              blocker,
              '''            nodes += matches
          }
          return try {
''',
              '''            nodes += matches
          }
          if (httpsHandlerRecognized) {
              collectSemanticActionAddressBarNodes(
                  node = root,
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  output = nodes,
                  depth = 0,
                  visitedNodes = intArrayOf(0)
              )
          }
          return try {
''',
              "collect semantic URI action candidates"
          )

          patch(
              blocker,
              '''                requiredAction = requiredAction,
                  textPredicate = textPredicate
              )
''',
              '''                requiredAction = requiredAction,
                  textPredicate = textPredicate,
                  httpsHandlerRecognized = httpsHandlerRecognized
              )
''',
              "pass semantic proof to resolver"
          )

          patch(
              blocker,
              '''    private fun AccessibilityNodeInfo.toBrowserUiNode(
''',
              '''    private fun collectSemanticActionAddressBarNodes(
          node: AccessibilityNodeInfo,
          browserPackageName: String,
          expectedWindowId: Int,
          output: MutableList<AccessibilityNodeInfo>,
          depth: Int,
          visitedNodes: IntArray
      ) {
          if (depth >= MAX_TREE_DEPTH || visitedNodes[0] >= MAX_TREE_NODES) return
          for (index in 0 until node.childCount) {
              if (visitedNodes[0] >= MAX_TREE_NODES) return
              val child = node.getChild(index) ?: continue
              var retained = false
              try {
                  visitedNodes[0] += 1
                  val facts = runCatching { child.toBrowserUiNode() }.getOrNull()
                  val semanticCandidate = facts != null &&
                      !isStrongAddressBarResource(
                          facts.viewIdResourceName,
                          browserPackageName
                      ) &&
                      BrowserUiCapabilityPolicy.isSemanticActionableAddressBarNode(
                          node = facts,
                          expectedBrowserPackage = browserPackageName,
                          expectedWindowId = expectedWindowId,
                          httpsHandlerRecognized = true
                      )
                  if (semanticCandidate) {
                      output += child
                      retained = true
                  } else {
                      collectSemanticActionAddressBarNodes(
                          node = child,
                          browserPackageName = browserPackageName,
                          expectedWindowId = expectedWindowId,
                          output = output,
                          depth = depth + 1,
                          visitedNodes = visitedNodes
                      )
                  }
              } catch (error: RuntimeException) {
                  FocusGuardLogger.logError(
                      TAG,
                      "Falha ao procurar campo URI acionável do navegador",
                      error
                  )
              } finally {
                  if (!retained) recycleSafely(child)
              }
          }
      }

      private fun AccessibilityNodeInfo.toBrowserUiNode(
''',
              "bounded semantic URI traversal"
          )

          test_path = Path(
              "app/src/test/java/com/focusguard/utils/BrowserSemanticActionPolicyTest.kt"
          )
          test_content = '''package com.focusguard.utils

          import com.focusguard.utils.BrowserUiCapabilityPolicy.NodeAction
          import com.focusguard.utils.BrowserUiCapabilityPolicy.SelectionStatus
          import com.google.common.truth.Truth.assertThat
          import org.junit.Test

          class BrowserSemanticActionPolicyTest {

              @Test
              fun `verified HTTPS handler can use unique native URI editor`() {
                  val editor = node(
                      viewId = "$BROWSER_PACKAGE:id/navigation_input",
                      uriInput = true,
                      actions = setOf(NodeAction.SET_TEXT, NodeAction.IME_ENTER)
                  )

                  val setSelection = BrowserUiCapabilityPolicy.resolveUniqueAddressBarNode(
                      nodes = listOf(editor),
                      expectedBrowserPackage = BROWSER_PACKAGE,
                      expectedWindowId = WINDOW_ID,
                      requiredAction = NodeAction.SET_TEXT,
                      httpsHandlerRecognized = true
                  )
                  val submitSelection = BrowserUiCapabilityPolicy.resolveUniqueAddressBarNode(
                      nodes = listOf(editor),
                      expectedBrowserPackage = BROWSER_PACKAGE,
                      expectedWindowId = WINDOW_ID,
                      requiredAction = NodeAction.IME_ENTER,
                      textPredicate = { it == "https://www.google.com" },
                      httpsHandlerRecognized = true
                  )

                  assertThat(setSelection.status).isEqualTo(SelectionStatus.SELECTED)
                  assertThat(submitSelection.status).isEqualTo(SelectionStatus.SELECTED)
              }

              @Test
              fun `semantic URI editor needs verified HTTPS handler`() {
                  val editor = node(
                      viewId = "$BROWSER_PACKAGE:id/navigation_input",
                      uriInput = true,
                      actions = setOf(NodeAction.SET_TEXT)
                  )

                  assertThat(
                      BrowserUiCapabilityPolicy.resolveUniqueAddressBarNode(
                          nodes = listOf(editor),
                          expectedBrowserPackage = BROWSER_PACKAGE,
                          expectedWindowId = WINDOW_ID,
                          requiredAction = NodeAction.SET_TEXT,
                          httpsHandlerRecognized = false
                      ).status
                  ).isEqualTo(SelectionStatus.NOT_FOUND)
              }

              @Test
              fun `page field and foreign resource id stay non actionable`() {
                  val pageField = node(
                      viewId = "$BROWSER_PACKAGE:id/search_box_text",
                      uriInput = false,
                      actions = setOf(NodeAction.SET_TEXT)
                  )
                  val foreignUri = node(
                      viewId = "com.example.page:id/navigation_input",
                      uriInput = true,
                      actions = setOf(NodeAction.SET_TEXT)
                  )

                  assertThat(
                      BrowserUiCapabilityPolicy.resolveUniqueAddressBarNode(
                          nodes = listOf(pageField, foreignUri),
                          expectedBrowserPackage = BROWSER_PACKAGE,
                          expectedWindowId = WINDOW_ID,
                          requiredAction = NodeAction.SET_TEXT,
                          httpsHandlerRecognized = true
                      ).status
                  ).isEqualTo(SelectionStatus.NOT_FOUND)
              }

              @Test
              fun `two semantic URI editors fail closed as ambiguous`() {
                  val editors = listOf("navigation_input", "location_input").map { entry ->
                      node(
                          viewId = "$BROWSER_PACKAGE:id/$entry",
                          uriInput = true,
                          actions = setOf(NodeAction.SET_TEXT)
                      )
                  }

                  assertThat(
                      BrowserUiCapabilityPolicy.resolveUniqueAddressBarNode(
                          nodes = editors,
                          expectedBrowserPackage = BROWSER_PACKAGE,
                          expectedWindowId = WINDOW_ID,
                          requiredAction = NodeAction.SET_TEXT,
                          httpsHandlerRecognized = true
                      ).status
                  ).isEqualTo(SelectionStatus.AMBIGUOUS)
              }

              private fun node(
                  viewId: String,
                  uriInput: Boolean,
                  actions: Set<NodeAction>
              ) = BrowserUiCapabilityPolicy.Node(
                  packageName = BROWSER_PACKAGE,
                  windowId = WINDOW_ID,
                  viewIdResourceName = viewId,
                  visible = true,
                  editable = true,
                  focused = true,
                  focusable = true,
                  uriInput = uriInput,
                  text = "https://www.google.com",
                  actions = actions
              )

              private companion object {
                  const val BROWSER_PACKAGE = "com.example.browser"
                  const val WINDOW_ID = 7
              }
          }
          '''
          test_content = dedent(test_content).lstrip()
          if not test_path.exists() or test_path.read_text(encoding="utf-8") != test_content:
              test_path.write_text(test_content, encoding="utf-8")

          patch(
              docs,
              '''   - Localiza a barra por ids estritos usados por Chromium, Gecko/Firefox,
             Samsung Internet, Via e navegadores compactos. Inputs URI, ids fracos e
             descrições localizadas ajudam apenas a observar a URL de um handler HTTPS
             confirmado: nunca autorizam foco, troca de texto, submissão ou fechamento.
             - Sob uma cortina opaca e consumidora de toque, tenta fechar a guia apenas
             quando a árvore atual publica exatamente `tab_switcher_button` e
             `close_tab` sob o pacote do navegador. Essa capacidade atende Chrome e
             forks Chromium compatíveis sem uma allowlist de marcas.
             - Um clique em `close_tab` só conta como fechamento depois de um evento
             posterior do navegador e do desaparecimento comprovado da superfície
             bloqueada. Após essa confirmação, abre um novo documento limpo do Google
             no mesmo navegador; a guia sobrevivente jamais é sobrescrita.
             - Se o fechamento não estiver disponível, substitui a própria guia bloqueada
             por uma raiz segura do Google somente quando há um único nó forte, visível,
             editável e com cada ação anunciada. Em Android 8 a 10 (API 26–29), ou quando
             não existe submissão certificável, a cortina permanece e o fluxo evacua para
             HOME. `ACTION_VIEW` só é permitido depois de um fechamento já confirmado.
             - Um clique aceito mas não confirmado nunca autoriza reescrever a guia que
             restou. O fluxo falha fechado em HOME; uma superfície que reapareça será
             avaliada como uma nova navegação.
''',
              '''   - Localiza a barra por ids fortes usados por Chromium, Gecko/Firefox,
             Samsung Internet, Via e navegadores compactos. Para handlers HTTPS
             realmente confirmados pelo `PackageManager`, também aceita como capacidade
             de ação um único campo nativo do próprio pacote/janela que seja editável,
             declare `textUri` e anuncie explicitamente a ação solicitada. Ids fracos e
             descrições localizadas continuam servindo apenas para observação.
             - Sob uma cortina opaca e consumidora de toque, a neutralização substitui a
             URL na própria aba bloqueada e a envia somente quando `ACTION_SET_TEXT` e
             `ACTION_IME_ENTER` podem ser certificados no mesmo campo/janela. A cortina
             só é liberada depois de um evento posterior confirmar uma raiz segura do
             Google.
             - Se a primeira tentativa coincidir com uma animação/foco transitório do
             editor, o FocusGuard restaura a superfície bloqueada exata e tenta uma vez
             de novo com uma política de capacidade nova. A repetição nunca reutiliza
             handles de nós de acessibilidade antigos.
             - O fluxo de site não fecha guia, não fecha navegador, não abre um segundo
             documento por `ACTION_VIEW` e não evacua para HOME. Em Android 8 a 10
             (API 26–29), onde `ACTION_IME_ENTER` ainda não existe, o FocusGuard mantém
             a detecção e a cortina de bloqueio, mas não finge conseguir certificar uma
             submissão universal na mesma aba.
''',
              "website blocking architecture docs"
          )

          patch(
              docs,
              '''A neutralização rápida também é adaptativa: interfaces proprietárias que não
          publiquem os ids e as ações esperados falham de modo fechado e são evacuadas para
          HOME. O Android não oferece uma API pública universal para fechar a guia atual
          ou remover de forma portátil a tarefa do navegador da tela de Recentes. Assim,
          o FocusGuard não promete manipular menus proprietários nem apagar a tarefa de
          Recentes; promete não tocar uma guia ambígua e não liberar a cortina sobre uma
          superfície ainda não confirmada.

          Isso também explica cartões como os exibidos no seletor de abas e na tela de
          Recentes: quando o navegador publica a ação exata, o FocusGuard confirma que a
          guia bloqueada desapareceu antes de prosseguir. Se a interface não publicar essa
          capacidade, o Android não permite apagá-la de maneira universal; nesse caso a
          página fica coberta durante a evacuação, mas uma miniatura antiga ainda pode ser
          mantida pelo próprio navegador ou pelo sistema.
''',
              '''A neutralização rápida também é adaptativa: interfaces proprietárias que não
          publiquem um editor certificável simplesmente não recebem automação destrutiva. O
          Android não oferece uma API pública universal para fechar a guia atual, escolher a
          aba exata ou remover de forma portátil a tarefa do navegador da tela de Recentes.
          Por isso o FocusGuard prefere preservar navegador e abas, falha fechado diante de
          campos ambíguos e só confirma o redirecionamento quando a própria superfície
          acessível prova que a raiz segura foi carregada.

          Cartões exibidos no seletor de abas e na tela de Recentes continuam sob controle do
          navegador/sistema. O FocusGuard não tenta apagá-los por menus proprietários e não
          usa fechamento de aba como substituto de redirecionamento; essa escolha evita
          destruir uma aba sobrevivente quando a árvore de acessibilidade é incompleta.
''',
              "real Android limitation docs"
          )

          patch(
              docs,
              '''- Android API 26, 29 e 30 ou superior, incluindo o fallback HOME nas APIs 26–29;
          - várias abas abertas, duas abas com a mesma URL e menu de abas já visível;
          - confirmação de que um clique de fechar recusado ou inconclusivo não altera a
            aba sobrevivente;
''',
              '''- Android API 26, 29 e 30 ou superior, confirmando que APIs 26–29 não
            fecham o navegador nem usam HOME para simular uma submissão inexistente;
          - várias abas abertas e duas abas com a mesma URL, confirmando que nenhuma aba
            nova é criada e nenhuma aba existente é fechada pelo redirecionamento;
          - um navegador HTTPS adicional cujo editor use id nativo desconhecido, mas
            exponha `textUri`, `ACTION_SET_TEXT` e `ACTION_IME_ENTER`, além de um campo
            de página semelhante para validar que o fallback semântico não o toca;
''',
              "manual verification docs"
          )

      - name: Check patch formatting
        run: git diff --check

      - name: Commit hardened browser redirection
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/main/java/com/focusguard/utils/BrowserUiCapabilityPolicy.kt \
            app/src/main/java/com/focusguard/utils/WebsiteBlocker.kt \
            app/src/test/java/com/focusguard/utils/BrowserSemanticActionPolicyTest.kt \
            docs/WEBSITE_BLOCKING.md
          git commit -m "Harden Android browser same-tab redirection"
          git push origin HEAD:${{ github.ref_name }}