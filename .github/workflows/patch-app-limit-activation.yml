name: Patch app limit activation accounting

on:
  push:
    branches:
      - main
    paths:
      - .github/app-limit-activation.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed source patch
        run: python3 tools/patch_app_limit_activation.py

      - name: Validate patch
        run: |
          git diff --check
          if git diff --exit-code --quiet; then
            echo "No changes produced"
            exit 1
          fi

      - name: Commit to main
        run: |
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add app/src/main/java/com/focusguard/manager/BlockingSessionManager.kt
          git add app/src/main/java/com/focusguard/ui/compose/screens/UsageLimitsScreen.kt
          git commit -m "fix: start app usage allowance when limit is applied"
          git push origin HEAD:main
