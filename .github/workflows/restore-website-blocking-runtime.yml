name: Restore website blocking runtime

on:
  push:
    branches:
      - hardblock-website-blocking-v4

permissions:
  contents: write

jobs:
  restore-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore only reset website runtime seams
        run: python3 .github/scripts/restore_website_blocking_runtime.py

      - name: Compile and test website blocking changes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.focusguard.accessibility.website.blocking.*' \
            --tests 'com.focusguard.accessibility.website.compatibility.BrowserDetector*' \
            --tests 'com.focusguard.accessibility.website.redirection.WebsiteRedirectDestination*' \
            --tests 'com.focusguard.service.WebsiteProtectionHierarchyPolicyTest' \
            --no-daemon
          git diff --check

      - name: Commit restoration and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-website-blocking-runtime.yml
          rm -f .github/scripts/restore_website_blocking_runtime.py
          git config user.name 'FocusGuard website implementation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore website blocking runtime wiring'
          git push origin HEAD:hardblock-website-blocking-v4
