name: Patch browser site redirect v2

on:
  push:
    branches: ["fix/browser-site-redirect"]
    paths:
      - ".github/workflows/patch-browser-site-redirect-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/browser-site-redirect

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply browser redirect hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = service_path.read_text()

          def once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)

          once(
              "        internal var sanitizationRequestedAtUptimeMillis: Long = Long.MAX_VALUE,\n",
              "        internal var sanitizationRequestedAtUptimeMillis: Long = Long.MAX_VALUE,\n"
              "        internal var externalRedirectRequested: Boolean = false,\n"
              "        internal var externalRedirectRequestedAtUptimeMillis: Long = Long.MAX_VALUE,\n",
              'transition external redirect fields',
          )

          marker = "        @Synchronized\n        fun markDestinationRequested("
          method = """        @Synchronized
          fun markExternalRedirectRequested(
              browserPackageName: String,
              transitionId: Long,
              requestedAtUptimeMillis: Long
          ): Boolean {
              val transition = activeTransitions[browserPackageName] ?: return false
              if (transition.id != transitionId || transition.destinationRequested ||
                  requestedAtUptimeMillis < transition.detectionEventUptimeMillis
              ) return false
              transition.sanitizationRequested = true
              transition.sanitizationRequestedAtUptimeMillis = requestedAtUptimeMillis
              transition.externalRedirectRequested = true
              transition.externalRedirectRequestedAtUptimeMillis = requestedAtUptimeMillis
              return true
          }

          """
          # YAML indentation changes multiline literal indentation; normalize it.
          method = '\n'.join(line[10:] if line.startswith('          ') else line for line in method.splitlines()) + '\n'
          if marker not in text:
              raise SystemExit('markDestinationRequested marker not found')
          text = text.replace(marker, method + marker, 1)

          once(
              "                    (it.expectedWindowId == windowId || it.closeConfirmed) &&\n",
              "                    (it.expectedWindowId == windowId ||\n"
              "                        it.closeConfirmed ||\n"
              "                        it.externalRedirectRequested) &&\n",
              'external redirect confirmation window',
          )

          once(
              "            if (transition.id != transitionId || !transition.closeConfirmed ||\n",
              "            if (transition.id != transitionId ||\n"
              "                (!transition.closeConfirmed && !transition.externalRedirectRequested) ||\n",
              'external redirect rebind gate',
          )

          once(
              "            val postCloseCandidate = transition.closeClickedAtUptimeMillis > 0L &&\n"
              "                eventUptimeMillis >= transition.closeClickedAtUptimeMillis\n"
              "            if (transition.expectedWindowId != windowId &&\n"
              "                !postCloseCandidate &&\n"
              "                !(transition.closeConfirmed && transition.sanitizationRequested)\n"
              "            ) return\n",
              "            val postCloseCandidate = transition.closeClickedAtUptimeMillis > 0L &&\n"
              "                eventUptimeMillis >= transition.closeClickedAtUptimeMillis\n"
              "            val externalRedirectCandidate = transition.externalRedirectRequested &&\n"
              "                eventUptimeMillis >= transition.externalRedirectRequestedAtUptimeMillis\n"
              "            if (transition.expectedWindowId != windowId &&\n"
              "                !postCloseCandidate &&\n"
              "                !externalRedirectCandidate &&\n"
              "                !(transition.closeConfirmed && transition.sanitizationRequested)\n"
              "            ) return\n",
              'observe redirected browser window',
          )

          once(
              "                blockWebsite(usage.packageName)\n",
              "                blockWebsite(\n"
              "                    browserPackageName = usage.packageName,\n"
              "                    blockedCandidate = usage.domain,\n"
              "                    detectionEventUptimeMillis = SystemClock.uptimeMillis()\n"
              "                )\n",
              'usage limit website block context',
          )

          fallback_start = text.index(
              "                // If the browser/API cannot expose a certifiable editable\n"
          )
          fallback_end = text.index(
              "\n\n                if (!redirectRequested) {\n"
              "                    stateMachine.onFailureOrTimeout()",
              fallback_start,
          )
          replacement = """                // If the browser/API cannot expose a certifiable editable
          // omnibox, restore the blocked surface and request Google through an
          // explicit package-scoped browser intent while the opaque curtain remains
          // on top. This covers Firefox, Samsung Internet and Chromium forks whose
          // accessibility trees do not expose the same editing actions.
          if (!redirectRequested) {
              val blockedSurfaceRestored =
                  restoreBlockedSurfaceAfterAddressEdit(transition)
              redirectRequested = blockedSurfaceRestored &&
                  requestSafeGoogleThroughBrowserIntent(transition)
          }

          // If even the generic browser intent cannot be launched, retain the
          // positively-identified Chromium close-tab fallback. HOME remains the
          // fail-closed escape when no safe destination can be confirmed.
          if (!redirectRequested) {
              redirectRequested = closeBlockedTabAndRequestSafeGoogle(
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  transition = transition
              )
          }
          """
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          )
          text = text[:fallback_start] + replacement + text[fallback_end:]

          active_root_marker = "    private fun activeBrowserRoot(\n"
          helper = """    private fun currentBrowserSurfaceMatchesBlockedTransition(
          transition: WebsiteBlockTransitionHandle
          ): Boolean {
          val root = activeBrowserRoot(
              transition.browserPackageName,
              transition.expectedWindowId
          ) ?: return false
          val currentAddress = try {
              WebsiteBlocker.extractUrlFromRoot(
                  root,
                  transition.browserPackageName,
                  isVerifiedHttpsHandler(transition.browserPackageName)
              ) ?: WebsiteBlocker.extractAddressBarTextFromRoot(
                  root,
                  transition.browserPackageName,
                  isVerifiedHttpsHandler(transition.browserPackageName)
              )
          } finally {
              recycleSafely(root)
          }
          val detected = transition.blockedCandidate?.takeIf(String::isNotBlank)
              ?: return false
          val detectedRule = WebsiteBlocker.findMatchingRule(
              detected,
              transition.blockedRules
          ) ?: return false
          val currentRule = currentAddress?.let {
              WebsiteBlocker.findMatchingRule(it, transition.blockedRules)
          } ?: return false
          return detectedRule == currentRule
          }

          """
          helper = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in helper.splitlines()
          ) + '\n'
          if active_root_marker not in text:
              raise SystemExit('activeBrowserRoot marker not found')
          text = text.replace(active_root_marker, helper + active_root_marker, 1)

          close_marker = "    private suspend fun closeBlockedTabAndRequestSafeGoogle(\n"
          redirect_helper = """    private fun requestSafeGoogleThroughBrowserIntent(
          transition: WebsiteBlockTransitionHandle
          ): Boolean {
          if (!curtainReadyForTransition(transition) ||
              !currentBrowserSurfaceMatchesBlockedTransition(transition)
          ) return false

          val requestedAt = SystemClock.uptimeMillis()
          if (!websiteBlockTransitionGuard.markExternalRedirectRequested(
                  browserPackageName = transition.browserPackageName,
                  transitionId = transition.id,
                  requestedAtUptimeMillis = requestedAt
              )
          ) return false

          return runCatching {
              startActivity(createSafeBrowserRedirectIntent(transition.browserPackageName))
              true
          }.getOrElse { error ->
              FocusGuardLogger.logError(
                  "A11y",
                  "Falha ao solicitar redirecionamento seguro no navegador",
                  error
              )
              false
          }
          }

          """
          redirect_helper = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in redirect_helper.splitlines()
          ) + '\n'
          if close_marker not in text:
              raise SystemExit('closeBlockedTab marker not found')
          text = text.replace(close_marker, redirect_helper + close_marker, 1)

          once(
              "        internal const val WEBSITE_MIN_BLOCK_NOTICE_MILLIS = 120L\n",
              "        internal const val WEBSITE_MIN_BLOCK_NOTICE_MILLIS = 600L\n",
              'website curtain visible duration',
          )

          intent_marker = "        internal fun createBlockNoticeIntent(\n"
          safe_intent = """        internal fun createSafeBrowserRedirectIntent(
          browserPackageName: String
          ): Intent {
          require(browserPackageName.isNotBlank())
          return Intent(Intent.ACTION_VIEW, Uri.parse(SAFE_REDIRECT_URL)).apply {
              addCategory(Intent.CATEGORY_BROWSABLE)
              setPackage(browserPackageName)
              addFlags(
                  Intent.FLAG_ACTIVITY_NEW_TASK or
                      Intent.FLAG_ACTIVITY_CLEAR_TOP or
                      Intent.FLAG_ACTIVITY_SINGLE_TOP
              )
          }
          }

          """
          safe_intent = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in safe_intent.splitlines()
          ) + '\n'
          if intent_marker not in text:
              raise SystemExit('createBlockNoticeIntent marker not found')
          text = text.replace(intent_marker, safe_intent + intent_marker, 1)

          service_path.write_text(text)

          test_path = Path('app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt')
          tests = test_path.read_text()
          old = (
              "    fun `website curtain perceptual minimum stays low latency`() {\n"
              "        assertThat(BlockingAccessibilityService.WEBSITE_MIN_BLOCK_NOTICE_MILLIS)\n"
              "            .isAtMost(150L)\n"
              "    }\n"
          )
          new = (
              "    fun `website curtain remains visible while redirect starts immediately`() {\n"
              "        assertThat(BlockingAccessibilityService.WEBSITE_MIN_BLOCK_NOTICE_MILLIS)\n"
              "            .isAtLeast(400L)\n"
              "        assertThat(BlockingAccessibilityService.WEBSITE_MIN_BLOCK_NOTICE_MILLIS)\n"
              "            .isAtMost(1_000L)\n"
              "    }\n"
          )
          if old not in tests:
              raise SystemExit('website curtain test not found')
          tests = tests.replace(old, new, 1)

          insertion = "    @Test\n    fun `Chromium capability policy is package based and rejects stale surfaces`() {\n"
          added = """    @Test
          fun `browser intent redirect may confirm on a fresh window from the same browser`() {
          val guard = BlockingAccessibilityService.WebsiteBlockTransitionGuard()
          val transition = guard.tryStart(
              FIREFOX_PACKAGE,
              transitionId = 25L,
              destination = BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
              expectedWindowId = 7,
              blockedCandidate = "https://facebook.com/feed",
              blockedRules = setOf("facebook.com"),
              detectionEventUptimeMillis = 100L
          )!!
          assertThat(
              guard.markExternalRedirectRequested(
                  FIREFOX_PACKAGE,
                  transitionId = 25L,
                  requestedAtUptimeMillis = 110L
              )
          ).isTrue()

          guard.observeBrowserEvent(
              browserPackageName = FIREFOX_PACKAGE,
              windowId = 8,
              eventUptimeMillis = 111L,
              eventType = AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED
          )
          assertThat(
              guard.transitionForConfirmation(
                  FIREFOX_PACKAGE,
                  windowId = 8,
                  eventUptimeMillis = 111L,
                  eventType = AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED
              )
          ).isSameInstanceAs(transition)
          assertThat(
              guard.rebindPostCloseGoogleWindow(
                  FIREFOX_PACKAGE,
                  transitionId = 25L,
                  windowId = 8,
                  eventUptimeMillis = 111L
              )
          ).isTrue()
          assertThat(guard.confirmGoogle(FIREFOX_PACKAGE, 8, 111L)).isTrue()
          }

          @Test
          fun `finished website transition re-arms the same browser for Back navigation`() {
          val guard = BlockingAccessibilityService.WebsiteBlockTransitionGuard()
          assertThat(
              guard.tryStart(
                  CHROME_PACKAGE,
                  transitionId = 26L,
                  destination = BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
                  expectedWindowId = 7,
                  detectionEventUptimeMillis = 100L
              )
          ).isNotNull()
          assertThat(guard.finish(CHROME_PACKAGE, transitionId = 26L)).isTrue()
          assertThat(
              guard.tryStart(
                  CHROME_PACKAGE,
                  transitionId = 27L,
                  destination = BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
                  expectedWindowId = 7,
                  detectionEventUptimeMillis = 200L
              )
          ).isNotNull()
          }

          @Test
          fun `safe redirect intent stays inside the browser that exposed the blocked site`() {
          val intent = BlockingAccessibilityService.createSafeBrowserRedirectIntent(FIREFOX_PACKAGE)
          assertThat(intent.action).isEqualTo(Intent.ACTION_VIEW)
          assertThat(intent.data?.toString()).isEqualTo("https://www.google.com")
          assertThat(intent.`package`).isEqualTo(FIREFOX_PACKAGE)
          assertThat(intent.categories).contains(Intent.CATEGORY_BROWSABLE)
          assertThat(intent.flags and Intent.FLAG_ACTIVITY_NEW_TASK).isNotEqualTo(0)
          assertThat(intent.flags and Intent.FLAG_ACTIVITY_CLEAR_TOP).isNotEqualTo(0)
          assertThat(intent.flags and Intent.FLAG_ACTIVITY_SINGLE_TOP).isNotEqualTo(0)
          }

          """
          added = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in added.splitlines()
          ) + '\n'
          if insertion not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(insertion, added + insertion, 1)
          test_path.write_text(tests)
          PY

      - name: Run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.focusguard.service.WebsiteBlockNavigationTest --no-daemon --stacktrace

      - name: Commit implementation and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-browser-site-redirect.yml
          rm -f .github/workflows/patch-browser-site-redirect-v2.yml
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden blocked website redirect and re-entry"
          git push origin HEAD:fix/browser-site-redirect
