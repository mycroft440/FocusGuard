name: Apply fast path round 2

on:
  push:
    branches: ["perf/cache-fast-path"]
    paths:
      - "tools/fastpath-round2.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-fast-path
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/fastpath-round2.patch
          git apply tools/fastpath-round2.patch
          rm tools/fastpath-round2.patch
          rm .github/workflows/apply-fastpath-round2.yml
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/focusguard/admin/DeviceOwnerManager.kt \
            app/src/main/java/com/focusguard/admin/FocusGuardDeviceAdminReceiver.kt \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add -u -- tools/fastpath-round2.patch .github/workflows/apply-fastpath-round2.yml
          git commit -m "perf: complete cached self-protection decisions"
          git push origin HEAD:perf/cache-fast-path
