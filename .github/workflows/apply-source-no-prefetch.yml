name: Apply source no-prefetch optimization

on:
  push:
    branches: ["perf/cache-fast-path"]
    paths:
      - ".github/workflows/apply-source-no-prefetch.yml"
      - "tools/source-no-prefetch.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-fast-path
          fetch-depth: 0
      - name: Apply checked patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/source-no-prefetch.patch
          git apply tools/source-no-prefetch.patch
          rm tools/source-no-prefetch.patch
          rm .github/workflows/apply-source-no-prefetch.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add -u -- tools/source-no-prefetch.patch .github/workflows/apply-source-no-prefetch.yml
          git commit -m "perf: avoid accessibility source prefetch on Android 13+"
          git push origin HEAD:perf/cache-fast-path
