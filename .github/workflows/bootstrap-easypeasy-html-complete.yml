name: Complete EasyPeasy HTML translations

on:
  push:
    branches:
      - fix/easypeasy-html-offline
    paths:
      - .github/workflows/bootstrap-easypeasy-html-complete.yml

permissions:
  contents: write

jobs:
  bundle-complete-html:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout HTML translation branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mirror complete HTML books
        shell: bash
        run: |
          set -euo pipefail

          root="app/src/main/assets/easypeasy/translations"
          find "$root" -maxdepth 1 -type f -name '*.pdf' -delete
          find "$root" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

          jq -r '.translations[] | [.code, .name, .source] | @tsv' "$root/catalog.json" |
          while IFS=$'\t' read -r code name url; do
            echo "::group::Mirroring $name ($code)"
            lang_dir="$root/$code"
            mirror_dir="$lang_dir/mirror"
            mkdir -p "$mirror_dir"

            host="$(URL="$url" python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          print(urlsplit(os.environ["URL"]).netloc)
          PY
          )"
            path="$(URL="$url" python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          print(urlsplit(os.environ["URL"]).path or "/")
          PY
          )"

            wget_args=(
              --recursive
              --level=inf
              --page-requisites
              --convert-links
              --adjust-extension
              --no-parent
              --execute robots=off
              --timeout=30
              --tries=5
              --retry-on-host-error
              --retry-on-http-error=429,500,502,503,504,522
              --waitretry=3
              --reject=*.pdf,*.epub,*.zip
              --domains="$host"
              --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
              --header="Accept-Language: en-US,en;q=0.9"
              --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
              --directory-prefix="$mirror_dir"
            )

            if [[ "$code" == "en" ]]; then
              wget_args+=(
                --reject-regex='https?://easypeasymethod\.org/(de|it|nl|pl|pt-br|ro|sq|so|sv|ru|uk|ko)(/|$)|https?://easypeasymethod\.org/translations/|\.pdf($|\?)'
              )
            fi

            set +e
            wget "${wget_args[@]}" "$url"
            wget_status=$?
            set -e

            host_dir="$mirror_dir/$host"
            expected_main=""
            if [[ "$path" == "/" || -z "$path" ]]; then
              expected_main="$host_dir/index.html"
            elif [[ "$path" == */ ]]; then
              expected_main="$host_dir${path}index.html"
            else
              if [[ -f "$host_dir${path}.html" ]]; then
                expected_main="$host_dir${path}.html"
              elif [[ -f "$host_dir${path}/index.html" ]]; then
                expected_main="$host_dir${path}/index.html"
              fi
            fi

            if [[ -z "$expected_main" || ! -s "$expected_main" ]]; then
              echo "Primary HTML document was not found for $code at the expected source path." >&2
              find "$host_dir" -type f -iname '*.html' -maxdepth 12 -print 2>/dev/null | head -n 20 || true
              exit 1
            fi

            if [[ "$wget_status" -ne 0 ]]; then
              echo "wget returned $wget_status for $code; continuing because the complete source scope was mirrored."
            fi

            relative_main="${expected_main#"$lang_dir/"}"
            CODE="$code" NAME="$name" SOURCE="$url" TARGET="$relative_main" LANG_DIR="$lang_dir" python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          lang_dir = Path(os.environ["LANG_DIR"])
          name = os.environ["NAME"]
          source = os.environ["SOURCE"]
          target = os.environ["TARGET"]
          code = os.environ["CODE"]

          entry = f"""<!doctype html>
          <html lang="{html.escape(code)}">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url={html.escape(target, quote=True)}">
            <title>{html.escape(name)} · EasyPeasy offline</title>
          </head>
          <body>
            <p><a href="{html.escape(target, quote=True)}">Open {html.escape(name)} EasyPeasy</a></p>
          </body>
          </html>
          """
          (lang_dir / "index.html").write_text(entry, encoding="utf-8")
          (lang_dir / "snapshot.json").write_text(
              json.dumps(
                  {
                      "code": code,
                      "name": name,
                      "source": source,
                      "format": "html",
                      "offlineDocument": target,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

            page_count="$(find "$host_dir" -type f -iname '*.html' | wc -l)"
            echo "Captured $page_count HTML documents; entry: $expected_main"
            echo "::endgroup::"
          done

          test "$(find "$root" -type f -iname '*.pdf' | wc -l)" -eq 0
          test "$(find "$root" -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)" -eq 15
          du -sh "$root"

      - name: Run focused offline-book asset test
        run: ./gradlew :app:testDebugUnitTest --tests com.focusguard.ui.OfflineBookAssetsTest

      - name: Verify debug build
        run: ./gradlew :app:assembleDebug

      - name: Commit complete HTML mirrors and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/bootstrap-easypeasy-html-complete.yml
          git add -A app/src/main/assets/easypeasy/translations
          git diff --cached --stat

          git commit -m "Mirror complete EasyPeasy HTML editions for offline use"
          git push
