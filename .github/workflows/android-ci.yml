          )

          release = ".github/workflows/release.yml"
          replace_once(
              release,
              '''      - name: Run checks and build canonical Release APK and AAB
              shell: bash
              env:
                KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
              run: |
                set -euo pipefail
                ./gradlew \\
                  lintRelease \\
                  testReleaseUnitTest \\
                  assembleRelease \\
                  bundleRelease \\
                  --no-daemon \\
                  --stacktrace
          ''',
              '''      - name: Run release lint
              shell: bash
              env:
                KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
              run: |
                set -euo pipefail
                set -o pipefail
                ./gradlew lintRelease --no-daemon --stacktrace 2>&1 | tee release-lint-gradle.log

            - name: Run release unit tests
              shell: bash
              env:
                KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
              run: |
                set -euo pipefail
                set +e
                ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee release-unit-tests-gradle.log
                first_status=${PIPESTATUS[0]}
                set -e
                if [ "$first_status" -eq 0 ]; then
                  exit 0
                fi

                if grep -q "MavenArtifactFetcher" release-unit-tests-gradle.log && \\
                   grep -Eq "SocketException|ConnectException|UnknownHostException|SocketTimeoutException" release-unit-tests-gradle.log; then
                  echo "::warning::Transient Robolectric dependency transport failure detected; retrying release unit tests once."
                  ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee -a release-unit-tests-gradle.log
                else
                  exit "$first_status"
                fi

            - name: Build canonical Release APK and AAB
              shell: bash
              env:
                KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
              run: |
                set -euo pipefail
                set -o pipefail
                ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee release-build-gradle.log

            - name: Upload release diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: release-diagnostics-${{ github.run_number }}
                path: |
                  release-lint-gradle.log
                  release-unit-tests-gradle.log
                  release-build-gradle.log
                  app/build/reports/tests/
                  app/build/test-results/
                  app/build/reports/lint-results-*.html
                  app/build/reports/lint-results-*.xml
                if-no-files-found: warn
                retention-days: 14
          '''
          )
          PY

          git diff --check
          git fetch origin e0ff008def4ad155d818add11d111cd9e87a7153 --depth=1
          git show e0ff008def4ad155d818add11d111cd9e87a7153:.github/workflows/android-ci.yml > .github/workflows/android-ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
                  app/src/test/java/com/focusguard/service/BlockingAccessibilityInputTest.kt \
                  .github/workflows/release.yml \
                  .github/workflows/android-ci.yml
          git commit -m "fix(a11y): harden ANR-prone browser inspection"
          git push origin HEAD:fix/anr-runtime-release-hardening-20260916

  static-analysis:
    name: Android Lint
    if: github.ref != 'refs/heads/fix/anr-runtime-release-hardening-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-gradle.log
      - name: Upload Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics-${{ github.run_number }}
          path: |
            lint-gradle.log
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    if: github.ref != 'refs/heads/fix/anr-runtime-release-hardening-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests-gradle.log
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_number }}
          path: |
            unit-tests-gradle.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 14

  performance-harness:
    name: Compile Performance Harness
    if: github.ref != 'refs/heads/fix/anr-runtime-release-hardening-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Compile Macrobenchmark and Baseline Profile variants
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:compileBenchmarkReleaseKotlin \
            :app:compileNonMinifiedReleaseKotlin \
            :app:processBenchmarkReleaseMainManifest \
            :app:processNonMinifiedReleaseMainManifest \
            :baselineprofile:compileBenchmarkReleaseKotlin \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            --no-daemon --stacktrace 2>&1 | tee performance-harness-gradle.log
      - name: Validate percentile parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/summarize_focusguard_latency.py --self-test
          python3 scripts/summarize_macrobenchmark.py --self-test
      - name: Upload performance-harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-harness-diagnostics-${{ github.run_number }}
          path: performance-harness-gradle.log
          if-no-files-found: error
          retention-days: 14
