name: Android CI Pro

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  apply-device-admin-patch:
    name: Apply staged Device Admin patch
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/device-admin-fastpath'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and commit patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_device_admin_fastpath_patch.py
          git diff --check
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/main/java/com/focusguard/ui/MasterRemovalActivity.kt \
            app/src/main/java/com/focusguard/security/ManagedSelfProtectionPolicy.kt \
            app/src/test/java/com/focusguard/security/ProtectedSettingsResetWindowTest.kt \
            app/src/test/java/com/focusguard/security/ImmediateInterceptionPolicyTest.kt
          git commit -m "[device-admin-patch] fix: harden and accelerate device admin interception"
          git push origin HEAD:${GITHUB_HEAD_REF}

  static-analysis:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-gradle.log
      - name: Upload Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics-${{ github.run_number }}
          path: |
            lint-gradle.log
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests-gradle.log
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_number }}
          path: |
            unit-tests-gradle.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 14

  performance-harness:
    name: Compile Performance Harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Compile Macrobenchmark and Baseline Profile variants
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :baselineprofile:compileBenchmarkReleaseKotlin \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            --no-daemon --stacktrace 2>&1 | tee performance-harness-gradle.log
      - name: Validate percentile parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/summarize_focusguard_latency.py --self-test
          python3 scripts/summarize_macrobenchmark.py --self-test
      - name: Upload performance-harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-harness-diagnostics-${{ github.run_number }}
          path: performance-harness-gradle.log
          if-no-files-found: error
          retention-days: 14

  build-artifacts:
    name: Build and verify installable Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOCUSGUARD_CI_SIGNING: "true"
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore stable CI signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: focusguard-ci-signing-v1

      - name: Ensure stable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 3072 \
              -validity 36500 \
              -dname "CN=FocusGuard CI,OU=CI,O=FocusGuard,C=BR"
          fi
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Configure production signing when secrets exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && \
                -n "$RELEASE_KEYSTORE_PASSWORD" && \
                -n "$RELEASE_KEY_ALIAS" && \
                -n "$RELEASE_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/focusguard-release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            echo "SIGNING_MODE=ci" >> "$GITHUB_ENV"
          fi

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew

      - name: Build APKs and AAB
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace 2>&1 | tee build-all-gradle.log

      - name: Verify signatures and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -size +0c | head -n 1)"
          RELEASE_AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          test -n "$DEBUG_APK" && test -s "$DEBUG_APK"
          test -n "$RELEASE_AAB" && test -s "$RELEASE_AAB"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          mkdir -p ci-artifacts

          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" \
            | tee ci-artifacts/release-apksigner.txt
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" \
            | tee ci-artifacts/debug-apksigner.txt

          "$AAPT" dump badging "$RELEASE_APK" | head -n 1 \
            | tee ci-artifacts/release-package.txt
          grep -Eq "package: name='com\.focusguard\.v2(\.ci)?'" \
            ci-artifacts/release-package.txt

          jarsigner -verify "$RELEASE_AAB" 2>&1 \
            | tee ci-artifacts/release-aab-signing.txt
          grep -q "jar verified" ci-artifacts/release-aab-signing.txt

          if [[ "$SIGNING_MODE" == "production" ]]; then
            cp "$RELEASE_APK" ci-artifacts/FocusGuard-release.apk
            cp "$RELEASE_AAB" ci-artifacts/FocusGuard-release.aab
          else
            grep -q "package: name='com.focusguard.v2.ci'" \
              ci-artifacts/release-package.txt
            cp "$RELEASE_APK" ci-artifacts/FocusGuard-ci-release.apk
            cp "$RELEASE_AAB" ci-artifacts/FocusGuard-ci-release.aab
          fi
          cp "$DEBUG_APK" ci-artifacts/FocusGuard-debug.apk

          find ci-artifacts -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -print0 | sort -z | xargs -0 sha256sum > ci-artifacts/SHA256SUMS.txt
          ls -lh ci-artifacts

      - name: Upload production Release APK
        if: env.SIGNING_MODE == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-apk-${{ github.run_number }}
          path: ci-artifacts/FocusGuard-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload installable CI Release APK
        if: env.SIGNING_MODE == 'ci'
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-ci-release-apk-${{ github.run_number }}
          path: ci-artifacts/FocusGuard-ci-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-debug-apk-${{ github.run_number }}
          path: ci-artifacts/FocusGuard-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload production Release AAB
        if: env.SIGNING_MODE == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-aab-${{ github.run_number }}
          path: ci-artifacts/FocusGuard-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload CI Release AAB
        if: env.SIGNING_MODE == 'ci'
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-ci-release-aab-${{ github.run_number }}
          path: ci-artifacts/FocusGuard-ci-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums and signature reports
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-build-verification-${{ github.run_number }}
          path: |
            ci-artifacts/SHA256SUMS.txt
            ci-artifacts/*signing.txt
            ci-artifacts/*apksigner.txt
            ci-artifacts/release-package.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: build-all-gradle.log
          if-no-files-found: error
          retention-days: 14
