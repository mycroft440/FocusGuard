name: Android CI Pro

on:
  push:
    branches: ["main", "master", "fix/website-block-detection-latency"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  apply-website-latency-patch:
    name: Apply website latency patch
    if: github.event_name == 'push' && github.ref_name == 'fix/website-block-detection-latency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact scoped replacements
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt"
          if grep -q 'browserWindowIdValidated' "$SERVICE"; then
            echo "Scoped service patch already applied."
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              file.write_text(text.replace(old, new, 1))

          service = "app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt"
          replace_once(
              service,
              '''            routeWebsiteBlockByHierarchy(
                browserPackageName = currentPackage,
                browserWindowId = windowId,
                blockedCandidate = blockedCandidate,
                detectionEventUptimeMillis = SystemClock.uptimeMillis()
            )
''',
              '''            routeWebsiteBlockByHierarchy(
                browserPackageName = currentPackage,
                browserWindowId = windowId,
                blockedCandidate = blockedCandidate,
                detectionEventUptimeMillis = SystemClock.uptimeMillis(),
                browserWindowIdValidated = true
            )
'''
          )
          replace_once(
              service,
              '''        routeWebsiteBlockByHierarchy(
            browserPackageName = packageName,
            browserWindowId = event.windowId,
            blockedCandidate = url ?: addressText ?: blockedCandidate,
            detectionEventUptimeMillis = event.eventTime
        )
        return true
''',
              '''        routeWebsiteBlockByHierarchy(
            browserPackageName = packageName,
            browserWindowId = event.windowId,
            blockedCandidate = url ?: addressText ?: blockedCandidate,
            detectionEventUptimeMillis = event.eventTime,
            browserWindowIdValidated = true
        )
        return true
'''
          )
          replace_once(
              service,
              '''        val root = if (fastUrl == null) rootInActiveWindow ?: event.source else null
        val url = fastUrl ?: WebsiteBlocker.extractUrlFromRoot(
            root,
            packageName,
            isVerifiedHttpsHandler(packageName)
        )
        val addressText = fastAddressText
            ?: WebsiteBlocker.extractAddressBarTextFromRoot(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )
        val addressBarObservable = fastAddressText != null ||
            url != null || WebsiteBlocker.hasAddressBarNode(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )

        // Even on the root-fallback path, the block decision outranks tracking,
        // policy refreshes and observability bookkeeping. Once the URL is known,
        // cover the page immediately just like blockApp() covers an app window.
        val blockedCandidate = immediateWebsiteBlockTarget(
                addressText = addressText,
                url = url,
                blockedRules = blockedWebsitesDomainSet
            )
        if (blockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = event.windowId,
                blockedCandidate = url ?: addressText ?: blockedCandidate,
                detectionEventUptimeMillis = event.eventTime
            )
            recycleSafely(root)
            return
        }
''',
              '''        // Direct omnibox evidence can be classified before any active-root read.
        val fastBlockedCandidate = immediateWebsiteBlockTarget(
            addressText = fastAddressText,
            url = fastUrl,
            blockedRules = blockedWebsitesDomainSet
        )
        if (fastBlockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = event.windowId,
                blockedCandidate = fastUrl ?: fastAddressText ?: fastBlockedCandidate,
                detectionEventUptimeMillis = event.eventTime,
                browserWindowIdValidated = true
            )
            return
        }

        val root = if (fastUrl == null) rootInActiveWindow ?: event.source else null
        val url = fastUrl ?: WebsiteBlocker.extractUrlFromRoot(
            root,
            packageName,
            isVerifiedHttpsHandler(packageName)
        )
        val detectedWindowId = if (fastUrl != null) {
            event.windowId
        } else {
            root?.windowId ?: event.windowId
        }

        // Normal URL/domain rules do not need a second tree traversal for raw text.
        val urlBlockedCandidate = immediateWebsiteBlockTarget(
            addressText = null,
            url = url,
            blockedRules = blockedWebsitesDomainSet
        )
        if (urlBlockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = detectedWindowId,
                blockedCandidate = url ?: urlBlockedCandidate,
                detectionEventUptimeMillis = event.eventTime,
                browserWindowIdValidated = true
            )
            recycleSafely(root)
            return
        }

        val addressText = fastAddressText
            ?: WebsiteBlocker.extractAddressBarTextFromRoot(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )
        val addressBarObservable = addressText != null ||
            url != null || WebsiteBlocker.hasAddressBarNode(
                root,
                packageName,
                isVerifiedHttpsHandler(packageName)
            )

        // Raw text remains necessary for category/search rules that are not URLs.
        val blockedCandidate = immediateWebsiteBlockTarget(
            addressText = addressText,
            url = url,
            blockedRules = blockedWebsitesDomainSet
        )
        if (blockedCandidate != null) {
            routeWebsiteBlockByHierarchy(
                browserPackageName = packageName,
                browserWindowId = detectedWindowId,
                blockedCandidate = url ?: addressText ?: blockedCandidate,
                detectionEventUptimeMillis = event.eventTime,
                browserWindowIdValidated = true
            )
            recycleSafely(root)
            return
        }
'''
          )
          replace_once(
              service,
              '''                blockWebsite(
                    browserPackageName = packageName,
                    browserWindowId = event.windowId,
                    blockedCandidate = url,
                    detectionEventUptimeMillis = event.eventTime
                )
''',
              '''                blockWebsite(
                    browserPackageName = packageName,
                    browserWindowId = detectedWindowId,
                    blockedCandidate = url,
                    detectionEventUptimeMillis = event.eventTime,
                    browserWindowIdValidated = true
                )
'''
          )
          replace_once(
              service,
              '''    private fun routeWebsiteBlockByHierarchy(
        browserPackageName: String,
        browserWindowId: Int,
        blockedCandidate: String,
        detectionEventUptimeMillis: Long
    ) {
''',
              '''    private fun routeWebsiteBlockByHierarchy(
        browserPackageName: String,
        browserWindowId: Int,
        blockedCandidate: String,
        detectionEventUptimeMillis: Long,
        browserWindowIdValidated: Boolean = false
    ) {
'''
          )
          replace_once(
              service,
              '''        blockWebsite(
            browserPackageName = browserPackageName,
            browserWindowId = browserWindowId,
            blockedCandidate = blockedCandidate,
            detectionEventUptimeMillis = detectionEventUptimeMillis
        )
''',
              '''        blockWebsite(
            browserPackageName = browserPackageName,
            browserWindowId = browserWindowId,
            blockedCandidate = blockedCandidate,
            detectionEventUptimeMillis = detectionEventUptimeMillis,
            browserWindowIdValidated = browserWindowIdValidated
        )
'''
          )
          replace_once(
              service,
              '''    private fun blockWebsite(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L
    ) {
        val now = System.currentTimeMillis()
        stopWebsiteTracking(now)
        startWebsiteBlockTransition(
            browserPackageName,
            browserWindowId,
            blockedCandidate,
            detectionEventUptimeMillis
        )
    }
''',
              '''    private fun blockWebsite(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L,
        browserWindowIdValidated: Boolean = false
    ) {
        val now = System.currentTimeMillis()
        stopWebsiteTracking(now)
        startWebsiteBlockTransition(
            browserPackageName = browserPackageName,
            browserWindowId = browserWindowId,
            blockedCandidate = blockedCandidate,
            detectionEventUptimeMillis = detectionEventUptimeMillis,
            browserWindowIdValidated = browserWindowIdValidated
        )
    }
'''
          )
          replace_once(
              service,
              '''    private fun startWebsiteBlockTransition(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L
    ) {
        val expectedWindowId = resolveBrowserWindowId(browserPackageName, browserWindowId)
''',
              '''    private fun startWebsiteBlockTransition(
        browserPackageName: String,
        browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
        blockedCandidate: String? = null,
        detectionEventUptimeMillis: Long = 0L,
        browserWindowIdValidated: Boolean = false
    ) {
        val expectedWindowId = if (browserWindowIdValidated && browserWindowId >= 0) {
            browserWindowId
        } else {
            resolveBrowserWindowId(browserPackageName, browserWindowId)
        }
'''
          )
          PY
          git diff --check
          git diff --stat
      - name: Commit scoped patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git diff --cached --check
          git commit -m "fix: reduce website block detection latency"
          git push origin HEAD:fix/website-block-detection-latency

  static-analysis:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-gradle.log
      - name: Upload Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics-${{ github.run_number }}
          path: |
            lint-gradle.log
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests-gradle.log
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_number }}
          path: |
            unit-tests-gradle.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 14

  performance-harness:
    name: Compile Performance Harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Compile Macrobenchmark and Baseline Profile variants
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:compileBenchmarkReleaseKotlin \
            :app:compileNonMinifiedReleaseKotlin \
            :app:processBenchmarkReleaseMainManifest \
            :app:processNonMinifiedReleaseMainManifest \
            :baselineprofile:compileBenchmarkReleaseKotlin \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            --no-daemon --stacktrace 2>&1 | tee performance-harness-gradle.log
      - name: Validate percentile parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/summarize_focusguard_latency.py --self-test
          python3 scripts/summarize_macrobenchmark.py --self-test
      - name: Upload performance-harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-harness-diagnostics-${{ github.run_number }}
          path: performance-harness-gradle.log
          if-no-files-found: error
          retention-days: 14
