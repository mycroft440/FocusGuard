name: Android CI Pro

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  static-analysis:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-gradle.log
      - name: Upload Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-diagnostics
          path: |
            lint-gradle.log
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests-gradle.log
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-diagnostics
          path: |
            unit-tests-gradle.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 14

  release-verification:
    name: Verify Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static-analysis, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Compile release outputs without publishing
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee release-verification-gradle.log
      - name: Verify release files exist
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/release -type f -name '*.apk' -size +0c -print -quit | grep -q .
          find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c -print -quit | grep -q .
      - name: Collect unsigned PR validation files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c -print -quit)"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          mkdir -p validation-release
          cp "$APK" "validation-release/FocusGuard-UNSIGNED-PR${PR_NUMBER}.apk"
          cp "$AAB" "validation-release/FocusGuard-UNSIGNED-PR${PR_NUMBER}.aab"
          sha256sum \
            "validation-release/FocusGuard-UNSIGNED-PR${PR_NUMBER}.apk" \
            "validation-release/FocusGuard-UNSIGNED-PR${PR_NUMBER}.aab" \
            > validation-release/SHA256SUMS.txt

          cat > validation-release/README.txt <<EOF
          FocusGuard pull-request validation artifacts
          PR: #${PR_NUMBER}
          Commit: ${GITHUB_SHA}

          IMPORTANT: These APK/AAB files are CI validation outputs and are NOT the official signed release.
          Use the signed artifacts produced by the FocusGuard Release workflow on main for distribution or Google Play.
          EOF

          {
            echo "### Unsigned release validation artifacts"
            echo "APK and AAB were compiled successfully for PR #${PR_NUMBER}."
            echo "They are uploaded below only for validation and are not the official signed release."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned PR Release APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: focusguard-pr${{ github.event.pull_request.number }}-release-apk-UNSIGNED
          path: |
            validation-release/FocusGuard-UNSIGNED-PR${{ github.event.pull_request.number }}.apk
            validation-release/README.txt
            validation-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned PR Play AAB
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: focusguard-pr${{ github.event.pull_request.number }}-play-aab-UNSIGNED
          path: |
            validation-release/FocusGuard-UNSIGNED-PR${{ github.event.pull_request.number }}.aab
            validation-release/README.txt
            validation-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload release verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-diagnostics
          path: release-verification-gradle.log
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static-analysis, unit-tests, release-verification]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Compile debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build-gradle.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: build-gradle.log
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: focusguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
