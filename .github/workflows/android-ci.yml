name: Android CI Pro

on:
  push:
    branches: ["main", "master", "fix/website-block-detection-latency"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  apply-website-latency-patch:
    name: Apply website latency patch
    if: github.event_name == 'push' && github.ref_name == 'fix/website-block-detection-latency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped service patch
        run: python3 scripts/apply_website_latency_patch.py
      - name: Commit scoped patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No patch commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git diff --cached --check
          git commit -m "fix: reduce website block detection latency"
          git push origin HEAD:fix/website-block-detection-latency

  static-analysis:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-gradle.log
      - name: Upload Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics-${{ github.run_number }}
          path: |
            lint-gradle.log
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests-gradle.log
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_number }}
          path: |
            unit-tests-gradle.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 14

  performance-harness:
    name: Compile Performance Harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Compile Macrobenchmark and Baseline Profile variants
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:compileBenchmarkReleaseKotlin \
            :app:compileNonMinifiedReleaseKotlin \
            :app:processBenchmarkReleaseMainManifest \
            :app:processNonMinifiedReleaseMainManifest \
            :baselineprofile:compileBenchmarkReleaseKotlin \
            :baselineprofile:compileNonMinifiedReleaseKotlin \
            --no-daemon --stacktrace 2>&1 | tee performance-harness-gradle.log
      - name: Validate percentile parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/summarize_focusguard_latency.py --self-test
          python3 scripts/summarize_macrobenchmark.py --self-test
      - name: Upload performance-harness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-harness-diagnostics-${{ github.run_number }}
          path: performance-harness-gradle.log
          if-no-files-found: error
          retention-days: 14
