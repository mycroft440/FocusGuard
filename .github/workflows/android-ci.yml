name: Android CI Pro

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Cancela builds antigos se fizer um novo commit rapidamente
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FocusGuard APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Conceder permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Salvar APK Debug (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Verificar secrets de assinatura Release
        id: release_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\n' | tr -d '\r' | base64 -d > ${{ github.workspace }}/release.jks
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured from GitHub Secrets."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secrets are incomplete or missing. Skipping release APK build; debug APK build remains the required CI compilation check."
          fi

      - name: Compilar APK Release
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Remover Keystore Físico (Segurança)
        if: always()
        run: rm -f ${{ github.workspace }}/release.jks

      - name: Salvar APK Release (Artefato)
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-apk
          path: app/build/outputs/apk/release/*.apk
