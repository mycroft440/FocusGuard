name: Finish website runtime routing v4

on:
  push:
    branches:
      - hardblock-website-blocking-v4

permissions:
  contents: write

jobs:
  integrate-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch only website runtime routing seams
        run: python3 .github/scripts/finish_website_runtime_routing_v4.py

      - name: Compile and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'com.focusguard.accessibility.website.blocking.*' \
            --tests 'com.focusguard.accessibility.website.redirection.*' \
            --tests 'com.focusguard.service.WebsiteProtectionHierarchyPolicyTest' \
            --tests 'com.focusguard.service.BlockingAccessibilityInputTest' \
            --no-daemon
          git diff --check

      - name: Commit integration and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/finish_website_runtime_routing_v4.py
          rm -f .github/workflows/finish-website-runtime-routing-v4.yml
          git config user.name 'FocusGuard website implementation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete website runtime routing'
          git push origin HEAD:hardblock-website-blocking-v4
