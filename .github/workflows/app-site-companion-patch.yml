name: App-site companion patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply companion blocking UI patch
        shell: python
        run: |
          from pathlib import Path
          import re

          create = Path('app/src/main/java/com/focusguard/ui/CreateSessionActivity.kt')
          text = create.read_text()

          text = text.replace('import androidx.compose.material3.RadioButton\n', '')
          if 'import com.focusguard.ui.compose.screens.AssociatedTargetOptionDialog\n' not in text:
              text = text.replace(
                  'import com.focusguard.ui.compose.screens.AppSelectionList\n',
                  'import com.focusguard.ui.compose.screens.AppSelectionList\n'
                  'import com.focusguard.ui.compose.screens.AssociatedTargetOptionDialog\n'
              )

          old_sig = '''    allowCompatibleProtection: Boolean = false,
              kinds: BlockTargetPolicy.Kinds = BlockTargetPolicy.APPS_ONLY,
              initialRules: List<String> = emptyList()
          ) {'''.replace('              ', '')
          new_sig = '''    allowCompatibleProtection: Boolean = false,
              kinds: BlockTargetPolicy.Kinds = BlockTargetPolicy.APPS_ONLY,
              initialRules: List<String> = emptyList(),
              offerWebsiteCompanion: Boolean = kinds.websites
          ) {'''.replace('              ', '')
          if old_sig not in text:
              raise SystemExit('AppSelectionStep signature pattern not found')
          text = text.replace(old_sig, new_sig, 1)
          text = text.replace(
              'if (!wasSelected && kinds.websites) {',
              'if (!wasSelected && offerWebsiteCompanion) {',
              1
          )
          text = text.replace(
              'title = "Bloquear site do app também?",\n'
              '                message = "Você bloqueou ${appInfo.appName}. Bloquear $domain também?",',
              'title = stringResource(R.string.associated_target_block_site_title),\n'
              '                message = stringResource(\n'
              '                    R.string.associated_target_block_site_message,\n'
              '                    appInfo.appName,\n'
              '                    domain\n'
              '                ),',
              1
          )
          text = text.replace(
              'title = "Bloquear app do site também?",\n'
              '            message = "Você bloqueou ${WebsiteBlocker.displayRule(rule)}. " +\n'
              '                "Bloquear ${appInfo.appName} também?",',
              'title = stringResource(R.string.associated_target_block_app_title),\n'
              '            message = stringResource(\n'
              '                R.string.associated_target_block_app_message,\n'
              '                WebsiteBlocker.displayRule(rule),\n'
              '                appInfo.appName\n'
              '            ),',
              1
          )

          pattern = re.compile(
              r'\n@Composable\nprivate fun AssociatedTargetOptionDialog\(.*?\n}\n\nprivate enum class BlockTargetTab',
              re.S
          )
          text, count = pattern.subn('\nprivate enum class BlockTargetTab', text, count=1)
          if count != 1:
              raise SystemExit('Local AssociatedTargetOptionDialog block not found')
          create.write_text(text)

          setup = Path('app/src/main/java/com/focusguard/ui/compose/screens/ProtectionSetupScreen.kt')
          text = setup.read_text()
          if 'import com.focusguard.data.PredefinedApps\n' not in text:
              text = text.replace(
                  'import com.focusguard.data.PredefinedWebsites\n',
                  'import com.focusguard.data.PredefinedApps\nimport com.focusguard.data.PredefinedWebsites\n'
              )
          if 'import com.focusguard.utils.AssociatedBlockTargets\n' not in text:
              text = text.replace(
                  'import com.focusguard.utils.FocusGuardLogger\n',
                  'import com.focusguard.utils.AssociatedBlockTargets\nimport com.focusguard.utils.FocusGuardLogger\n'
              )

          old_app_picker = '''            ProtectionSetupPage.APP_PICKER -> AppSelectionStep(
                  onNext = { apps, _ ->
                      scope.launch {
                          val latest = refreshConfiguredBlockedTargets()
                          val availableApps = apps.filterNot {
                              it.packageName in latest.unavailableAppPackageNames
                          }
                          if (availableApps.size != apps.size) {
                              Toast.makeText(
                                  context,
                                  context.getString(R.string.app_already_blocked),
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                          selectedApps = availableApps
                          returnToList()
                      }
                  },
                  onBack = ::returnToList,
                  initialSelectedPackages = selectedApps.mapTo(linkedSetOf()) { it.packageName },
                  allowCompatibleProtection = true
              )'''.replace('              ', '')
          new_app_picker = '''            ProtectionSetupPage.APP_PICKER -> AppSelectionStep(
                  onNext = { apps, companionRules ->
                      scope.launch {
                          val latest = refreshConfiguredBlockedTargets()
                          val availableApps = apps.filterNot {
                              it.packageName in latest.unavailableAppPackageNames
                          }
                          val availableRules = companionRules.filterNot {
                              isWebsiteRuleAlreadyBlocked(it, latest.unavailableWebsiteRules)
                          }
                          if (availableApps.size != apps.size) {
                              Toast.makeText(
                                  context,
                                  context.getString(R.string.app_already_blocked),
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                          if (availableRules.size != companionRules.size) {
                              Toast.makeText(
                                  context,
                                  context.getString(R.string.site_already_blocked),
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                          selectedApps = availableApps
                          websiteRules = availableRules
                          returnToList()
                      }
                  },
                  onBack = ::returnToList,
                  initialSelectedPackages = selectedApps.mapTo(linkedSetOf()) { it.packageName },
                  initialRules = websiteRules,
                  allowCompatibleProtection = true,
                  offerWebsiteCompanion = true
              )'''.replace('              ', '')
          if old_app_picker not in text:
              raise SystemExit('Unified APP_PICKER pattern not found')
          text = text.replace(old_app_picker, new_app_picker, 1)

          old_site_call = '''            ProtectionSetupPage.WEBSITE_PICKER -> WebsiteRuleSelectionScreen(
                  initialRules = websiteRules,
                  configuredBlockedRules = configuredBlockedTargets.unavailableWebsiteRules,
                  onSave = { rules ->'''.replace('              ', '')
          new_site_call = '''            ProtectionSetupPage.WEBSITE_PICKER -> WebsiteRuleSelectionScreen(
                  initialRules = websiteRules,
                  configuredBlockedRules = configuredBlockedTargets.unavailableWebsiteRules,
                  selectedAppPackages = selectedApps.mapTo(linkedSetOf()) { it.packageName },
                  configuredBlockedPackages = configuredBlockedTargets.unavailableAppPackageNames,
                  onCompanionAppSelected = { appInfo ->
                      if (selectedApps.none { it.packageName == appInfo.packageName } &&
                          appInfo.packageName !in configuredBlockedTargets.unavailableAppPackageNames
                      ) {
                          selectedApps = selectedApps + SelectableAppUi(
                              packageName = appInfo.packageName,
                              appName = appInfo.appName,
                              isSelected = true,
                              isInstalled = context.packageManager
                                  .getLaunchIntentForPackage(appInfo.packageName) != null,
                              category = appInfo.category,
                              iconUrl = appInfo.domain?.let { domain ->
                                  "https://www.google.com/s2/favicons?domain=$domain&sz=128"
                              }
                          )
                      }
                  },
                  onSave = { rules ->'''.replace('              ', '')
          if old_site_call not in text:
              raise SystemExit('Unified WEBSITE_PICKER call pattern not found')
          text = text.replace(old_site_call, new_site_call, 1)

          old_site_sig = '''private fun WebsiteRuleSelectionScreen(
              initialRules: List<String>,
              configuredBlockedRules: Set<String>,
              onSave: (List<String>) -> Unit,
              onBack: () -> Unit
          ) {'''.replace('              ', '')
          new_site_sig = '''private fun WebsiteRuleSelectionScreen(
              initialRules: List<String>,
              configuredBlockedRules: Set<String>,
              selectedAppPackages: Set<String>,
              configuredBlockedPackages: Set<String>,
              onCompanionAppSelected: (PredefinedApps.AppInfo) -> Unit,
              onSave: (List<String>) -> Unit,
              onBack: () -> Unit
          ) {'''.replace('              ', '')
          if old_site_sig not in text:
              raise SystemExit('WebsiteRuleSelectionScreen signature pattern not found')
          text = text.replace(old_site_sig, new_site_sig, 1)

          state_anchor = '''    var invalidInput by remember { mutableStateOf(false) }

              fun addRule(value: String) {'''.replace('              ', '')
          state_replacement = '''    var invalidInput by remember { mutableStateOf(false) }
              var pendingCompanionApp by remember {
                  mutableStateOf<Pair<String, PredefinedApps.AppInfo>?>(null)
              }

              fun maybeOfferCompanionApp(rule: String) {
                  val appInfo = AssociatedBlockTargets.appForWebsiteRule(rule) ?: return
                  if (appInfo.packageName in selectedAppPackages ||
                      appInfo.packageName in configuredBlockedPackages
                  ) return
                  pendingCompanionApp = WebsiteBlocker.normalizeRule(rule) to appInfo
              }

              fun addRule(value: String) {'''.replace('              ', '')
          if state_anchor not in text:
              raise SystemExit('WebsiteRuleSelectionScreen state anchor not found')
          text = text.replace(state_anchor, state_replacement, 1)

          add_anchor = '''        rules = (rules + normalized).distinct()
              input = ""
              invalidInput = false
          }'''.replace('              ', '')
          add_replacement = '''        rules = (rules + normalized).distinct()
              input = ""
              invalidInput = false
              maybeOfferCompanionApp(normalized)
          }'''.replace('              ', '')
          if add_anchor not in text:
              raise SystemExit('addRule success anchor not found')
          text = text.replace(add_anchor, add_replacement, 1)

          toggle_old = '''        } else {
                  rules = if (normalized in rules) {
                      rules.filterNot { it == normalized }
                  } else {
                      (rules + normalized).distinct()
                  }
              }
          }

              Scaffold('''.replace('              ', '')
          toggle_new = '''        } else {
                  val wasSelected = normalized in rules
                  rules = if (wasSelected) {
                      rules.filterNot { it == normalized }
                  } else {
                      (rules + normalized).distinct()
                  }
                  if (!wasSelected) maybeOfferCompanionApp(normalized)
              }
          }

              pendingCompanionApp?.let { (rule, appInfo) ->
                  AssociatedTargetOptionDialog(
                      title = stringResource(R.string.associated_target_block_app_title),
                      message = stringResource(
                          R.string.associated_target_block_app_message,
                          WebsiteBlocker.displayRule(rule),
                          appInfo.appName
                      ),
                      onDecision = { blockAlso ->
                          if (blockAlso) onCompanionAppSelected(appInfo)
                          pendingCompanionApp = null
                      }
                  )
              }

              Scaffold('''.replace('              ', '')
          if toggle_old not in text:
              raise SystemExit('togglePresetRule/Scaffold anchor not found')
          text = text.replace(toggle_old, toggle_new, 1)

          setup.write_text(text)

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/ui/CreateSessionActivity.kt \
                  app/src/main/java/com/focusguard/ui/compose/screens/ProtectionSetupScreen.kt
          git commit -m "Cover unified app-site companion blocking flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
