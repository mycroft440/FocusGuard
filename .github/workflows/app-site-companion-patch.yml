name: App-site companion patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source patch
        run: python .github/scripts/app_site_companion_patch.py

      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/ui/CreateSessionActivity.kt \
                  app/src/main/java/com/focusguard/ui/compose/screens/ProtectionSetupScreen.kt
          git commit -m "Cover unified app-site companion blocking flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
