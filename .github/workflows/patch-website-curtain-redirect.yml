name: Patch website curtain redirect

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-website-curtain-redirect.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply website curtain and redirect patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B fix/website-curtain-google-redirect origin/main
          python3 - <<'PY'
          import re
          from pathlib import Path

          service_path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = service_path.read_text()

          text = text.replace(
              'import android.view.Gravity\nimport android.view.KeyEvent\n',
              'import android.view.Choreographer\nimport android.view.Gravity\nimport android.view.KeyEvent\n',
              1,
          )
          text = text.replace(
              'import kotlinx.coroutines.launch\nimport kotlinx.coroutines.withContext\n',
              'import kotlinx.coroutines.launch\nimport kotlinx.coroutines.suspendCancellableCoroutine\nimport kotlinx.coroutines.withContext\n',
              1,
          )
          text = text.replace(
              'import kotlinx.coroutines.withTimeoutOrNull\n',
              'import kotlinx.coroutines.withTimeoutOrNull\nimport kotlin.coroutines.resume\n',
              1,
          )

          begin_pattern = re.compile(
              r'        fun begin\(\): List<WebsiteTransitionAction> \{\n'
              r'            check\(state == State\.NEW\)\n'
              r'            state = State\.SANITIZATION_PENDING\n'
              r'            return listOf\(WebsiteTransitionAction\.NEUTRALIZE_BLOCKED_TAB\)\n'
              r'        \}'
          )
          begin_replacement = (
              '        fun begin(): List<WebsiteTransitionAction> {\n'
              '            check(state == State.NEW)\n'
              '            state = State.SANITIZATION_PENDING\n'
              '            return listOf(\n'
              '                WebsiteTransitionAction.SHOW_CURTAIN,\n'
              '                WebsiteTransitionAction.NEUTRALIZE_BLOCKED_TAB\n'
              '            )\n'
              '        }'
          )
          text, count = begin_pattern.subn(begin_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'website state-machine begin replacement count={count}')

          start = text.index('    private fun startWebsiteBlockTransition(')
          end = text.index('\n    private suspend fun completeStrictWebsiteDestination(', start)
          replacement = r'''    private fun startWebsiteBlockTransition(
              browserPackageName: String,
              browserWindowId: Int = INVALID_BROWSER_WINDOW_ID,
              blockedCandidate: String? = null,
              detectionEventUptimeMillis: Long = 0L
          ) {
              val expectedWindowId = resolveBrowserWindowId(browserPackageName, browserWindowId)
              if (expectedWindowId == INVALID_BROWSER_WINDOW_ID) return
              val strict = isPomodoroStrictActive
              val transitionId = websiteBlockTransitionCounter.incrementAndGet()
              val transition = websiteBlockTransitionGuard.tryStart(
                  browserPackageName = browserPackageName,
                  transitionId = transitionId,
                  destination = if (strict) {
                      WebsiteTransitionDestination.POMODORO
                  } else {
                      WebsiteTransitionDestination.GOOGLE
                  },
                  expectedWindowId = expectedWindowId,
                  blockedCandidate = blockedCandidate,
                  blockedRules = blockedWebsitesDomainSet,
                  detectionEventUptimeMillis = detectionEventUptimeMillis
              ) ?: return
              val stateMachine = WebsiteBlockTransitionStateMachine(strict = strict)
              val initialActions = stateMachine.begin()
              val curtainGeneration = if (
                  WebsiteTransitionAction.SHOW_CURTAIN in initialActions
              ) {
                  showInstantBlockCurtain(mode = CurtainMode.BLOCK_NOTICE)
              } else {
                  0L
              }
              if (curtainGeneration <= 0L ||
                  !websiteBlockTransitionGuard.markCurtainGeneration(
                      browserPackageName = browserPackageName,
                      transitionId = transitionId,
                      curtainGeneration = curtainGeneration
                  )
              ) {
                  websiteBlockTransitionGuard.finish(browserPackageName, transitionId)
                  return
              }
              awaitingSafeSurfaceGeneration = curtainGeneration
              val curtainShownAtUptimeMillis = SystemClock.uptimeMillis()

              scope.launch(Dispatchers.Main.immediate) {
                  try {
                      // Let the already-warm overlay commit one display frame before
                      // touching the browser UI. This is normally only 8-17 ms and
                      // avoids exposing a flash of the blocked page during redirect.
                      awaitNextWebsiteRedirectFrame()

                      val rewritePolicy = WebsiteTabNeutralizationPolicy(
                          browserPackageName = browserPackageName,
                          expectedWindowId = expectedWindowId
                      )
                      var redirectRequested = requestSafeGoogleInCurrentTab(
                          browserPackageName = browserPackageName,
                          expectedWindowId = expectedWindowId,
                          policy = rewritePolicy,
                          transition = transition
                      )

                      // If the browser/API cannot expose a certifiable editable
                      // omnibox, close only the exact blocked tab and then open
                      // Google in that browser. Never block the browser as an app.
                      if (!redirectRequested) {
                          restoreBlockedSurfaceAfterAddressEdit(transition)
                          redirectRequested = closeBlockedTabAndRequestSafeGoogle(
                              browserPackageName = browserPackageName,
                              expectedWindowId = expectedWindowId,
                              transition = transition
                          )
                      }

                      if (!redirectRequested) {
                          stateMachine.onFailureOrTimeout()
                          evacuateWebsiteTransition(curtainGeneration)
                          return@launch
                      }

                      val googleConfirmed = withTimeoutOrNull(
                          WEBSITE_DESTINATION_CONFIRM_TIMEOUT_MILLIS
                      ) {
                          transition.safeGoogleConfirmed.await()
                          true
                      } == true
                      if (!googleConfirmed) {
                          stateMachine.onFailureOrTimeout()
                          evacuateWebsiteTransition(curtainGeneration)
                          return@launch
                      }

                      when (stateMachine.afterGoogleSanitized()) {
                          WebsiteTransitionAction.HIDE_CURTAIN -> {
                              val visibleFor = SystemClock.uptimeMillis() -
                                  curtainShownAtUptimeMillis
                              val remaining = WEBSITE_MIN_BLOCK_NOTICE_MILLIS - visibleFor
                              if (remaining > 0L) delay(remaining)
                              dismissInstantBlockCurtain(curtainGeneration)
                          }

                          WebsiteTransitionAction.OPEN_POMODORO -> {
                              if (completeStrictWebsiteDestination(
                                      transition = transition,
                                      curtainGeneration = curtainGeneration
                                  )
                              ) {
                                  stateMachine.onPomodoroConfirmed()
                                  dismissInstantBlockCurtain(curtainGeneration)
                              } else {
                                  stateMachine.onFailureOrTimeout()
                                  evacuateWebsiteTransition(curtainGeneration)
                              }
                          }

                          else -> {
                              stateMachine.onFailureOrTimeout()
                              evacuateWebsiteTransition(curtainGeneration)
                          }
                      }
                  } finally {
                      websiteBlockTransitionGuard.finish(browserPackageName, transitionId)
                  }
              }
          }

          private suspend fun awaitNextWebsiteRedirectFrame() {
              suspendCancellableCoroutine<Unit> { continuation ->
                  val choreographer = Choreographer.getInstance()
                  val callback = Choreographer.FrameCallback {
                      if (continuation.isActive) continuation.resume(Unit)
                  }
                  continuation.invokeOnCancellation {
                      choreographer.removeFrameCallback(callback)
                  }
                  choreographer.postFrameCallback(callback)
              }
          }

          private suspend fun requestSafeGoogleInCurrentTab(
              browserPackageName: String,
              expectedWindowId: Int,
              policy: WebsiteTabNeutralizationPolicy,
              transition: WebsiteBlockTransitionHandle
          ): Boolean {
              if (!canUseCertifiableImeSubmit(Build.VERSION.SDK_INT)) return false
              val setRequestedAt = prepareSafeAddressBar(
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  policy = policy,
                  transition = transition,
                  phaseStartedAtUptimeMillis = transition.detectionEventUptimeMillis
              )
              if (afterSafeAddressSet(setRequestedAt > 0L) !=
                  WebsiteSanitizationDecision.SUBMIT_ADDRESS_BAR
              ) return false

              policy.markSafeAddressSet(setRequestedAt)
              val submitRequestedAt = submitSafeAddressBar(
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  policy = policy,
                  transition = transition
              )
              if (afterSafeAddressSubmit(submitRequestedAt > 0L) !=
                  WebsiteSanitizationDecision.AWAIT_GOOGLE_CONFIRMATION
              ) return false

              policy.markRedirectRequested()
              return websiteBlockTransitionGuard.markSanitizationRequested(
                  browserPackageName = browserPackageName,
                  transitionId = transition.id,
                  requestedAtUptimeMillis = submitRequestedAt
              )
          }

          private suspend fun restoreBlockedSurfaceAfterAddressEdit(
              transition: WebsiteBlockTransitionHandle
          ): Boolean {
              if (transition.activatedAddressViewId == null &&
                  transition.editorAddressViewId == null
              ) return true
              if (!performGlobalAction(GLOBAL_ACTION_BACK)) return false
              delay(WEBSITE_ADDRESS_BAR_FOCUS_SETTLE_MILLIS)
              val root = activeBrowserRoot(
                  transition.browserPackageName,
                  transition.expectedWindowId
              ) ?: return false
              val restored = rootStillShowsDetectedBlockedTarget(root, transition)
              recycleSafely(root)
              transition.activatedAddressViewId = null
              transition.editorAddressViewId = null
              return restored
          }

          private suspend fun closeBlockedTabAndRequestSafeGoogle(
              browserPackageName: String,
              expectedWindowId: Int,
              transition: WebsiteBlockTransitionHandle
          ): Boolean {
              val fallbackPolicy = WebsiteTabNeutralizationPolicy(
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId
              )
              val closeResult = closeCurrentChromiumTab(
                  browserPackageName = browserPackageName,
                  expectedWindowId = expectedWindowId,
                  policy = fallbackPolicy,
                  transition = transition
              )
              if (closeResult.menuPossiblyOpened && !closeResult.closeActionAccepted) {
                  dismissChromiumTabMenu(
                      browserPackageName = browserPackageName,
                      targetWindowId = expectedWindowId,
                      menuWindowId = closeResult.menuWindowId,
                      transition = transition
                  )
              }
              if (!closeResult.closeConfirmed) return false
              return requestSafeGoogleAfterConfirmedClose(transition)
          }
          '''
          text = text[:start] + replacement + text[end:]

          marker = '        private const val WEBSITE_GOOGLE_SURFACE_SETTLE_MILLIS = 120L\n'
          if marker not in text:
              raise SystemExit('google settle constant marker missing')
          text = text.replace(
              marker,
              marker + '        internal const val WEBSITE_MIN_BLOCK_NOTICE_MILLIS = 120L\n',
              1,
          )

          text = text.replace(
              '// Tab neutralization and the safe redirect are asynchronous. Ignore the\n'
              '// browser\'s follow-up events until that handoff finishes so a stale\n'
              '// blocked address cannot start an overlapping redirect loop.\n',
              '// The curtain + same-tab Google redirect are asynchronous. Ignore the\n'
              '// browser\'s follow-up events until that handoff finishes so a stale\n'
              '// blocked address cannot start an overlapping redirect loop.\n',
              1,
          )
          service_path.write_text(text)

          test_path = Path('app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt')
          tests = test_path.read_text()
          non_strict_pattern = re.compile(
              r'        assertThat\(machine\.begin\(\)\)\.containsExactly\(\n'
              r'            BlockingAccessibilityService\.WebsiteTransitionAction\.NEUTRALIZE_BLOCKED_TAB\n'
              r'        \)'
          )
          non_strict_replacement = (
              '        assertThat(machine.begin()).containsExactly(\n'
              '            BlockingAccessibilityService.WebsiteTransitionAction.SHOW_CURTAIN,\n'
              '            BlockingAccessibilityService.WebsiteTransitionAction.NEUTRALIZE_BLOCKED_TAB\n'
              '        ).inOrder()'
          )
          tests, count = non_strict_pattern.subn(non_strict_replacement, tests, count=1)
          if count != 1:
              raise SystemExit(f'non-strict transition replacement count={count}')

          strict_pattern = re.compile(
              r'        assertThat\(machine\.begin\(\)\.last\(\)\)\.isEqualTo\(\n'
              r'            BlockingAccessibilityService\.WebsiteTransitionAction\.NEUTRALIZE_BLOCKED_TAB\n'
              r'        \)'
          )
          strict_replacement = (
              '        val initialActions = machine.begin()\n'
              '        assertThat(initialActions.first()).isEqualTo(\n'
              '            BlockingAccessibilityService.WebsiteTransitionAction.SHOW_CURTAIN\n'
              '        )\n'
              '        assertThat(initialActions.last()).isEqualTo(\n'
              '            BlockingAccessibilityService.WebsiteTransitionAction.NEUTRALIZE_BLOCKED_TAB\n'
              '        )'
          )
          tests, count = strict_pattern.subn(strict_replacement, tests, count=1)
          if count != 1:
              raise SystemExit(f'strict transition replacement count={count}')

          handoff_marker = (
              '    @Test\n'
              '    fun `website handoff waits for a positively confirmed destination`() {\n'
              '        assertThat(BlockingAccessibilityService.WEBSITE_DESTINATION_CONFIRM_TIMEOUT_MILLIS)\n'
              '            .isGreaterThan(BlockingAccessibilityService.EVENT_NOTIFICATION_TIMEOUT_MILLIS)\n'
              '    }\n'
          )
          if handoff_marker not in tests:
              raise SystemExit('website handoff test marker missing')
          tests = tests.replace(
              handoff_marker,
              handoff_marker +
              '\n    @Test\n'
              '    fun `website curtain perceptual minimum stays low latency`() {\n'
              '        assertThat(BlockingAccessibilityService.WEBSITE_MIN_BLOCK_NOTICE_MILLIS)\n'
              '            .isAtMost(150L)\n'
              '    }\n',
              1,
          )
          test_path.write_text(tests)
          PY

      - name: Run website blocking unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.focusguard.service.WebsiteBlockNavigationTest --no-daemon --stacktrace

      - name: Push implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
                  app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git commit -m "Restore instant website curtain and Google redirect"
          git push --force-with-lease origin HEAD:refs/heads/fix/website-curtain-google-redirect
