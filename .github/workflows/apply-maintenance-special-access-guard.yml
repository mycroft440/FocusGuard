name: Apply maintenance special-access guard

on:
  push:
    branches:
      - fix-device-owner-maintenance-expiry
    paths:
      - .maintenance-special-access-trigger

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-device-owner-maintenance-expiry
          fetch-depth: 0
      - name: Apply guarded source changes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              "app/src/main/java/com/focusguard/security/ManagedSelfProtectionPolicy.kt",
              '        "BatteryOptimizationSettings"\n    )',
              '        "BatteryOptimizationSettings",\n        "AlarmsAndReminders"\n    )'
          )
          replace_exact(
              "app/src/main/java/com/focusguard/security/ManagedSelfProtectionPolicy.kt",
              '        "Battery optimization",\n        "Unrestricted battery"\n    )',
              '        "Battery optimization",\n        "Unrestricted battery",\n        "Alarmes e lembretes",\n        "Alarms & reminders",\n        "Alarms and reminders",\n        "Alarmas y recordatorios"\n    )'
          )

          replace_exact(
              "app/src/main/java/com/focusguard/security/SettingsInterceptionPolicy.kt",
              '        deviceAdminActivationAuthorized: Boolean,\n        rootSignals: RootSignals',
              '        deviceAdminActivationAuthorized: Boolean,\n        maintenanceActive: Boolean = false,\n        rootSignals: RootSignals'
          )
          replace_exact(
              "app/src/main/java/com/focusguard/security/SettingsInterceptionPolicy.kt",
              '        if (signals.packageName !in interceptionPackages) return Decision.IGNORE\n        if (!selfProtectionEngaged) return Decision.IGNORE',
              '''        if (signals.packageName !in interceptionPackages) return Decision.IGNORE

                  // Maintenance relaxes selected Device Owner policy, but the special
                  // accesses that guarantee expiry/enforcement must remain protected.
                  // Keep ordinary Settings available by requiring both HardBlock identity
                  // and an essential-special-access context.
                  if (maintenanceActive) {
                      val focusGuardTarget = signals.textMentionsFocusGuard ||
                          rootSignals.mentionsFocusGuard()
                      if (!focusGuardTarget) return Decision.IGNORE
                      val essentialAccess = signals.classTargetsEssentialSpecialAccess ||
                          signals.textMentionsEssentialSpecialAccess ||
                          rootSignals.mentionsEssentialSpecialAccess()
                      return if (essentialAccess) {
                          Decision.PROTECT_AND_ARM_GUARD
                      } else {
                          Decision.IGNORE
                      }
                  }

                  if (!selfProtectionEngaged) return Decision.IGNORE'''
          )

          replace_exact(
              "app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt",
              '''        // Only actual Device Owner devices can have this maintenance gate. Avoid a
                  // DevicePolicyManager round-trip on the consumer path.
                  if (deviceOwnerActiveCached &&
                      com.focusguard.security.DeviceOwnerMaintenanceGate.isTemporarilyUnlocked(this)) return false''',
              '''        // During maintenance ordinary Settings stay available, but expiry-critical
                  // special accesses are still evaluated by SettingsInterceptionPolicy.
                  val deviceOwnerMaintenanceActive = deviceOwnerActiveCached &&
                      com.focusguard.security.DeviceOwnerMaintenanceGate.isTemporarilyUnlocked(this)'''
          )
          replace_exact(
              "app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt",
              '            deviceAdminActivationAuthorized = deviceAdminActivationAuthorized,\n            rootSignals = SettingsInterceptionPolicy.RootSignals(',
              '            deviceAdminActivationAuthorized = deviceAdminActivationAuthorized,\n            maintenanceActive = deviceOwnerMaintenanceActive,\n            rootSignals = SettingsInterceptionPolicy.RootSignals('
          )
      - name: Commit source patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-maintenance-special-access-guard.yml .maintenance-special-access-trigger
          git add app/src/main/java/com/focusguard/security/ManagedSelfProtectionPolicy.kt \
                  app/src/main/java/com/focusguard/security/SettingsInterceptionPolicy.kt \
                  app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git commit -m "Protect expiry-critical access during maintenance"
          git push origin HEAD:fix-device-owner-maintenance-expiry
