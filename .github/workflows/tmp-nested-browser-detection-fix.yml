name: Temporary nested browser detection fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tmp-nested-browser-detection-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply, verify and publish browser fix
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup_failure() {
            git reset --hard HEAD
            rm -f .github/workflows/tmp-nested-browser-detection-fix.yml
            rm -f scripts/tmp_fix_nested_browser_detection.py
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove temporary browser fix files"
              git push origin HEAD:main
            fi
          }

          if ! python3 scripts/tmp_fix_nested_browser_detection.py; then
            cleanup_failure
            exit 1
          fi

          chmod +x gradlew

          if ! ./gradlew testDebugUnitTest \
            --tests com.focusguard.utils.BrowserNestedAddressBarPolicyTest \
            --tests com.focusguard.utils.BrowserSurfaceStrongAddressBarPolicyTest \
            --no-daemon --stacktrace; then
            cleanup_failure
            exit 1
          fi

          if ! ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace; then
            cleanup_failure
            exit 1
          fi

          if ! ./gradlew :app:lintDebug --no-daemon --stacktrace; then
            cleanup_failure
            exit 1
          fi

          rm -f .github/workflows/tmp-nested-browser-detection-fix.yml
          rm -f scripts/tmp_fix_nested_browser_detection.py

          git add -A
          if ! git diff --cached --check; then
            cleanup_failure
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes produced"
            cleanup_failure
            exit 1
          fi

          git commit -m "fix(web): detect nested browser address bars"
          git push origin HEAD:main
