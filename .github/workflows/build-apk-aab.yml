name: Build HardBlock APK + AAB

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: hardblock-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build signed Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic Android version code
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          echo "CI_VERSION_CODE=$((1000 + COMMIT_COUNT))" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require permanent production signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required to build the canonical HardBlock update."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/hardblock-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate and build Release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            lintRelease \
            testReleaseUnitTest \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p ci-artifacts
          cp "$APK" ci-artifacts/HardBlock-update.apk
          cp "$AAB" ci-artifacts/HardBlock-play.aab
          sha256sum \
            ci-artifacts/HardBlock-update.apk \
            ci-artifacts/HardBlock-play.aab \
            > ci-artifacts/SHA256SUMS.txt

      - name: Verify package and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs ci-artifacts/HardBlock-update.apk \
            | tee ci-artifacts/apksigner.txt
          "$AAPT" dump badging ci-artifacts/HardBlock-update.apk \
            | head -n 1 \
            | tee ci-artifacts/package.txt

          grep -q "package: name='com.focusguard.v2'" ci-artifacts/package.txt
          grep -qi "e8da4209d0012052b052b280fa64becb788bf6929563ce54a0707cb8c3385157" \
            ci-artifacts/apksigner.txt
          jarsigner -verify ci-artifacts/HardBlock-play.aab \
            | tee ci-artifacts/aab-signing.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HardBlock-APK-${{ github.run_number }}
          path: ci-artifacts/HardBlock-update.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: HardBlock-AAB-${{ github.run_number }}
          path: ci-artifacts/HardBlock-play.aab
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload checksums and identity verification
        uses: actions/upload-artifact@v4
        with:
          name: HardBlock-build-verification-${{ github.run_number }}
          path: |
            ci-artifacts/SHA256SUMS.txt
            ci-artifacts/apksigner.txt
            ci-artifacts/package.txt
            ci-artifacts/aab-signing.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hardblock-release.jks"
