name: Apply fast path cache patch

on:
  push:
    branches: ["perf/cache-fast-path"]
    paths:
      - ".github/workflows/apply-fastpath-cache-patch.yml"
      - "tools/fastpath-cache.patch"

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-fast-path
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/fastpath-cache.patch
          git apply tools/fastpath-cache.patch
          rm tools/fastpath-cache.patch
          rm .github/workflows/apply-fastpath-cache-patch.yml

      - name: Validate unit tests, lint and debug compilation
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/focusguard/security/DeviceOwnerMaintenanceGate.kt \
            app/src/main/java/com/focusguard/admin/DeviceOwnerManager.kt \
            app/src/main/java/com/focusguard/admin/FocusGuardDeviceAdminReceiver.kt \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            .agents/implementation_plan.md
          git add -u -- tools/fastpath-cache.patch .github/workflows/apply-fastpath-cache-patch.yml
          git commit -m "perf: remove external reads from self-protection fast path"
          git push origin HEAD:perf/cache-fast-path
