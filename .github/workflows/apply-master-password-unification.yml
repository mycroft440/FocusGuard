name: Apply master password unification

on:
  push:
    branches:
      - fix/master-removal-gate-and-antiporn-restore

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/master-removal-gate-and-antiporn-restore
          fetch-depth: 0
      - name: Unify master password removal flow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # One master credential, minimum four characters.
          replace_once(
              'app/src/main/java/com/focusguard/security/DeactivationCredentialManager.kt',
              '        const val MIN_PASSWORD_LENGTH = 8',
              '        const val MIN_PASSWORD_LENGTH = 4'
          )
          replace_once(
              'app/src/test/java/com/focusguard/security/DeactivationCredentialManagerTest.kt',
              '''    fun `deactivation password requires eight characters`() {
                  assertThat(DeactivationCredentialManager.isPasswordValid("1234567")).isFalse()
                  assertThat(DeactivationCredentialManager.isPasswordValid("12345678")).isTrue()
              }''',
              '''    fun `master password requires four characters`() {
                  assertThat(DeactivationCredentialManager.isPasswordValid("123")).isFalse()
                  assertThat(DeactivationCredentialManager.isPasswordValid("1234")).isTrue()
              }'''
          )

          # The Settings danger action now uses the same master-password gate as
          # protected Android permission/uninstall surfaces. Remove the legacy
          # block-specific password/pattern/biometric uninstall dialog from this route.
          path = 'app/src/main/java/com/focusguard/ui/compose/screens/SettingsScreen.kt'
          replace_once(
              path,
              'import com.focusguard.ui.MasterPasswordActivity',
              'import com.focusguard.ui.MasterPasswordActivity\nimport com.focusguard.ui.MasterRemovalActivity'
          )
          replace_once(
              path,
              '    var showUninstallDialog by remember { mutableStateOf(false) }\n',
              ''
          )
          replace_once(
              path,
              '''    val isUninstallBlockedByTime by blockingSessionManager
                  .isUninstallBlockedByTimeFlow
                  .collectAsState(initial = true)
''',
              ''
          )
          replace_once(
              path,
              '''    val uninstallSubtitle = stringResource(
                  if (isBlockingActive || isUninstallBlockedByTime) {
                      R.string.uninstall_app_subtitle_auth
                  } else {
                      R.string.uninstall_app_subtitle_free
                  }
              )

              if (showUninstallDialog) {
                  AuthenticatedUninstallDialog(
                      hasActiveBlock = isBlockingActive,
                      hasActiveIrreversibleBlock = isUninstallBlockedByTime,
                      onDismiss = { showUninstallDialog = false }
                  )
              }
''',
              '''    val uninstallSubtitle = stringResource(R.string.uninstall_app_subtitle_auth)
'''
          )
          replace_once(
              path,
              '                onClick = { showUninstallDialog = true }',
              '''                onClick = {
                      context.startActivity(
                          MasterRemovalActivity.createIntent(
                              context,
                              MasterRemovalActivity.Target.UNINSTALL
                          )
                      )
                  }'''
          )

          # Distinguish an absent master password from an incorrect one. The actual
          # release path remains: remove all block sources -> open authenticated
          # removal window -> release Device Owner/Admin -> disable Accessibility ->
          # open Android uninstall UI.
          path = 'app/src/main/java/com/focusguard/ui/MasterRemovalActivity.kt'
          replace_once(
              path,
              '''                    DeactivationCredentialManager.VerificationResult.REJECTED,
                      DeactivationCredentialManager.VerificationResult.NOT_CONFIGURED -> false
                  }
              }
              if (!verified) {
                  showError(getString(R.string.master_removal_wrong_password), dialog)
                  return@launch
              }''',
              '''                    DeactivationCredentialManager.VerificationResult.REJECTED -> false
                      DeactivationCredentialManager.VerificationResult.NOT_CONFIGURED -> null
                  }
              }
              if (verified == null) {
                  showError(getString(R.string.master_credential_not_configured), dialog)
                  return@launch
              }
              if (!verified) {
                  showError(getString(R.string.master_removal_wrong_password), dialog)
                  return@launch
              }'''
          )

          # Product copy must match the new explicit master-removal behavior.
          replace_once(
              'app/src/main/res/values-pt/strings_deactivation_password.xml',
              '    <string name="deactivation_password_description">Esta é a única senha usada para abrir apps protegidos, liberar limites configurados com senha, entrar no FocusGuard e autorizar a desinstalação. Ela nunca encerra um bloqueio por tempo. Guarde o código de recuperação.</string>',
              '    <string name="deactivation_password_description">Esta é a senha mestre do HardBlock. Ela autoriza ações protegidas e, na opção explícita de revogar permissões e desinstalar o FocusGuard, remove todos os bloqueios e libera as proteções antes da desinstalação. Use pelo menos 4 caracteres e guarde o código de recuperação.</string>'
          )
          for path in [
              'app/src/main/res/values/strings_deactivation_password.xml',
              'app/src/main/res/values-en/strings_deactivation_password.xml',
          ]:
              replace_once(
                  path,
                  '    <string name="deactivation_password_description">This is the only password used to open protected apps, release password-enabled limits, enter FocusGuard, and authorize uninstall. It never ends a time block. Keep the recovery code.</string>',
                  '    <string name="deactivation_password_description">This is the HardBlock master password. It authorizes protected actions and, when you explicitly revoke permissions and uninstall FocusGuard, removes all blocks and releases protection before uninstall. Use at least 4 characters and keep the recovery code.</string>'
              )

          # Record the product rule in the implementation plan.
          path = '.agents/implementation_plan.md'
          p = Path(path)
          text = p.read_text()
          addition = '- CUMPRIDO: unificar a saída do HardBlock na senha mestre: mínimo de 4 caracteres; a ação “revogar permissões/desinstalar” exige essa credencial, remove todas as fontes de bloqueio e libera Admin/Device Owner/Acessibilidade antes da desinstalação.\n'
          if addition not in text:
              p.write_text(text.rstrip() + '\n' + addition)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .agents/implementation_plan.md \
            app/src/main/java/com/focusguard/security/DeactivationCredentialManager.kt \
            app/src/main/java/com/focusguard/ui/MasterRemovalActivity.kt \
            app/src/main/java/com/focusguard/ui/compose/screens/SettingsScreen.kt \
            app/src/main/res/values/strings_deactivation_password.xml \
            app/src/main/res/values-en/strings_deactivation_password.xml \
            app/src/main/res/values-pt/strings_deactivation_password.xml \
            app/src/test/java/com/focusguard/security/DeactivationCredentialManagerTest.kt
          git commit -m 'Unify master password hard-block removal'
          git push origin HEAD:fix/master-removal-gate-and-antiporn-restore
