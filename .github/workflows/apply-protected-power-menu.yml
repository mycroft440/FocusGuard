name: Apply protected power menu

on:
  push:
    branches:
      - feat/protected-power-menu

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/protected-power-menu
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
