name: Apply same-tab redirect patch

on:
  push:
    branches: [fix/same-tab-google-redirect]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/same-tab-google-redirect
      - name: Apply patch
        run: python scripts/apply_same_tab_redirect_patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix same-tab website redirect without closing browser"
          git push origin HEAD:fix/same-tab-google-redirect
