name: One-time password gate order fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-password-gate-order-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact guarded patch
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          test_path = Path('app/src/test/java/com/focusguard/service/BlockingAccessibilityServiceIntentTest.kt')

          service = service_path.read_text()
          test = test_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          service = replace_once(
              service,
              'import com.focusguard.security.ManagedSelfProtectionPolicy\n',
              'import com.focusguard.security.ManagedSelfProtectionPolicy\n'
              'import com.focusguard.security.PasswordTargetAccessGrant\n',
              'PasswordTargetAccessGrant import'
          )

          service = replace_once(
              service,
              '''        val blockedWebsiteDomain = blockedWebsiteAppDomains[packageName]\n'''
              '''        val limitedWebsiteDomain = limitedWebsiteAppDomains[packageName]\n'''
              '''        when {\n'''
              '''            blockedWebsiteDomain != null -> blockWebsiteApp(blockedWebsiteDomain)\n'''
              '''            ImmediateInterceptionPolicy.isBlockedTargetWindow(\n'''
              '''                packageName,\n'''
              '''                blockedAppsSet\n'''
              '''            ) -> blockApp(packageName, event.eventTime)\n''',
              '''        val blockedWebsiteDomain = blockedWebsiteAppDomains[packageName]\n'''
              '''        val limitedWebsiteDomain = limitedWebsiteAppDomains[packageName]\n'''
              '''        when {\n'''
              '''            // Website/focus/strict protections keep precedence over a PASSWORD\n'''
              '''            // visit. The grant only bypasses this app's PASSWORD-session edge.\n'''
              '''            blockedWebsiteDomain != null -> blockWebsiteApp(blockedWebsiteDomain)\n'''
              '''            PasswordTargetAccessGrant.isPackageGranted(packageName) -> Unit\n'''
              '''            ImmediateInterceptionPolicy.isBlockedTargetWindow(\n'''
              '''                packageName,\n'''
              '''                blockedAppsSet\n'''
              '''            ) -> blockApp(packageName, event.eventTime)\n''',
              'authenticated visit bypass'
          )

          service = replace_once(
              service,
              '''        windows.forEach { window ->\n'''
              '''            val root = runCatching { window.root }.getOrNull() ?: return@forEach\n''',
              '''        windows.forEach { window ->\n'''
              '''            // A blocked task may remain underneath the full-screen FocusGuard\n'''
              '''            // credential Activity. Only a currently active/focused window can\n'''
              '''            // make the safe-surface handshake unsafe.\n'''
              '''            if (!window.isActive && !window.isFocused) return@forEach\n'''
              '''            val root = runCatching { window.root }.getOrNull() ?: return@forEach\n''',
              'safe window filtering'
          )

          service = replace_once(
              service,
              '''        internal fun shouldEvictBlockedAppBeforeNotice(blockedPackage: String?): Boolean =\n'''
              '''            !blockedPackage.isNullOrBlank()\n''',
              '''        /**\n'''
              '''         * The opaque accessibility curtain already prevents interaction with the\n'''
              '''         * blocked app while BlockNoticeActivity is coming forward. Evicting to\n'''
              '''         * HOME first destroys the task context and makes PASSWORD authentication\n'''
              '''         * arrive too late. HOME remains the fail-safe only when the safe Activity\n'''
              '''         * cannot be presented/acknowledged.\n'''
              '''         */\n'''
              '''        internal fun shouldEvictBlockedAppBeforeNotice(\n'''
              '''            @Suppress("UNUSED_PARAMETER") blockedPackage: String?\n'''
              '''        ): Boolean = false\n''',
              'pre-notice eviction policy'
          )

          test = replace_once(
              test,
              '''    @Test\n'''
              '''    fun `blocked app notice evicts app while website notice does not`() {\n'''
              '''        assertThat(\n'''
              '''            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice(\n'''
              '''                "com.example.blocked"\n'''
              '''            )\n'''
              '''        ).isTrue()\n'''
              '''        assertThat(\n'''
              '''            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice(null)\n'''
              '''        ).isFalse()\n'''
              '''        assertThat(\n'''
              '''            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice("")\n'''
              '''        ).isFalse()\n'''
              '''    }\n''',
              '''    @Test\n'''
              '''    fun `block notice keeps target task until safe credential surface is ready`() {\n'''
              '''        assertThat(\n'''
              '''            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice(\n'''
              '''                "com.example.blocked"\n'''
              '''            )\n'''
              '''        ).isFalse()\n'''
              '''        assertThat(\n'''
              '''            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice(null)\n'''
              '''        ).isFalse()\n'''
              '''        assertThat(\n'''
              '''            BlockingAccessibilityService.shouldEvictBlockedAppBeforeNotice("")\n'''
              '''        ).isFalse()\n'''
              '''    }\n''',
              'pre-notice eviction regression test'
          )

          service_path.write_text(service)
          test_path.write_text(test)

      - name: Commit patch
        run: |
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
                  app/src/test/java/com/focusguard/service/BlockingAccessibilityServiceIntentTest.kt
          git diff --cached --check
          git commit -m "fix: show password gate before evicting blocked app"
          git push origin HEAD:main
