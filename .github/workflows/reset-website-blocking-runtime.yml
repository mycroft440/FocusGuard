name: Reset website blocking runtime

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reset-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply guarded runtime reset
        run: python3 .github/scripts/reset_website_blocking_runtime.py

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
          git diff --check

      - name: Commit reset and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reset-website-blocking-runtime.yml
          rm -f .github/scripts/reset_website_blocking_runtime.py
          git config user.name 'FocusGuard maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: reset website blocking runtime'
          git push origin HEAD:main

      - name: Delete every non-main branch
        shell: bash
        run: |
          set -u
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          deleted=0
          failed=0
          failures=''
          while IFS= read -r ref; do
            branch="${ref#origin/}"
            [ "$branch" = 'main' ] && continue
            [ "$branch" = 'HEAD' ] && continue
            if git push origin --delete "$branch"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              failures="${failures}${branch}\n"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)
          echo "Deleted branches: $deleted"
          echo "Failed branch deletions: $failed"
          if [ "$failed" -ne 0 ]; then
            printf 'Failed branches:\n%b' "$failures"
            exit 1
          fi
