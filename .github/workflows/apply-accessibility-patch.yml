name: Remove Temporary Accessibility Workflow

on:
  push:
    branches: ["agent/accessibility-protection-window"]
    paths:
      - ".github/workflows/apply-accessibility-patch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accessibility-protection-window
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/apply-accessibility-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-accessibility-patch.yml
          git commit -m "Remove temporary accessibility workflow"
          git push origin HEAD:agent/accessibility-protection-window
