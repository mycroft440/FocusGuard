name: Temporary ANR Patch Helper

on:
  push:
    branches:
      - fix/anr-runtime-release-hardening-20260916

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply reviewed replacements
        run: python3 -m trace --trace scripts/apply_anr_hardening_patch.py

      - name: Validate and commit final patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm scripts/apply_anr_hardening_patch.py
          rm .github/workflows/anr-patch-helper.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(a11y): harden ANR-prone browser inspection"
          git push origin HEAD:fix/anr-runtime-release-hardening-20260916
