name: Temporary ANR Finalize Helper

on:
  push:
    branches:
      - fix/anr-runtime-release-hardening-20260916

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply final consistency fix
        run: python3 scripts/finalize_anr_hardening.py

      - name: Verify final patch shape and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SLOW_ACCESSIBILITY_CALLBACK_MILLIS = 250L" app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          grep -q "UNKNOWN_BROWSER_DISCOVERY_RETRY_MILLIS = 750L" app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          grep -q "app only blocking storm never probes an unrelated app as a browser" app/src/test/java/com/focusguard/service/BlockingAccessibilityInputTest.kt
          grep -q "release-diagnostics-" .github/workflows/release.yml
          git diff --check
          rm scripts/finalize_anr_hardening.py
          rm .github/workflows/anr-finalize-helper.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(a11y): finalize ANR hardening consistency"
          git push origin HEAD:fix/anr-runtime-release-hardening-20260916
