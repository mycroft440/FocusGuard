name: Finalize website blocking v4

on:
  push:
    branches:
      - hardblock-website-blocking-v4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare redirect locale resource containers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          script = Path('.github/scripts/finalize_website_blocking_v4.py').read_text()
          start = script.index('translations = {')
          end = script.index('\n}\n\nkeys = (', start)
          translation_section = script[start:end]
          folders = sorted(set(re.findall(r'^\s+"(values[^"]*)": \($', translation_section, re.MULTILINE)))
          if not folders:
              raise SystemExit('no redirect translation locales found')

          for folder in folders:
              directory = Path('app/src/main/res') / folder
              directory.mkdir(parents=True, exist_ok=True)
              path = directory / 'strings.xml'
              if not path.exists():
                  path.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n')
          PY

      - name: Apply guarded final website v4 integration
        run: python3 .github/scripts/finalize_website_blocking_v4.py

      - name: Run blocking ownership tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.focusguard.accessibility.website.blocking.*' \
            --tests 'com.focusguard.service.WebsiteProtectionHierarchyPolicyTest' \
            --no-daemon

      - name: Run browser compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.focusguard.accessibility.website.compatibility.*' \
            --no-daemon

      - name: Run website identification tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.focusguard.accessibility.website.identification.*' \
            --no-daemon

      - name: Run website redirection tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.focusguard.accessibility.website.redirection.*' \
            --no-daemon

      - name: Run accessibility service website tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.focusguard.service.BlockingAccessibilityInputTest' \
            --tests 'com.focusguard.service.WebsiteCurtainInputPolicyTest' \
            --tests 'com.focusguard.service.WebsiteBlockNavigationTest' \
            --no-daemon

      - name: Run website utility tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.focusguard.utils.BrowserInspectionSessionTest' \
            --tests 'com.focusguard.utils.WebsiteBlockerTest' \
            --no-daemon
          git diff --check

      - name: Build and lint website blocking changes
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:assembleDebug \
            :app:lintDebug \
            --no-daemon

      - name: Commit final integration and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/finalize_website_blocking_v4.py
          rm -f .github/workflows/finalize-website-blocking-v4.yml
          git config user.name 'FocusGuard website implementation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize website blocking v4 runtime'
          git push origin HEAD:hardblock-website-blocking-v4
