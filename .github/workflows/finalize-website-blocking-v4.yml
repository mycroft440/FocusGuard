name: Finalize website blocking v4

on:
  push:
    branches:
      - hardblock-website-blocking-v4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep redirect translations in dedicated resource files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/finalize_website_blocking_v4.py')
          text = path.read_text()

          old_path = 'path = Path("app/src/main/res") / folder / "strings.xml"'
          new_path = 'path = Path("app/src/main/res") / folder / "website_redirect_strings.xml"'
          if text.count(old_path) != 1:
              raise SystemExit('redirect resource path seam changed unexpectedly')
          text = text.replace(old_path, new_path)

          old_open = '''    if not path.is_file():
              raise SystemExit(f"supported locale file missing: {path}")
          text = path.read_text()
          '''
          new_open = '''    path.parent.mkdir(parents=True, exist_ok=True)
          if not path.exists():
              path.write_text('<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n</resources>\\n')
          text = path.read_text()
          '''
          if text.count(old_open) != 1:
              raise SystemExit('redirect locale creation seam changed unexpectedly')
          path.write_text(text.replace(old_open, new_open))
          PY

      - name: Apply guarded final website v4 integration
        run: python3 .github/scripts/finalize_website_blocking_v4.py

      - name: Build and lint website blocking changes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:assembleDebug \
            :app:lintDebug \
            --no-daemon

      - name: Run focused website blocking tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:testDebugUnitTest \
            --tests 'com.focusguard.accessibility.website.blocking.*' \
            --tests 'com.focusguard.accessibility.website.compatibility.*' \
            --tests 'com.focusguard.accessibility.website.identification.*' \
            --tests 'com.focusguard.accessibility.website.redirection.*' \
            --tests 'com.focusguard.service.WebsiteProtectionHierarchyPolicyTest' \
            --tests 'com.focusguard.service.BlockingAccessibilityInputTest' \
            --tests 'com.focusguard.service.WebsiteCurtainInputPolicyTest' \
            --tests 'com.focusguard.service.WebsiteBlockNavigationTest' \
            --tests 'com.focusguard.utils.BrowserInspectionSessionTest' \
            --tests 'com.focusguard.utils.WebsiteBlockerTest' \
            --no-daemon
          git diff --check

      - name: Commit final integration and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/finalize_website_blocking_v4.py
          rm -f .github/workflows/finalize-website-blocking-v4.yml
          git config user.name 'FocusGuard website implementation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize website blocking v4 runtime'
          git push origin HEAD:hardblock-website-blocking-v4
