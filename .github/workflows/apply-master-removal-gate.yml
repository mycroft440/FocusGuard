name: Apply master removal gate fix

on:
  push:
    branches:
      - fix/master-removal-gate-and-antiporn-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved AntiPorn and apply removal gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/time-block-master-revoke:refs/remotes/origin/feat/time-block-master-revoke
          git checkout origin/feat/time-block-master-revoke -- \
            app/src/main/java/com/focusguard/ui/compose/screens/RecoveryCourseGatewayScreen.kt \
            app/src/main/res/values/strings_recovery_course.xml \
            app/src/main/res/values-en/strings_recovery_course.xml \
            app/src/main/res/values-pt/strings_recovery_course.xml

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Recognize Samsung's exact system-admin wording and the App Info gateway.
          path = 'app/src/main/java/com/focusguard/security/ManagedSelfProtectionPolicy.kt'
          replace_once(path,
          '''    data class TextSignals(
                  val deviceAdmin: Boolean,
                  val focusGuard: Boolean,
                  val destructiveControl: Boolean,
                  val essentialSpecialAccess: Boolean
              )''',
          '''    data class TextSignals(
                  val deviceAdmin: Boolean,
                  val appInfoGateway: Boolean,
                  val focusGuard: Boolean,
                  val destructiveControl: Boolean,
                  val essentialSpecialAccess: Boolean
              )''')
          replace_once(path,
          '''        "Apps do administrador do aparelho",
                  "Administrador do dispositivo",''',
          '''        "Apps do administrador do aparelho",
                  "Apps administradores do sistema",
                  "Aplicativos administradores do sistema",
                  "System admin apps",
                  "Administrador do dispositivo",''')
          replace_once(path,
          '''    internal val focusGuardSearchTerms = listOf(''',
          '''    internal val appInfoGatewaySearchTerms = listOf(
                  "Informações do aplicativo",
                  "Informações do app",
                  "App info",
                  "Application info",
                  "Información de la aplicación",
                  "Información de app"
              )

              internal val focusGuardSearchTerms = listOf(''')
          replace_once(path,
          '''    private val normalizedFocusGuardSearchTerms = focusGuardSearchTerms.map(::normalize)''',
          '''    private val normalizedAppInfoGatewaySearchTerms =
                  appInfoGatewaySearchTerms.map(::normalize)
              private val normalizedFocusGuardSearchTerms = focusGuardSearchTerms.map(::normalize)''')
          replace_once(path,
          '''            deviceAdmin = matchesDeviceAdmin(normalizedValues),
                      focusGuard = valuesContainAnyNormalized(''',
          '''            deviceAdmin = matchesDeviceAdmin(normalizedValues),
                      appInfoGateway = valuesContainAnyNormalized(
                          normalizedValues,
                          normalizedAppInfoGatewaySearchTerms
                      ),
                      focusGuard = valuesContainAnyNormalized(''')
          replace_once(path,
          '''    fun textTargetsFocusGuard(values: Iterable<CharSequence?>): Boolean =''',
          '''    fun textTargetsAppInfoGateway(values: Iterable<CharSequence?>): Boolean =
                  valuesContainAnyNormalized(normalizeValues(values), normalizedAppInfoGatewaySearchTerms)

              fun textTargetsFocusGuard(values: Iterable<CharSequence?>): Boolean =''')

          # 2) App Info becomes an explicit protected gateway. Explicit removal clicks win
          # over strict Pomodoro so the master-password exit is always reachable.
          path = 'app/src/main/java/com/focusguard/security/SettingsInterceptionPolicy.kt'
          replace_once(path,
          '''        val textMentionsDestructiveControl: Boolean,
                  val textMentionsEssentialSpecialAccess: Boolean
              )''',
          '''        val textMentionsDestructiveControl: Boolean,
                  val textMentionsEssentialSpecialAccess: Boolean,
                  val textMentionsAppInfoGateway: Boolean = false
              )''')
          replace_once(path,
          '''        if (strictPomodoroActive) return Decision.POMODORO_LOCK

              // ACTION_ADD_DEVICE_ADMIN''',
          '''        // ACTION_ADD_DEVICE_ADMIN''')
          replace_once(path,
          '''        // The two menus below are revocation gateways. Once a protection is active,''',
          '''        // App Info is also a revocation gateway: from there Android exposes
              // uninstall, force stop, storage clearing and permission controls. Intercept the
              // row itself so Samsung/One UI never gets a frame to open the destination.
              if (signals.isViewClickedEvent && signals.textMentionsAppInfoGateway) {
                  return Decision.PROTECT_AND_ARM_GUARD
              }

              // The two menus below are revocation gateways. Once a protection is active,''')
          replace_once(path,
          '''        if (signals.isViewClickedEvent && signals.textMentionsFocusGuard) {
                  return Decision.PROTECT_AND_ARM_GUARD
              }

              if (signals.guardArmed''',
          '''        if (signals.isViewClickedEvent && signals.textMentionsFocusGuard) {
                  return Decision.PROTECT_AND_ARM_GUARD
              }

              // An explicit attempt to reach a removal/permission gateway must always
              // offer the master exit, even while strict Pomodoro owns ordinary Settings.
              if (strictPomodoroActive) return Decision.POMODORO_LOCK

              if (signals.guardArmed''')

          # 3) Keep the fast path, but classify App Info and launch one master gate per click.
          path = 'app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt'
          replace_once(path,
          '''import com.focusguard.ui.BlockNoticeActivity
          import com.focusguard.ui.PomodoroLockActivity''',
          '''import com.focusguard.ui.BlockNoticeActivity
          import com.focusguard.ui.MasterRemovalActivity
          import com.focusguard.ui.PomodoroLockActivity''')
          replace_once(path,
          '''    private var lastBlockNoticeLaunchElapsed = 0L''',
          '''    private var lastBlockNoticeLaunchElapsed = 0L
              private var lastMasterRemovalGateLaunchElapsed = 0L''')
          replace_once(path,
          '''    private val clickInterceptionSearchTerms =
                  (directClickContextSufficientTerms + "admin").distinct()''',
          '''    private val clickInterceptionSearchTerms =
                  (directClickContextSufficientTerms +
                      listOf("admin", "Informações do app", "Informações do aplicativo", "App info"))
                      .distinct()''')
          replace_once(path,
          '''        if (!isSystemUi && isPomodoroStrictActive) {''',
          '''        if (!isSystemUi &&
                  isPomodoroStrictActive &&
                  event.eventType != AccessibilityEvent.TYPE_VIEW_CLICKED
              ) {''')
          replace_once(path,
          '''            textMentionsDestructiveControl = managedTextSignals.destructiveControl,
                      textMentionsEssentialSpecialAccess = managedTextSignals.essentialSpecialAccess
                  )''',
          '''            textMentionsDestructiveControl = managedTextSignals.destructiveControl,
                      textMentionsEssentialSpecialAccess = managedTextSignals.essentialSpecialAccess,
                      textMentionsAppInfoGateway = managedTextSignals.appInfoGateway
                  )''')
          replace_once(path,
          '''        val decision = SettingsInterceptionPolicy.decide(''',
          '''        val masterRemovalTarget = if (event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED) {
                  when {
                      signals.textMentionsDeviceAdmin || classTargetsDeviceAdmin ->
                          MasterRemovalActivity.Target.DEVICE_ADMIN
                      (signals.textMentionsInstalledAccessibilityApps &&
                          signals.textMentionsAccessibility) ||
                          classTargetsAccessibilityServiceToggle ||
                          (signals.textMentionsAccessibilityDisclosure && signals.textMentionsFocusGuard) ->
                          MasterRemovalActivity.Target.ACCESSIBILITY
                      signals.textMentionsAppInfoGateway || classTargetsAppDetails ->
                          MasterRemovalActivity.Target.APP_INFO
                      classTargetsUninstall ||
                          packageName in SettingsInterceptionPolicy.packageInstallerPackages ||
                          (signals.textMentionsDestructiveControl && signals.textMentionsFocusGuard) ->
                          MasterRemovalActivity.Target.UNINSTALL
                      signals.textMentionsFocusGuard -> MasterRemovalActivity.Target.APP_INFO
                      else -> null
                  }
              } else {
                  null
              }

              val decision = SettingsInterceptionPolicy.decide(''')
          replace_once(path,
          '''            SettingsInterceptionPolicy.Decision.PROTECT -> {
                      executeProtectionAction(eventDetectedAtNanos)
                      true
                  }''',
          '''            SettingsInterceptionPolicy.Decision.PROTECT -> {
                      executeProtectionAction(eventDetectedAtNanos)
                      masterRemovalTarget?.let(::launchMasterRemovalGate)
                      true
                  }''')
          replace_once(path,
          '''                executeProtectionAction(eventDetectedAtNanos)
                      true
                  }
              }
          }

          private fun eventTextValues''',
          '''                executeProtectionAction(eventDetectedAtNanos)
                      masterRemovalTarget?.let(::launchMasterRemovalGate)
                      true
                  }
              }
          }

          private fun launchMasterRemovalGate(target: MasterRemovalActivity.Target) {
              val nowElapsed = SystemClock.elapsedRealtime()
              if (nowElapsed - lastMasterRemovalGateLaunchElapsed < MASTER_REMOVAL_GATE_COOLDOWN_MILLIS) {
                  return
              }
              lastMasterRemovalGateLaunchElapsed = nowElapsed

              val intent = MasterRemovalActivity.createIntent(this, target).apply {
                  addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK or
                          Intent.FLAG_ACTIVITY_CLEAR_TOP or
                          Intent.FLAG_ACTIVITY_SINGLE_TOP or
                          Intent.FLAG_ACTIVITY_NO_ANIMATION
                  )
              }
              runCatching {
                  startActivity(intent)
                  // The overlay covers the Settings transition; remove it as soon as our
                  // own credential Activity is requested so it never intercepts password input.
                  dismissInstantBlockCurtain()
              }.onFailure { error ->
                  FocusGuardLogger.logError("MasterRemoval", "Falha ao abrir senha mestre", error)
              }
          }

          private fun eventTextValues''')
          replace_once(path,
          '''        private const val FOCUS_MODE_REDIRECT_COOLDOWN_MILLIS = 600L''',
          '''        private const val FOCUS_MODE_REDIRECT_COOLDOWN_MILLIS = 600L
              private const val MASTER_REMOVAL_GATE_COOLDOWN_MILLIS = 1_200L''')

          # 4) Manifest: private credential gate, separate from password-management Activity.
          path = 'app/src/main/AndroidManifest.xml'
          replace_once(path,
          '''        <activity
