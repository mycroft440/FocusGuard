              )''',
          '''        textMentionsDestructiveControl = textMentionsDestructiveControl,
                  textMentionsEssentialSpecialAccess = textMentionsEssentialSpecialAccess,
                  textMentionsAppInfoGateway = textMentionsAppInfoGateway
              )''')
          marker = '\n    @Test\n    fun `strict pomodoro still owns settings while its device lock is active`() {'
          insertion = '''
              @Test
              fun `app info gateway is blocked before navigation`() {
                  assertThat(
                      decide(
                          signals(
                              isViewClickedEvent = true,
                              textMentionsAppInfoGateway = true
                          )
                      )
                  ).isEqualTo(Decision.PROTECT_AND_ARM_GUARD)
              }

              @Test
              fun `explicit app info removal gateway remains reachable through master gate during strict pomodoro`() {
                  assertThat(
                      decide(
                          signals(
                              isViewClickedEvent = true,
                              textMentionsAppInfoGateway = true
                          ),
                          strictPomodoro = true
                      )
                  ).isEqualTo(Decision.PROTECT_AND_ARM_GUARD)
              }
          '''
          p = Path(path); text = p.read_text()
          if marker not in text: raise SystemExit('SettingsInterceptionPolicyTest insertion marker missing')
          p.write_text(text.replace(marker, insertion + marker, 1))

          path = 'app/src/test/java/com/focusguard/security/ManagedSelfProtectionPolicyTest.kt'
          p = Path(path); text = p.read_text(); idx = text.rfind('\n}')
          if idx < 0: raise SystemExit('ManagedSelfProtectionPolicyTest closing brace missing')
          tests = '''

              @Test
              fun `Samsung system administrator label targets device admin`() {
                  assertThat(
                      ManagedSelfProtectionPolicy.textTargetsDeviceAdmin(
                          listOf("Apps administradores do sistema")
