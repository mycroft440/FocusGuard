            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/main/java/com/focusguard/ui/MasterRemovalActivity.kt \
            app/src/main/java/com/focusguard/ui/compose/screens/RecoveryCourseGatewayScreen.kt \
            app/src/main/res/values/strings_recovery_course.xml \
            app/src/main/res/values-en/strings_recovery_course.xml \
            app/src/main/res/values-pt/strings_recovery_course.xml \
            app/src/main/res/values/strings_master_removal.xml \
            app/src/main/res/values-en/strings_master_removal.xml \
            app/src/main/res/values-pt/strings_master_removal.xml \
            app/src/test/java/com/focusguard/security/ManagedSelfProtectionPolicyTest.kt \
            app/src/test/java/com/focusguard/security/SettingsInterceptionPolicyTest.kt
          git commit -m 'Restore AntiPorn and add master removal gate'
          git push origin HEAD:fix/master-removal-gate-and-antiporn-restore
