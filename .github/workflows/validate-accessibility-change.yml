name: Validate Accessibility Change

on:
  push:
    branches: ["agent/accessibility-protection-window"]
    paths:
      - ".github/workflows/validate-accessibility-change.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accessibility-protection-window
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run validation and preserve diagnostics
        run: |
          set +e
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace > accessibility-validation.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f accessibility-validation.log
            git commit -m "Record accessibility validation failure" || true
            git push origin HEAD:agent/accessibility-protection-window
            exit "$status"
          fi
          rm accessibility-validation.log
      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/validate-accessibility-change.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-accessibility-change.yml
          git commit -m "Remove temporary accessibility validation workflow"
          git push origin HEAD:agent/accessibility-protection-window
