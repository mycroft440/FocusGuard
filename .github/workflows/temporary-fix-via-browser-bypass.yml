name: Temporary Via browser bypass patch

on:
  push:
    branches:
      - fix/via-browser-opaque-bypass
    paths:
      - .github/workflows/temporary-fix-via-browser-bypass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/via-browser-opaque-bypass
          fetch-depth: 0

      - name: Apply fail-closed patch
        run: python .github/scripts/apply_via_browser_bypass_fix.py

      - name: Verify and commit patch
        run: |
          set -euo pipefail
          git diff --check
          grep -q "bloqueando o navegador fail-closed" app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          grep -q "launchOpaqueBrowserFailClosedNotice" app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add app/src/main/java/com/focusguard/utils/WebsiteObservabilityPolicy.kt
          git add app/src/test/java/com/focusguard/utils/WebsiteObservabilityPolicyTest.kt
          git add docs/WEBSITE_BLOCKING.md
          git commit -m "Fail closed on opaque browser website bypass"
          git push origin HEAD:fix/via-browser-opaque-bypass
