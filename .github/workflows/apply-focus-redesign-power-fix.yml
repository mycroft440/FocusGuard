name: Apply Focus Redesign and Power Fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/apply_focus_redesign_power_fix.py"
      - ".github/workflows/apply-focus-redesign-power-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply reviewed changes
        run: python3 .github/scripts/apply_focus_redesign_power_fix.py

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile lint and test
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin lintDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Remove temporary executor
        shell: bash
        run: |
          rm -f .github/scripts/apply_focus_redesign_power_fix.py
          rm -f .github/workflows/apply-focus-redesign-power-fix.yml

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Redesenha Modo Foco e corrige falso menu de energia"
          git push origin HEAD:main
