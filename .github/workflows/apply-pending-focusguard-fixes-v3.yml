name: Apply pending FocusGuard fixes v3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-pending-focusguard-fixes-v3.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Apply source changes
        run: python3 .github/scripts/apply_pending_focusguard_fixes.py

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile, lint and test
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin lintDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Commit verified changes
        run: |
          rm -f .github/workflows/apply-pending-focusguard-fixes.yml
          rm -f .github/workflows/apply-pending-focusguard-fixes-v2.yml
          rm -f .github/workflows/apply-pending-focusguard-fixes-v3.yml
          rm -f .github/scripts/apply_pending_focusguard_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Melhora Modo foco, limites e bloqueio imediato de sites"
          git push origin HEAD:main
