name: Temporary website redirect patch

on:
  push:
    branches:
      - fix/website-redirect-settings-cleanup

permissions:
  contents: write

jobs:
  patch-website-redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply scoped website redirect patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt")
          source = path.read_text(encoding="utf-8")
          old = '''                // If the browser/API cannot expose a certifiable editable
            // omnibox, restore the blocked surface and request Google through an
            // explicit package-scoped browser intent while the opaque curtain remains
            // on top. This covers Firefox, Samsung Internet and Chromium forks whose
            // accessibility trees do not expose the same editing actions.
            if (!redirectRequested) {
                val blockedSurfaceRestored =
                    restoreBlockedSurfaceAfterAddressEdit(transition)
                redirectRequested = blockedSurfaceRestored &&
                    requestSafeGoogleThroughBrowserIntent(transition)
            }

            // If even the generic browser intent cannot be launched, retain the
            // positively-identified Chromium close-tab fallback. HOME remains the
            // fail-closed escape when no safe destination can be confirmed.
            if (!redirectRequested) {
                redirectRequested = closeBlockedTabAndRequestSafeGoogle(
                    browserPackageName = browserPackageName,
                    expectedWindowId = expectedWindowId,
                    transition = transition
                )
            }
'''
          new = '''                // Keep the redirect in the tab that exposed the blocked site.
                // If direct omnibox replacement is unavailable, first restore the
                // exact blocked surface and neutralize that tab before requesting
                // Google. Never launch a generic browser intent while the blocked
                // tab is still alive, because browsers may open it in a new tab.
                if (!redirectRequested) {
                    val blockedSurfaceRestored =
                        restoreBlockedSurfaceAfterAddressEdit(transition)
                    redirectRequested = blockedSurfaceRestored &&
                        closeBlockedTabAndRequestSafeGoogle(
                            browserPackageName = browserPackageName,
                            expectedWindowId = expectedWindowId,
                            transition = transition
                        )
                }
'''
          if old not in source:
              raise SystemExit("Expected website redirect block was not found exactly once")
          if source.count(old) != 1:
              raise SystemExit("Expected website redirect block matched more than once")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Commit scoped patch
        run: |
          if git diff --quiet -- app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git commit -m "Keep blocked website redirect in current tab"
          git push origin HEAD:${{ github.ref_name }}
