name: Apply guarded F4 fix

on:
  push:
    branches:
      - fix/website-blocking-redirection
    paths:
      - .github/workflows/apply-f4-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/website-blocking-redirection
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply guarded redirect-window handoff
        shell: bash
        run: |
          cat > /tmp/apply_f4.py <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} marker count={count}')
              text = text.replace(old, new, 1)

          replace_once(
              '        val inspectionGeneration: Long,\n',
              '        @Volatile internal var inspectionGeneration: Long,\n',
              'inspectionGeneration'
          )
          replace_once(
              '        internal var externalRedirectRequestedAtUptimeMillis: Long = Long.MAX_VALUE,\n',
              '        internal var externalRedirectRequestedAtUptimeMillis: Long = Long.MAX_VALUE,\n'
              '        internal var externalRedirectWindowRebound: Boolean = false,\n',
              'external redirect state'
          )

          observe_marker = '        @Synchronized\n        fun observeBrowserEvent(\n'
          rebind_method = (
              '        @Synchronized\n'
              '        fun rebindExternalRedirectWindow(\n'
              '            browserPackageName: String,\n'
              '            transitionId: Long,\n'
              '            windowId: Int,\n'
              '            inspectionGeneration: Long,\n'
              '            eventUptimeMillis: Long\n'
              '        ): Boolean {\n'
              '            val transition = activeTransitions[browserPackageName] ?: return false\n'
              '            if (transition.id != transitionId ||\n'
              '                !transition.externalRedirectRequested ||\n'
              '                transition.externalRedirectWindowRebound ||\n'
              '                !transition.sanitizationRequested ||\n'
              '                windowId < 0 || inspectionGeneration <= 0L ||\n'
              '                eventUptimeMillis < transition.externalRedirectRequestedAtUptimeMillis\n'
              '            ) return false\n'
              '            transition.expectedWindowId = windowId\n'
              '            transition.inspectionGeneration = inspectionGeneration\n'
              '            transition.externalRedirectWindowRebound = true\n'
              '            return true\n'
              '        }\n\n'
              + observe_marker
          )
          replace_once(observe_marker, rebind_method, 'observeBrowserEvent')

          callback_start = '            val observedWindowPackage = directPackage.ifBlank { foregroundPackageName.orEmpty() }\n'
          callback_end = '            // Shield the native System UI power menu before any other handling.\n'
          start = text.find(callback_start)
          end = text.find(callback_end, start)
          if start < 0 or end < 0:
              raise SystemExit(f'callback boundaries not found: start={start} end={end}')
          callback = (
              '            // An explicit ACTION_VIEW fallback may make the same browser expose a new\n'
              '            // Android window. Hand the first post-intent browser window to the existing\n'
              '            // transition before generic window retirement. This is provisional only:\n'
              '            // the curtain remains until a stable safe Google surface is confirmed.\n'
              '            val transitionPackage = directPackage.ifBlank { foregroundPackageName.orEmpty() }\n'
              '            val activeBrowserTransition = transitionPackage\n'
              '                .takeIf(String::isNotBlank)\n'
              '                ?.let(websiteBlockTransitionGuard::activeTransition)\n'
              '            if (activeBrowserTransition != null) {\n'
              '                val canRebindExternalWindow =\n'
              '                    activeBrowserTransition.externalRedirectRequested &&\n'
              '                        !activeBrowserTransition.externalRedirectWindowRebound &&\n'
              '                        browserInspectionEvent &&\n'
              '                        event.windowId >= 0 &&\n'
              '                        event.windowId != activeBrowserTransition.expectedWindowId &&\n'
              '                        event.eventTime >= activeBrowserTransition.externalRedirectRequestedAtUptimeMillis\n'
              '                if (canRebindExternalWindow) {\n'
              '                    val reboundGeneration = browserInspectionCoordinator.observeWindow(\n'
              '                        transitionPackage,\n'
              '                        event.windowId\n'
              '                    )\n'
              '                    websiteBlockTransitionGuard.rebindExternalRedirectWindow(\n'
              '                        browserPackageName = transitionPackage,\n'
              '                        transitionId = activeBrowserTransition.id,\n'
              '                        windowId = event.windowId,\n'
              '                        inspectionGeneration = reboundGeneration,\n'
              '                        eventUptimeMillis = event.eventTime\n'
              '                    )\n'
              '                } else if (isWindowOrTabTransitionEvent(event.eventType)) {\n'
              '                    browserInspectionCoordinator.observeWindow(transitionPackage, event.windowId)\n'
              '                }\n'
              '                retireStaleWebsiteTransitions()\n'
              '                if (websiteBlockTransitionGuard.isActive(transitionPackage)) {\n'
              '                    websiteBlockTransitionGuard.observeBrowserEvent(\n'
              '                        browserPackageName = transitionPackage,\n'
              '                        windowId = event.windowId,\n'
              '                        eventUptimeMillis = event.eventTime,\n'
              '                        eventType = event.eventType\n'
              '                    )\n'
              '                    scheduleBrowserInspection(event, transitionPackage)\n'
              '                }\n'
              '                return\n'
              '            }\n\n'
              '            val observedWindowPackage = transitionPackage\n'
              '            if ((event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||\n'
              '                    event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED) &&\n'
              '                observedWindowPackage.isNotBlank()\n'
              '            ) {\n'
              '                browserInspectionCoordinator.observeWindow(observedWindowPackage, event.windowId)\n'
              '                retireStaleWebsiteTransitions()\n'
              '            }\n\n'
          )
          text = text[:start] + callback + text[end:]
          path.write_text(text)
          PY
          python3 /tmp/apply_f4.py

          cat > app/src/test/java/com/focusguard/service/ExternalRedirectHandoffTest.kt <<'KOTLIN'
          package com.focusguard.service

          import android.app.Application
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityWindowInfo
          import io.mockk.every
          import io.mockk.mockk
          import io.mockk.spyk
          import kotlinx.coroutines.ExperimentalCoroutinesApi
          import kotlinx.coroutines.test.runCurrent
          import kotlinx.coroutines.test.runTest
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertSame
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.annotation.Config
          import org.robolectric.util.ReflectionHelpers

          @OptIn(ExperimentalCoroutinesApi::class)
          @RunWith(RobolectricTestRunner::class)
          @Config(sdk = [34], application = Application::class)
          class ExternalRedirectHandoffTest {
              private val browserPackage = "com.android.chrome"
              private val ownPackage = "com.focusguard.v2"

              private fun event(type: Int, pkg: String?, id: Int, time: Long) =
                  mockk<AccessibilityEvent>(relaxed = true) {
                      every { eventType } returns type
                      every { packageName } returns pkg
                      every { windowId } returns id
                      every { eventTime } returns time
                  }

              @Test
              fun `first new browser window after external redirect inherits transition`() = runTest {
                  val service = spyk(BlockingAccessibilityService())
                  every { service.packageName } returns ownPackage
                  val newWindow = mockk<AccessibilityWindowInfo> {
                      every { id } returns 11
                      every { type } returns AccessibilityWindowInfo.TYPE_APPLICATION
                      every { isActive } returns true
                      every { root } returns null
                  }
                  every { service.windows } returns listOf(newWindow)
                  ReflectionHelpers.setField(service, "scope", this)
                  ReflectionHelpers.setField(service, "foregroundPackageName", browserPackage)

                  val coordinator = ReflectionHelpers.getField<BrowserInspectionCoordinator>(
                      service, "browserInspectionCoordinator"
                  )
                  val guard = ReflectionHelpers.getField<BlockingAccessibilityService.WebsiteBlockTransitionGuard>(
                      service, "websiteBlockTransitionGuard"
                  )
                  val token = coordinator.offer(
                      browserPackage, 10, AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED,
                      1L, 1L, "", emptyList(), null
                  ).snapshot.token
                  val transition = guard.tryStart(
                      browserPackageName = browserPackage,
                      transitionId = 1L,
                      destination = BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
                      expectedWindowId = 10,
                      inspectionGeneration = token.generation,
                      blockedCandidate = "https://blocked.example",
                      blockedRules = setOf("blocked.example"),
                      detectionEventUptimeMillis = 1L
                  )!!
                  guard.markCurtainGeneration(browserPackage, 1L, 1L)
                  assertTrue(guard.markExternalRedirectRequested(browserPackage, 1L, 2L))
                  ReflectionHelpers.setField(service, "instantBlockCurtainAttached", true)
                  ReflectionHelpers.setField(service, "instantBlockCurtainVisible", true)
                  ReflectionHelpers.setField(service, "instantBlockCurtainGeneration", 1L)

                  service.onAccessibilityEvent(
                      event(AccessibilityEvent.TYPE_WINDOWS_CHANGED, null, 11, 3L)
                  )
                  runCurrent()

                  assertSame(transition, guard.activeTransition(browserPackage))
                  assertEquals(11, transition.expectedWindowId)
                  assertTrue(transition.externalRedirectWindowRebound)
                  assertEquals(
                      coordinator.currentGeneration(browserPackage, 11),
                      transition.inspectionGeneration
                  )
              }

              @Test
              fun `second different window cannot inherit the same external redirect`() = runTest {
                  val service = spyk(BlockingAccessibilityService())
                  every { service.packageName } returns ownPackage
                  ReflectionHelpers.setField(service, "scope", this)
                  val coordinator = ReflectionHelpers.getField<BrowserInspectionCoordinator>(
                      service, "browserInspectionCoordinator"
                  )
                  val guard = ReflectionHelpers.getField<BlockingAccessibilityService.WebsiteBlockTransitionGuard>(
                      service, "websiteBlockTransitionGuard"
                  )
                  val token = coordinator.offer(
                      browserPackage, 10, AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED,
                      1L, 1L, "", emptyList(), null
                  ).snapshot.token
                  val transition = guard.tryStart(
                      browserPackage, 1L,
                      BlockingAccessibilityService.WebsiteTransitionDestination.GOOGLE,
                      expectedWindowId = 10,
                      inspectionGeneration = token.generation,
                      detectionEventUptimeMillis = 1L
                  )!!
                  assertTrue(guard.markExternalRedirectRequested(browserPackage, 1L, 2L))
                  val generation11 = coordinator.observeWindow(browserPackage, 11)
                  assertTrue(
                      guard.rebindExternalRedirectWindow(
                          browserPackage, 1L, 11, generation11, 3L
                      )
                  )
                  assertFalse(
                      guard.rebindExternalRedirectWindow(
                          browserPackage, 1L, 12,
                          coordinator.observeWindow(browserPackage, 12), 4L
                      )
                  )
                  assertEquals(11, transition.expectedWindowId)
              }
          }
          KOTLIN

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Commit guarded F4 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
                  app/src/test/java/com/focusguard/service/ExternalRedirectHandoffTest.kt
          git diff --cached --check
          git commit -m "Fix external browser redirect window handoff"
          git push origin HEAD:fix/website-blocking-redirection
