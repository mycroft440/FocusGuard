name: Wire protected power menu service

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch BlockingAccessibilityService
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    private var windowManager: WindowManager? = null\n    @Volatile private var foregroundPackageName: String? = null\n',
                  '    private var windowManager: WindowManager? = null\n    private var protectedPowerMenuController: ProtectedPowerMenuController? = null\n    @Volatile private var foregroundPackageName: String? = null\n'
              ),
              (
                  '        windowManager = getSystemService(Context.WINDOW_SERVICE) as? WindowManager\n\n        registerPackageReceiver()\n',
                  '        windowManager = getSystemService(Context.WINDOW_SERVICE) as? WindowManager\n        protectedPowerMenuController = ProtectedPowerMenuController(this)\n\n        registerPackageReceiver()\n'
              ),
              (
                  '            if (intent?.action == Intent.ACTION_SCREEN_OFF) {\n                foregroundPackageName = null\n                stopWebsiteTracking()\n            }\n',
                  '            if (intent?.action == Intent.ACTION_SCREEN_OFF) {\n                foregroundPackageName = null\n                stopWebsiteTracking()\n                protectedPowerMenuController?.dismiss()\n            }\n'
              ),
              (
                  '            val directPackage = event.packageName?.toString().orEmpty()\n            val eligibleForInterception = event.eventType in settingsInterceptionEventTypes\n',
                  '            val directPackage = event.packageName?.toString().orEmpty()\n\n            // Shield the native System UI power menu before any other handling.\n            // A touch-consuming TYPE_ACCESSIBILITY_OVERLAY stays on top while the\n            // controller forwards only ACTION_CLICK to native actions; the user\n            // never reaches the long-press path that requests Safe Mode.\n            if (protectedPowerMenuController?.handleAccessibilityEvent(\n                    event = event,\n                    protectionActive = isBlockingSessionActive\n                ) == true\n            ) {\n                return\n            }\n\n            val eligibleForInterception = event.eventType in settingsInterceptionEventTypes\n'
              ),
              (
                  '        isBlockingSessionActive = intent.getBooleanExtra(\n            EXTRA_BLOCKING_ACTIVE_SNAPSHOT,\n            apps.isNotEmpty() || sites.isNotEmpty()\n        )\n        lastLoadTime = System.currentTimeMillis()\n',
                  '        isBlockingSessionActive = intent.getBooleanExtra(\n            EXTRA_BLOCKING_ACTIVE_SNAPSHOT,\n            apps.isNotEmpty() || sites.isNotEmpty()\n        )\n        protectedPowerMenuController?.onProtectionStateChanged(isBlockingSessionActive)\n        lastLoadTime = System.currentTimeMillis()\n'
              ),
              (
                  '            stopWebsiteTracking()\n            dismissInstantBlockCurtain()\n            stopForeground(STOP_FOREGROUND_REMOVE)\n',
                  '            stopWebsiteTracking()\n            protectedPowerMenuController?.dismiss()\n            dismissInstantBlockCurtain()\n            stopForeground(STOP_FOREGROUND_REMOVE)\n'
              ),
              (
                  '    override fun onInterrupt() {\n        foregroundPackageName = null\n        stopWebsiteTracking()\n    }\n',
                  '    override fun onInterrupt() {\n        foregroundPackageName = null\n        stopWebsiteTracking()\n        protectedPowerMenuController?.dismiss()\n    }\n'
              ),
              (
                  '        protectionActionUntilElapsed = 0L\n        dismissInstantBlockCurtain()\n',
                  '        protectionActionUntilElapsed = 0L\n        protectedPowerMenuController?.dismiss()\n        dismissInstantBlockCurtain()\n'
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one replacement, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit wiring and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git rm -f -- .github/workflows/apply-protected-power-menu.yml .github/workflows/apply-power-menu-service.yml
          git commit -m "Wire protected power menu into accessibility service"
          git push origin HEAD:${{ github.head_ref }}
