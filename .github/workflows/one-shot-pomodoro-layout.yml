name: One-shot Pomodoro layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-pomodoro-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/one_shot_pomodoro_patch.py

      - name: Commit patch
        run: |
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: fit pomodoro home on one screen"
          git push
