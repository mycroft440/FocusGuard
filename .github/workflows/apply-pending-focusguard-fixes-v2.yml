name: Apply pending FocusGuard fixes v2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-pending-focusguard-fixes-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          def between(text, start, end, replacement, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"{label}: start marker missing")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:a] + replacement + text[b:]

          # ================================================================
          # MODO FOCO
          # ================================================================
          p = Path('app/src/main/java/com/focusguard/ui/compose/screens/FocusModeScreen.kt')
          s = p.read_text()
          additions = [
              ('import androidx.compose.foundation.BorderStroke\n', 'import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.background\n'),
              ('import androidx.compose.foundation.layout.width\n', 'import androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.rememberScrollState\n'),
              ('import androidx.compose.foundation.selection.toggleable\n', 'import androidx.compose.foundation.selection.toggleable\nimport androidx.compose.foundation.verticalScroll\n'),
              ('import androidx.compose.ui.graphics.ImageBitmap\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.ImageBitmap\n'),
              ('import com.focusguard.ui.compose.theme.TextPrimary\n', 'import com.focusguard.ui.compose.theme.TextPrimary\nimport com.focusguard.ui.compose.theme.TextSecondary\n'),
          ]
          for old, new in additions:
              added_line = new.splitlines()[-1]
              if added_line not in s:
                  s = once(s, old, new, f'import {added_line}')

          new_setup = '''@Composable
          private fun FocusModeSetupContent(
              apps: List<FocusModeSelectableApp>,
              mandatoryPackages: Set<String>,
              isLoadingApps: Boolean,
              selectedPackages: Set<String>,
              durationText: String,
              onDurationTextChange: (String) -> Unit,
              durationUnit: FocusModePolicy.DurationUnit,
              onDurationUnitChange: (FocusModePolicy.DurationUnit) -> Unit,
              durationValid: Boolean,
              grayscaleEnabled: Boolean,
              onGrayscaleEnabledChange: (Boolean) -> Unit,
              onAddApps: () -> Unit,
              isStarting: Boolean,
              startOutcome: FocusModeManager.StartOutcome?,
              onStart: () -> Unit
          ) {
              val selectedApps = remember(apps, mandatoryPackages, selectedPackages) {
                  apps.filter {
                      it.packageName in selectedPackages && it.packageName !in mandatoryPackages
                  }
              }
              val initialMinutes = when (durationUnit) {
                  FocusModePolicy.DurationUnit.MINUTES -> durationText.toIntOrNull() ?: 40
                  FocusModePolicy.DurationUnit.HOURS -> (durationText.toIntOrNull() ?: 1) * 60
                  FocusModePolicy.DurationUnit.DAYS -> (durationText.toIntOrNull() ?: 0) * 24 * 60
              }.coerceIn(1, FOCUS_DURATION_MAX_MINUTES)
              var sliderMinutes by rememberSaveable { mutableIntStateOf(initialMinutes) }
              var showHowItWorks by rememberSaveable { mutableStateOf(false) }

              val hoursUnit = stringResource(R.string.focus_mode_static_hours_short)
              val minutesUnit = stringResource(R.string.focus_mode_static_minutes_short)
              val durationLabel = when {
                  sliderMinutes < 60 -> "$sliderMinutes $minutesUnit"
                  sliderMinutes % 60 == 0 -> "${sliderMinutes / 60} $hoursUnit"
                  else -> "${sliderMinutes / 60} $hoursUnit ${sliderMinutes % 60} $minutesUnit"
              }
              val allowedSummary = when (selectedApps.size) {
                  0 -> stringResource(R.string.focus_mode_static_no_extra_apps)
                  1 -> stringResource(R.string.focus_mode_static_one_extra_app)
                  else -> stringResource(R.string.focus_mode_static_many_extra_apps, selectedApps.size)
              }
              val howTitle = stringResource(R.string.focus_mode_how_it_works)

              Box(modifier = Modifier.fillMaxSize()) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(horizontal = 16.dp, vertical = 6.dp)
                  ) {
                      Column(
                          modifier = Modifier
                              .weight(1f)
                              .fillMaxWidth()
                              .verticalScroll(rememberScrollState()),
                          verticalArrangement = Arrangement.spacedBy(9.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = stringResource(R.string.focus_mode_compact_purpose),
                                  color = TextHint,
                                  fontSize = 13.sp,
                                  lineHeight = 18.sp,
                                  modifier = Modifier.weight(1f)
                              )
                              TextButton(onClick = { showHowItWorks = true }) {
                                  Text(
                                      text = howTitle,
                                      color = TextSecondary,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.SemiBold
                                  )
                                  Icon(
                                      Icons.Default.ArrowDropDown,
                                      contentDescription = null,
                                      tint = TextHint,
                                      modifier = Modifier.size(18.dp)
                                  )
                              }
                          }

                          Text(
                              text = stringResource(R.string.focus_mode_static_duration_section),
                              color = TextHint,
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Bold,
                              letterSpacing = 1.5.sp,
                              modifier = Modifier.align(Alignment.CenterHorizontally)
                          )
                          Text(
                              text = durationLabel,
                              color = TextPrimary,
                              fontSize = 46.sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier.align(Alignment.CenterHorizontally)
                          )

                          Slider(
                              value = sliderMinutes.toFloat(),
                              onValueChange = { raw ->
                                  val next = raw.roundToInt().coerceIn(1, FOCUS_DURATION_MAX_MINUTES)
                                  if (next != sliderMinutes) {
                                      sliderMinutes = next
                                      onDurationUnitChange(FocusModePolicy.DurationUnit.MINUTES)
                                      onDurationTextChange(next.toString())
                                  }
                              },
                              valueRange = 1f..FOCUS_DURATION_MAX_MINUTES.toFloat(),
                              colors = SliderDefaults.colors(
                                  thumbColor = AccentCyan,
                                  activeTrackColor = AccentCyan,
                                  inactiveTrackColor = CardBorder
                              )
                          )
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 4.dp),
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Text("1 $minutesUnit", color = TextHint, fontSize = 10.sp)
                              Text("8 $hoursUnit", color = TextHint, fontSize = 10.sp)
                          }

                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .toggleable(
                                      value = grayscaleEnabled,
                                      role = Role.Switch,
                                      onValueChange = onGrayscaleEnabledChange
                                  ),
                              colors = CardDefaults.cardColors(containerColor = DarkCard),
                              border = BorderStroke(1.dp, CardBorder),
                              shape = RoundedCornerShape(14.dp)
                          ) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 14.dp, vertical = 5.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = stringResource(R.string.fg_focus_grayscale),
                                      color = TextPrimary,
                                      fontWeight = FontWeight.SemiBold,
                                      fontSize = 14.sp,
                                      modifier = Modifier.weight(1f)
                                  )
                                  Switch(checked = grayscaleEnabled, onCheckedChange = null)
                              }
                          }

                          Text(
                              text = stringResource(R.string.focus_mode_static_allowed_section),
                              color = TextHint,
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Bold,
                              letterSpacing = 1.sp
                          )

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              FocusPrototypeAppTile(
                                  label = stringResource(R.string.focus_mode_static_phone),
                                  tag = stringResource(R.string.focus_mode_static_always),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Icon(Icons.Default.Phone, null, tint = TextHint, modifier = Modifier.size(30.dp))
                              }
                              FocusPrototypeAppTile(
                                  label = stringResource(R.string.focus_mode_static_sms),
                                  tag = stringResource(R.string.focus_mode_static_always),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Icon(Icons.Default.Message, null, tint = TextPrimary, modifier = Modifier.size(30.dp))
                              }
                              FocusPrototypeSelectedAppsTile(
                                  selectedApps = selectedApps,
                                  isLoading = isLoadingApps,
                                  onClick = onAddApps,
                                  modifier = Modifier.weight(1f)
                              )
                          }

                          if (startOutcome != null) FocusModeStartError(startOutcome)
                          Spacer(modifier = Modifier.height(8.dp))
                      }

                      Text(
                          text = stringResource(
                              R.string.focus_mode_static_dock_summary,
                              durationLabel,
                              allowedSummary
                          ),
                          color = TextHint,
                          fontSize = 11.sp,
                          textAlign = TextAlign.Center,
                          modifier = Modifier.fillMaxWidth().padding(top = 4.dp, bottom = 5.dp)
                      )

                      Button(
                          onClick = onStart,
                          enabled = !isStarting && durationValid && !isLoadingApps,
                          modifier = Modifier.fillMaxWidth().height(52.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = AccentCyan),
                          shape = RoundedCornerShape(14.dp)
                      ) {
                          if (isStarting) {
                              CircularProgressIndicator(
                                  color = MaterialTheme.colorScheme.onPrimary,
                                  strokeWidth = 2.dp,
                                  modifier = Modifier.size(20.dp)
                              )
                          } else {
                              Text(
                                  stringResource(R.string.focus_mode_start),
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 16.sp
                              )
                          }
                      }
                  }

                  if (showHowItWorks) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color.Black.copy(alpha = 0.72f))
                              .clickable { showHowItWorks = false }
                              .padding(24.dp),
                          contentAlignment = Alignment.Center
                      ) {
                          Card(
                              colors = CardDefaults.cardColors(containerColor = DarkCard),
                              border = BorderStroke(1.dp, AccentCyan.copy(alpha = 0.38f)),
                              shape = RoundedCornerShape(18.dp)
                          ) {
                              Column(
                                  modifier = Modifier.fillMaxWidth().padding(18.dp),
                                  verticalArrangement = Arrangement.spacedBy(9.dp)
                              ) {
                                  Text(howTitle, color = TextPrimary, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                  Text(
                                      text = stringResource(R.string.focus_mode_static_purpose_body),
                                      color = TextSecondary,
                                      fontSize = 13.sp,
                                      lineHeight = 19.sp
                                  )
                                  Text(
                                      text = stringResource(R.string.focus_mode_tap_anywhere_to_close),
                                      color = TextHint,
                                      fontSize = 11.sp
                                  )
                              }
                          }
                      }
                  }
              }
          }

          '''
          s = between(
              s,
              '@Composable\nprivate fun FocusModeSetupContent(',
              '@Composable\nprivate fun FocusDurationChip(',
              new_setup,
              'FocusModeSetupContent'
          )
          # The old chip existed only for time suggestions/custom time in this screen.
          s = between(
              s,
              '@Composable\nprivate fun FocusDurationChip(',
              '@Composable\nprivate fun FocusPrototypeAppTile(',
              '',
              'remove FocusDurationChip'
          )
          s = s.replace('private const val FOCUS_DURATION_STEP_MINUTES = 20\n', '')
          s = s.replace('private const val FOCUS_DURATION_SLIDER_STEPS = FOCUS_DURATION_MAX_MINUTES /\n    FOCUS_DURATION_STEP_MINUTES - 1\n', '')
          p.write_text(s)

          string_files = {
              'app/src/main/res/values/focus_mode_pending_strings.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="focus_mode_compact_purpose">Blocks the phone and releases only what you choose.</string>\n    <string name="focus_mode_how_it_works">How it works</string>\n    <string name="focus_mode_tap_anywhere_to_close">Tap anywhere to close.</string>\n</resources>\n''',
              'app/src/main/res/values-en/focus_mode_pending_strings.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="focus_mode_compact_purpose">Blocks the phone and releases only what you choose.</string>\n    <string name="focus_mode_how_it_works">How it works</string>\n    <string name="focus_mode_tap_anywhere_to_close">Tap anywhere to close.</string>\n</resources>\n''',
              'app/src/main/res/values-pt/focus_mode_pending_strings.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="focus_mode_compact_purpose">Bloqueia o telefone e libera só o que você escolher.</string>\n    <string name="focus_mode_how_it_works">Como funciona</string>\n    <string name="focus_mode_tap_anywhere_to_close">Toque em qualquer área da tela para fechar.</string>\n</resources>\n'''
          }
          for path, content in string_files.items():
              Path(path).write_text(content)

          # ================================================================
          # LIMITES DE USO: horas + minutos na origem do fluxo.
          # ================================================================
          p = Path('app/src/main/java/com/focusguard/ui/compose/screens/UsageBlockConfigScreen.kt')
          s = p.read_text()
          s = once(
              s,
              '    val dailyLimitHours: Int = 0,\n',
              '    val dailyLimitHours: Int = 0,\n    val dailyLimitMinutes: Int = 0,\n',
              'BlockConfig dailyLimitMinutes'
          )
          s = once(
              s,
              '    var dailyLimitHoursText by remember { mutableStateOf("") }\n',
              '    var dailyLimitHoursText by remember { mutableStateOf("") }\n    var dailyLimitMinutesText by remember { mutableStateOf("") }\n',
              'minutes input state'
          )
          s = once(
              s,
              '''    val dailyLimitHours = dailyLimitHoursText.toIntOrNull() ?: 0
              val daysToBlock = (daysToBlockText.toIntOrNull() ?: 0).coerceIn(0, 120)
              ''',
              '''    val dailyLimitHours = (dailyLimitHoursText.toIntOrNull() ?: 0).coerceIn(0, 24)
              val dailyLimitMinutes = (dailyLimitMinutesText.toIntOrNull() ?: 0).coerceIn(0, 59)
              val dailyLimitTotalMinutes = dailyLimitHours * 60 + dailyLimitMinutes
              val daysToBlock = (daysToBlockText.toIntOrNull() ?: 0).coerceIn(0, 120)
              ''',
              'total daily minutes'
          )
          s = once(
              s,
              '    val canSave = dailyLimitHours > 0 && when (selectedType) {\n',
              '    val canSave = dailyLimitTotalMinutes > 0 && dailyLimitTotalMinutes <= 24 * 60 && when (selectedType) {\n',
              'canSave total minutes'
          )

          old_field = '''                    OutlinedTextField(
                                  value = dailyLimitHoursText,
                                  onValueChange = { value -> dailyLimitHoursText = value.filter { it.isDigit() } },
                                  modifier = Modifier.fillMaxWidth(),
                                  placeholder = { Text(stringResource(R.string.ex_2), color = TextHint) },
                                  singleLine = true
                              )
          '''
          new_field = '''                    Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(10.dp)
                              ) {
                                  OutlinedTextField(
                                      value = dailyLimitHoursText,
                                      onValueChange = { value ->
                                          val digits = value.filter(Char::isDigit).take(2)
                                          if (digits.isEmpty() || (digits.toIntOrNull() ?: 0) <= 24) {
                                              dailyLimitHoursText = digits
                                          }
                                      },
                                      modifier = Modifier.weight(1f),
                                      label = { Text(stringResource(R.string.limits_time_hours_short)) },
                                      placeholder = { Text("0", color = TextHint) },
                                      singleLine = true
                                  )
                                  OutlinedTextField(
                                      value = dailyLimitMinutesText,
                                      onValueChange = { value ->
                                          val digits = value.filter(Char::isDigit).take(2)
                                          if (digits.isEmpty() || (digits.toIntOrNull() ?: 0) <= 59) {
                                              dailyLimitMinutesText = digits
                                          }
                                      },
                                      modifier = Modifier.weight(1f),
                                      label = { Text(stringResource(R.string.limits_time_minutes_short)) },
                                      placeholder = { Text("0", color = TextHint) },
                                      singleLine = true
                                  )
                              }
          '''
          s = once(s, old_field, new_field, 'hours-only field')
          s = once(
              s,
              '                                dailyLimitHours = dailyLimitHours,\n',
              '                                dailyLimitHours = dailyLimitHours,\n                                dailyLimitMinutes = dailyLimitMinutes,\n',
              'save minute part'
          )
          p.write_text(s)

          p = Path('app/src/main/java/com/focusguard/ui/compose/screens/TimeSessionConfigScreen.kt')
          s = p.read_text()
          s = once(
              s,
              '                val dailyLimitMinutes = (config.dailyLimitHours.coerceAtLeast(1) * 60)\n',
              '''                val dailyLimitMinutes = (
                              config.dailyLimitHours.coerceIn(0, 24) * 60 +
                                  config.dailyLimitMinutes.coerceIn(0, 59)
                              ).coerceIn(1, 24 * 60)
              ''',
              'persist hours plus minutes'
          )
          p.write_text(s)

          usage_strings = {
              'app/src/main/res/values/usage_limit_time_strings.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="limits_time_hours_short">Hours</string>\n    <string name="limits_time_minutes_short">Minutes</string>\n</resources>\n''',
              'app/src/main/res/values-en/usage_limit_time_strings.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="limits_time_hours_short">Hours</string>\n    <string name="limits_time_minutes_short">Minutes</string>\n</resources>\n''',
              'app/src/main/res/values-pt/usage_limit_time_strings.xml': '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="limits_time_hours_short">Horas</string>\n    <string name="limits_time_minutes_short">Minutos</string>\n</resources>\n'''
          }
          for path, content in usage_strings.items():
              Path(path).write_text(content)

          # ================================================================
          # BLOQUEIO DE SITES: pacote resolvido + navegador dinâmico + rapidez.
          # ================================================================
          p = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          s = p.read_text()
          s = once(s, '    private val browserDebounceMillis = 120L\n', '    private val browserDebounceMillis = 0L\n', 'browser debounce')
          s = once(s, '    private val websiteBlockCooldownMillis = 1_500L\n', '', 'remove website cooldown constant')
          s = once(s, '    private val websitePulseMillis = 5_000L\n', '    private val websitePulseMillis = 1_000L\n', 'website pulse')

          s = once(
              s,
              '''                    if (packageName in browserPackages &&
                                  (fastEvent || now - lastBrowserCheck >= browserDebounceMillis)
                              ) {
                                  lastBrowserCheck = now
                                  handleBrowserEvent(event)
                              }
              ''',
              '''                    if (isRecognizedBrowserSurface(event, packageName) &&
                                  (fastEvent || now - lastBrowserCheck >= browserDebounceMillis)
                              ) {
                                  lastBrowserCheck = now
                                  handleBrowserEvent(event, packageName)
                              }
              ''',
              'browser content fast path'
          )

          s = once(
              s,
              '''            packageName in browserPackages &&
                          (blockedWebsitesDomainSet.isNotEmpty() || limitedWebsiteDomains.isNotEmpty()) ->
                          handleBrowserEvent(event)
              ''',
              '''            isRecognizedBrowserSurface(event, packageName) &&
                          (blockedWebsitesDomainSet.isNotEmpty() || limitedWebsiteDomains.isNotEmpty()) ->
                          handleBrowserEvent(event, packageName)
              ''',
              'browser window path'
          )

          old_handler = '''    private fun handleBrowserEvent(event: AccessibilityEvent) {
                  val packageName = event.packageName?.toString() ?: return
                  if (packageName !in browserPackages) return
          '''
          new_handler = '''    private fun handleBrowserEvent(
                  event: AccessibilityEvent,
                  resolvedPackageName: String
              ) {
                  val packageName = resolvedPackageName.takeIf(String::isNotBlank) ?: return
                  if (!isRecognizedBrowserSurface(event, packageName)) return
          '''
          s = once(s, old_handler, new_handler, 'resolved browser package')

          marker = '    private fun handleBrowserEvent(\n'
          helper = '''    /**
               * Recognizes every installed HTTPS handler and also promotes an unknown
               * browser/WebView shell as soon as it exposes a real address-bar/URI node.
               * Arbitrary page text is intentionally never treated as a URL.
               */
              private fun isRecognizedBrowserSurface(
                  event: AccessibilityEvent,
                  packageName: String
              ): Boolean {
                  if (packageName.isBlank()) return false
                  if (packageName in browserPackages) return true

                  if (WebsiteBlocker.extractAddressBarTextFromEvent(event, packageName) != null) {
                      browserPackages = browserPackages + packageName
                      return true
                  }

                  val canInspectRoot = event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                      event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED ||
                      event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED ||
                      event.eventType == AccessibilityEvent.TYPE_VIEW_FOCUSED
                  if (!canInspectRoot) return false

                  val root = rootInActiveWindow ?: sourceNodeForEvent(event) ?: return false
                  val recognized = try {
                      WebsiteBlocker.extractAddressBarTextFromRoot(root, packageName) != null
                  } finally {
                      recycleSafely(root)
                  }
                  if (recognized) browserPackages = browserPackages + packageName
                  return recognized
              }

          '''
          if 'private fun isRecognizedBrowserSurface(' not in s:
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('browser helper insertion marker missing')
              s = s[:idx] + helper + s[idx:]

          s = once(
              s,
              '''    private fun beginWebsiteBlock(domain: String, packageName: String): Boolean {
                  val now = System.currentTimeMillis()
                  val blockKey = "$packageName|$domain"
                  if (blockKey == lastWebsiteBlockKey &&
                      now - lastWebsiteBlockTime < websiteBlockCooldownMillis
                  ) return false

                  lastWebsiteBlockKey = blockKey
                  lastWebsiteBlockTime = now
                  stopWebsiteTracking(now)
                  return true
              }
              ''',
              '''    private fun beginWebsiteBlock(domain: String, packageName: String): Boolean {
                  val now = System.currentTimeMillis()
                  // Every attempt renews enforcement, matching the app-block fast path.
                  // A reload/back-forward action must never be ignored by a cooldown.
                  lastWebsiteBlockKey = "$packageName|$domain"
                  lastWebsiteBlockTime = now
                  stopWebsiteTracking(now)
                  return true
              }
              ''',
              'website repeated-attempt enforcement'
          )
          p.write_text(s)

          # Documentation of the real compatibility contract.
          p = Path('docs/WEBSITE_BLOCKING.md')
          s = p.read_text()
          old = '''   - É a camada comum para qualquer navegador instalado que declare suporte a
               links HTTPS, além de uma lista de compatibilidade para os navegadores mais
               usados (Firefox, Brave, Samsung Internet, Opera, Vivaldi e DuckDuckGo).
          '''
          new = '''   - É a camada comum para qualquer navegador instalado que declare suporte a
               links HTTPS. Um navegador desconhecido também passa a ser reconhecido
               dinamicamente assim que expõe uma barra de endereço ou campo URI à
               acessibilidade; a lista conhecida fica apenas como fallback.
          '''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          Path('docs/EXECUTION_PLAN_2026-08-27.md').write_text('''# Plano de execução — 27/08/2026

## Implementado nesta rodada

- Modo foco: botão **Iniciar** fixo na parte inferior e conteúdo superior rolável.
- Modo foco: sugestões/atalhos de duração removidos; duração centralizada no slider.
- Modo foco: **Tela cinza** reduzida a título + chave.
- Modo foco: **Como funciona** abre um card sobre a tela e qualquer toque fecha o card.
- Limites de uso: fluxo antigo de horas passou a aceitar **horas + minutos** e persiste o total em minutos para apps e sites.
- Bloqueio de sites: usa o pacote já resolvido do evento, inclusive em `TYPE_WINDOWS_CHANGED`.
- Bloqueio de sites: todos os handlers HTTPS são detectados e navegadores desconhecidos podem ser promovidos pela barra de URL acessível.
- Bloqueio de sites: debounce removido e tentativas repetidas deixaram de ser ignoradas por cooldown.
