          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile, lint and test before commit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin lintDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Commit only after validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-pending-focusguard-fixes.yml
          rm -f .github/workflows/apply-pending-focusguard-fixes-v2.yml
          git config user.name "github-actions[bot]"
