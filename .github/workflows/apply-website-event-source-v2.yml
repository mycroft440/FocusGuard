name: Apply website event source v2 fix

on:
  push:
    branches:
      - fix/website-detection-same-tab-v2
    paths:
      - .github/workflows/apply-website-event-source-v2.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/website-detection-same-tab-v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused patch
        run: python3 tools/apply_website_event_source_v2.py

      - name: Validate patch
        run: git diff --check

      - name: Run navigation regression tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests com.focusguard.service.WebsiteBlockNavigationTest
          status=$?
          if [ $status -ne 0 ]; then
            find app/build/test-results/testDebugUnitTest -name 'TEST-com.focusguard.service.WebsiteBlockNavigationTest.xml' \
              -exec cat {} \; || true
            exit $status
          fi

      - name: Run browser detection and race tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests com.focusguard.service.BrowserTransitionRaceTest
          --tests com.focusguard.service.WebsiteBlockDetectionLatencyTest
          --tests com.focusguard.utils.WebsiteBlockerTest

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/main/java/com/focusguard/utils/WebsiteBlocker.kt \
            app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix browser event-source detection and same-rule redirect"
          git push origin HEAD:fix/website-detection-same-tab-v2
