name: Apply blocking review hardening

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-blocking-review-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply reviewed blocking fixes
        run: |
          python3 .github/scripts/apply_blocking_review_hardening.py
          python3 .github/scripts/fix_blocking_review_hardening.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile lint and test
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin lintDebug testDebugUnitTest --stacktrace

      - name: Commit verified blocking hardening
        run: |
          rm -f .github/scripts/apply_blocking_review_hardening.py
          rm -f .github/scripts/fix_blocking_review_hardening.py
          rm -f .github/workflows/apply-blocking-review-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Endurece bloqueios por senha, tempo e sites"
          git pull --rebase origin main
          git push origin HEAD:main
