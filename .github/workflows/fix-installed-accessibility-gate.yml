name: Format installed accessibility gate

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/master-removal-gate-and-antiporn-restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Format helper
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = p.read_text()
          old = '''        internal fun confirmAccessibilityContextForInstalledEntry(
          directAccessibility: Boolean,
          installedAccessibilityApps: Boolean,
          rootMentionsAccessibility: () -> Boolean
      ): Boolean = directAccessibility ||
          (installedAccessibilityApps && rootMentionsAccessibility())

      internal fun settingsInterceptionEventTypesForTest(): Set<Int> =
          settingsInterceptionEventTypes'''
          new = '''        internal fun confirmAccessibilityContextForInstalledEntry(
              directAccessibility: Boolean,
              installedAccessibilityApps: Boolean,
              rootMentionsAccessibility: () -> Boolean
          ): Boolean = directAccessibility ||
              (installedAccessibilityApps && rootMentionsAccessibility())

          internal fun settingsInterceptionEventTypesForTest(): Set<Int> =
              settingsInterceptionEventTypes'''
          if old not in text:
              raise SystemExit('formatting block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git commit -m 'Format accessibility gateway helper'
          git push origin HEAD:${{ github.head_ref }}
