name: Cleanup Device Admin Patch Machinery

on:
  push:
    branches:
      - fix/device-admin-fastpath

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[device-admin-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-admin-fastpath
          fetch-depth: 0
      - name: Restore CI and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/android-ci.yml
          git rm -f .github/workflows/device-admin-fix.yml
          git rm -f scripts/apply_device_admin_fastpath_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[device-admin-cleanup] chore: remove temporary patch machinery"
          git push origin HEAD:fix/device-admin-fastpath
