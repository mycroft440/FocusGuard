name: Fix classifier initialization order

on:
  push:
    branches:
      - perf/instant-self-protection

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/instant-self-protection
          fetch-depth: 0

      - name: Fix static initialization order
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'app/src/main/java/com/focusguard/security/AccessibilitySettingsPolicy.kt'
          replace_once(
              path,
              '''    data class TextSignals(\n        val accessibility: Boolean,\n        val installedAccessibilityApps: Boolean,\n        val accessibilityDisclosure: Boolean\n    )\n\n''',
              '''    data class TextSignals(\n        val accessibility: Boolean,\n        val installedAccessibilityApps: Boolean,\n        val accessibilityDisclosure: Boolean\n    )\n\n    // Must be initialized before the pre-normalized dictionaries below.\n    private val COMBINING_MARKS_REGEX = "\\\\p{M}+".toRegex()\n\n'''
          )
          replace_once(
              path,
              '''\n    private val COMBINING_MARKS_REGEX = "\\\\p{M}+".toRegex()\n}\n''',
              '''\n}\n'''
          )

          path = 'app/src/main/java/com/focusguard/security/ManagedSelfProtectionPolicy.kt'
          replace_once(
              path,
              '''    data class TextSignals(\n        val deviceAdmin: Boolean,\n        val focusGuard: Boolean,\n        val destructiveControl: Boolean,\n        val essentialSpecialAccess: Boolean\n    )\n\n''',
              '''    data class TextSignals(\n        val deviceAdmin: Boolean,\n        val focusGuard: Boolean,\n        val destructiveControl: Boolean,\n        val essentialSpecialAccess: Boolean\n    )\n\n    // These helpers must exist before the pre-normalized dictionaries are built.\n    private val COMBINING_MARKS_REGEX = "\\\\p{M}+".toRegex()\n    private val NON_LETTER_REGEX = "[^a-z]+".toRegex()\n\n'''
          )
          replace_once(
              path,
              '''\n    private val COMBINING_MARKS_REGEX = "\\\\p{M}+".toRegex()\n    private val NON_LETTER_REGEX = "[^a-z]+".toRegex()\n}\n''',
              '''\n}\n'''
          )

          path = '.agents/implementation_plan.md'
          replace_once(
              path,
              '''- CUMPRIDO: revisão do Crítico manteve “admin” apenas como localizador, reutilizou o cache de Modo Foco/Device Owner e evitou falsos negativos por contexto incompleto.\n''',
              '''- CUMPRIDO: revisão do Crítico manteve “admin” apenas como localizador, reutilizou o cache de Modo Foco/Device Owner e evitou falsos negativos por contexto incompleto.\n- CUMPRIDO: CI #759 detectou uma dependência de ordem na inicialização estática dos classificadores; os regex reutilizados agora são inicializados antes dos dicionários pré-normalizados, eliminando o `ExceptionInInitializerError` sem mudar as regras de classificação.\n'''
          )

          Path('.github/workflows/fix-classifier-init-order.yml').unlink(missing_ok=True)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix classifier initialization order"
          git push origin HEAD:perf/instant-self-protection
