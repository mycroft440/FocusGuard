name: Apply dopamine target selection fix

on:
  push:
    branches: ["fix/dopamine-target-selection-integrity"]
    paths:
      - ".github/workflows/apply-dopamine-target-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dopamine-target-selection-integrity
          fetch-depth: 0
      - name: Apply exact source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          app = "app/src/main/java/com/focusguard/ui/compose/screens/AppSelectionScreen.kt"
          replace(app, '''    val category: String = "",\n    val iconUrl: String? = null\n)''', '''    val category: String = "",\n    val iconUrl: String? = null,\n    val isAlreadyBlocked: Boolean = false\n)''')
          replace(app, '''    val selectedApps = remember(apps) {\n        apps.filter { it.isSelected }.sortedBy { it.appName.lowercase() }\n    }\n    val availableApps = remember(apps, searchQuery) {\n        apps\n            .asSequence()\n            .filterNot { it.isSelected }''', '''    val alreadyBlockedApps = remember(apps, searchQuery) {\n        alreadyBlockedAppsForSelection(apps, searchQuery)\n    }\n    val selectedApps = remember(apps) {\n        apps.filter { it.isSelected && !it.isAlreadyBlocked }\n            .sortedBy { it.appName.lowercase() }\n    }\n    val availableApps = remember(apps, searchQuery) {\n        apps\n            .asSequence()\n            .filterNot { it.isSelected || it.isAlreadyBlocked }''')
          replace(app, '''            LazyColumn(\n                modifier = Modifier.fillMaxSize(),\n                contentPadding = PaddingValues(horizontal = 16.dp, vertical = 8.dp)\n            ) {\n                if (selectedApps.isNotEmpty()) {''', '''            LazyColumn(\n                modifier = Modifier.fillMaxSize(),\n                contentPadding = PaddingValues(horizontal = 16.dp, vertical = 8.dp)\n            ) {\n                if (alreadyBlockedApps.isNotEmpty()) {\n                    item {\n                        Text(\n                            text = stringResource(R.string.app_selection_already_blocked),\n                            fontSize = 16.sp,\n                            fontWeight = FontWeight.Bold,\n                            color = TextPrimary,\n                            modifier = Modifier.padding(top = 4.dp, bottom = 4.dp, start = 4.dp)\n                        )\n                        Text(\n                            text = stringResource(R.string.app_selection_already_blocked_hint),\n                            fontSize = 12.sp,\n                            color = TextHint,\n                            modifier = Modifier.padding(start = 4.dp, bottom = 8.dp)\n                        )\n                    }\n                    items(alreadyBlockedApps, key = { "blocked_${it.packageName}" }) { blockedApp ->\n                        AppSelectionItem(app = blockedApp, onToggle = { onToggleApp(blockedApp.packageName) })\n                    }\n                    item {\n                        Spacer(modifier = Modifier.height(12.dp))\n                        HorizontalDivider(color = CardBorder, thickness = 1.dp)\n                        Spacer(modifier = Modifier.height(12.dp))\n                    }\n                }\n\n                if (selectedApps.isNotEmpty()) {''')
          replace(app, '''            Checkbox(\n                checked = app.isSelected,\n                onCheckedChange = { onToggle() },\n                colors = CheckboxDefaults.colors(\n                    checkedColor = AccentCyan,\n                    uncheckedColor = TextHint,\n                    checkmarkColor = DarkBg\n                )\n            )''', '''            if (app.isAlreadyBlocked) {\n                Text(\n                    text = stringResource(R.string.app_selection_already_blocked_badge),\n                    color = TextSecondary,\n                    fontSize = 12.sp,\n                    fontWeight = FontWeight.SemiBold\n                )\n            } else {\n                Checkbox(\n                    checked = app.isSelected,\n                    onCheckedChange = { onToggle() },\n                    colors = CheckboxDefaults.colors(\n                        checkedColor = AccentCyan,\n                        uncheckedColor = TextHint,\n                        checkmarkColor = DarkBg\n                    )\n                )\n            }''')
          p = Path(app)
          text = p.read_text()
          marker = "\n@OptIn(ExperimentalMaterial3Api::class)\n"
          helper = '''\ninternal fun alreadyBlockedAppsForSelection(\n    apps: List<SelectableAppUi>,\n    searchQuery: String\n): List<SelectableAppUi> = apps.asSequence()\n    .filter { it.isAlreadyBlocked }\n    .filter {\n        searchQuery.isBlank() ||\n            it.appName.contains(searchQuery, ignoreCase = true) ||\n            it.packageName.contains(searchQuery, ignoreCase = true)\n    }\n    .sortedBy { it.appName.lowercase() }\n    .toList()\n'''
          if marker not in text:
              raise SystemExit("AppSelectionScreen marker missing")
          p.write_text(text.replace(marker, helper + marker, 1))

          create = "app/src/main/java/com/focusguard/ui/CreateSessionActivity.kt"
          replace(create, '''                        isSelected = info.packageName in initialSelectedPackages &&\n                            info.packageName !in blockedPackages,\n                        isInstalled = true''', '''                        isSelected = info.packageName in initialSelectedPackages &&\n                            info.packageName !in blockedPackages,\n                        isInstalled = true,\n                        isAlreadyBlocked = info.packageName in blockedPackages''')
          replace(create, '''                        isSelected = it.packageName in initialSelectedPackages &&\n                            it.packageName !in blockedPackages,\n                        isInstalled = false,\n                        category = it.category,\n                        iconUrl = iconUrl''', '''                        isSelected = it.packageName in initialSelectedPackages &&\n                            it.packageName !in blockedPackages,\n                        isInstalled = false,\n                        category = it.category,\n                        iconUrl = iconUrl,\n                        isAlreadyBlocked = it.packageName in blockedPackages''')

          time = "app/src/main/java/com/focusguard/ui/compose/screens/TimeBlockSessionConfigScreen.kt"
          replace(time, 'import com.focusguard.utils.FocusGuardLogger\n', 'import com.focusguard.utils.FocusGuardLogger\nimport com.focusguard.utils.WebsiteBlocker\n')
          replace(time, 'private enum class TimeBlockConfigPage {', 'internal fun selectedTargetCount(appCount: Int, siteCount: Int): Int = appCount + siteCount\n\nprivate enum class TimeBlockConfigPage {')
          replace(time, '''                    appName = appName,\n                    apps = apps,\n                    termsAccepted = termsAccepted,''', '''                    appName = appName,\n                    apps = apps,\n                    sites = sites,\n                    termsAccepted = termsAccepted,''')
          replace(time, '''private fun TimeBlockTermsPage(\n    appName: String,\n    apps: List<String>,\n    termsAccepted: Boolean,''', '''private fun TimeBlockTermsPage(\n    appName: String,\n    apps: List<String>,\n    sites: List<String>,\n    termsAccepted: Boolean,''')
          replace(time, '''    SelectedAppsSummary(\n        appName = appName,\n        apps = apps\n    )''', '''    SelectedAppsSummary(\n        appName = appName,\n        apps = apps,\n        sites = sites\n    )''')
          replace(time, '''private fun SelectedAppsSummary(\n    appName: String,\n    apps: List<String>\n) {\n    val context = LocalContext.current''', '''private fun SelectedAppsSummary(\n    appName: String,\n    apps: List<String>,\n    sites: List<String>\n) {\n    val context = LocalContext.current\n    val totalTargets = selectedTargetCount(apps.size, sites.size)''')
          replace(time, '''                    R.plurals.dopamine_selected_apps_count,\n                    apps.size,\n                    apps.size''', '''                    R.plurals.dopamine_selected_targets_count,\n                    totalTargets,\n                    totalTargets''')
          replace(time, '''            } else if (appName.isNotBlank()) {\n                Spacer(modifier = Modifier.height(8.dp))''', '''            } else if (sites.isNotEmpty()) {\n                Spacer(modifier = Modifier.height(8.dp))\n                Text(\n                    text = sites.take(4).joinToString(", ") { WebsiteBlocker.displayRule(it) },\n                    color = TextHint,\n                    fontSize = 12.sp\n                )\n            } else if (appName.isNotBlank()) {\n                Spacer(modifier = Modifier.height(8.dp))''')

          for path, anchor, extra in [
              ("app/src/main/res/values/app_selection_selected_strings.xml", '    <string name="app_selection_selected">Selected apps</string>\n', '    <string name="app_selection_already_blocked">Already blocked</string>\n    <string name="app_selection_already_blocked_hint">These apps are protected by another active block and cannot be selected again.</string>\n    <string name="app_selection_already_blocked_badge">Already blocked</string>\n'),
              ("app/src/main/res/values-pt/app_selection_selected_strings.xml", '    <string name="app_selection_selected">Apps selecionados</string>\n', '    <string name="app_selection_already_blocked">Já bloqueados</string>\n    <string name="app_selection_already_blocked_hint">Estes apps já estão protegidos por outro bloqueio ativo e não podem ser selecionados novamente.</string>\n    <string name="app_selection_already_blocked_badge">Já bloqueado</string>\n')
          ]:
              replace(path, anchor, extra + anchor)

          for path, anchor, extra in [
              ("app/src/main/res/values/dopamine_schedule_strings.xml", '    <plurals name="dopamine_selected_apps_count">\n', '    <plurals name="dopamine_selected_targets_count">\n        <item quantity="one">%1$d item selected</item>\n        <item quantity="other">%1$d items selected</item>\n    </plurals>\n'),
              ("app/src/main/res/values-pt/dopamine_schedule_strings.xml", '    <plurals name="dopamine_selected_apps_count">\n', '    <plurals name="dopamine_selected_targets_count">\n        <item quantity="one">%1$d item selecionado</item>\n        <item quantity="other">%1$d itens selecionados</item>\n    </plurals>\n')
          ]:
              replace(path, anchor, extra + anchor)

          tests = Path("app/src/test/java/com/focusguard/ui/compose/screens")
          tests.mkdir(parents=True, exist_ok=True)
          (tests / "TimeBlockTargetSummaryTest.kt").write_text('''package com.focusguard.ui.compose.screens\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass TimeBlockTargetSummaryTest {\n    @Test\n    fun sitesAreIncludedWhenNoAppsAreSelected() {\n        assertEquals(2, selectedTargetCount(appCount = 0, siteCount = 2))\n    }\n}\n''')
          (tests / "AppSelectionAlreadyBlockedTest.kt").write_text('''package com.focusguard.ui.compose.screens\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass AppSelectionAlreadyBlockedTest {\n    @Test\n    fun alreadyBlockedAppsAreExposedInDedicatedTopSection() {\n        val blocked = SelectableAppUi("com.facebook.katana", "Facebook", false, isAlreadyBlocked = true)\n        val available = SelectableAppUi("com.instagram.android", "Instagram", false)\n        assertEquals(listOf(blocked), alreadyBlockedAppsForSelection(listOf(available, blocked), ""))\n    }\n}\n''')
          utils = Path("app/src/test/java/com/focusguard/utils")
          utils.mkdir(parents=True, exist_ok=True)
          (utils / "WebsiteBlockerAppDomainMappingTest.kt").write_text('''package com.focusguard.utils\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass WebsiteBlockerAppDomainMappingTest {\n    @Test\n    fun facebookAppAlsoMapsToFacebookWebsite() {\n        assertTrue(WebsiteBlocker.domainRulesForAppPackages(listOf("com.facebook.katana")).contains("facebook.com"))\n    }\n\n    @Test\n    fun facebookWebsiteAlsoMapsToFacebookApp() {\n        assertEquals("facebook.com", WebsiteBlocker.appPackageDomainsFor(listOf("facebook.com"))["com.facebook.katana"])\n    }\n}\n''')
          PY
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          git commit -m "fix: keep dopamine block target state consistent"
          git push origin HEAD:fix/dopamine-target-selection-integrity
