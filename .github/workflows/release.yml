name: FocusGuard Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: focusguard-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four release-signing secrets before publishing a release." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/focusguard-release.jks"
          test -s "$RUNNER_TEMP/focusguard-release.jks"

      - name: Run release checks and build APK + AAB
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
        run: |
          set -euo pipefail
          ./gradlew \
            lintRelease \
            testReleaseUnitTest \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p release
          RELEASE_APK="release/FocusGuard-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_AAB="release/FocusGuard-build-${GITHUB_RUN_NUMBER}.aab"
          cp "$APK" "$RELEASE_APK"
          cp "$AAB" "$RELEASE_AAB"
          sha256sum "$RELEASE_APK" "$RELEASE_AAB" > release/SHA256SUMS.txt

          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "aab=$RELEASE_AAB" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.collect.outputs.apk }}"
          jarsigner -verify -strict "${{ steps.collect.outputs.aab }}"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-apk-${{ github.run_number }}
          path: ${{ steps.collect.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-play-aab-${{ github.run_number }}
          path: ${{ steps.collect.outputs.aab }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-checksums-${{ github.run_number }}
          path: release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.collect.outputs.tag }}"
          TITLE="FocusGuard automated build ${GITHUB_RUN_NUMBER}"
          NOTES="Automated signed FocusGuard release from commit ${GITHUB_SHA}. Includes an installable APK, a Google Play AAB, and SHA-256 checksums."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focusguard-release.jks"
