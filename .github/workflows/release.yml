name: FocusGuard Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: focusguard-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish canonical signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic Android version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          VERSION_CODE="$((1000 + COMMIT_COUNT))"
          echo "CI_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Android versionCode: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require canonical release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The canonical production signing key is mandatory. No fallback APK will be published." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Decode canonical release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/focusguard-release.jks"
          test -s "$RUNNER_TEMP/focusguard-release.jks"

      - name: Run checks and build canonical Release APK and AAB
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
        run: |
          set -euo pipefail
          ./gradlew \
            lintRelease \
            testReleaseUnitTest \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect canonical release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p release
          RELEASE_APK="release/HardBlock-vc${CI_VERSION_CODE}.apk"
          RELEASE_AAB="release/HardBlock-vc${CI_VERSION_CODE}.aab"
          cp "$APK" "$RELEASE_APK"
          cp "$AAB" "$RELEASE_AAB"
          sha256sum "$RELEASE_APK" "$RELEASE_AAB" > release/SHA256SUMS.txt

          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "aab=$RELEASE_AAB" >> "$GITHUB_OUTPUT"
          echo "tag=build-vc${CI_VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Verify update identity and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "${{ steps.collect.outputs.apk }}" | tee release/apksigner.txt
          "$AAPT" dump badging "${{ steps.collect.outputs.apk }}" | head -n 1 | tee release/package.txt

          grep -q "package: name='com.focusguard.v2'" release/package.txt
          grep -qi "e8da4209d0012052b052b280fa64becb788bf6929563ce54a0707cb8c3385157" release/apksigner.txt
          jarsigner -verify "${{ steps.collect.outputs.aab }}"

          echo "Canonical package: com.focusguard.v2" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical signer SHA-256: e8da4209d0012052b052b280fa64becb788bf6929563ce54a0707cb8c3385157" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hardblock-update-apk-vc${{ steps.version.outputs.version_code }}
          path: ${{ steps.collect.outputs.apk }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: hardblock-play-aab-vc${{ steps.version.outputs.version_code }}
          path: ${{ steps.collect.outputs.aab }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload checksums and identity reports
        uses: actions/upload-artifact@v4
        with:
          name: hardblock-release-identity-vc${{ steps.version.outputs.version_code }}
          path: |
            release/SHA256SUMS.txt
            release/apksigner.txt
            release/package.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.collect.outputs.tag }}"
          TITLE="Hard Block update vc${CI_VERSION_CODE}"
          NOTES="Canonical Hard Block update from ${GITHUB_SHA}. Package: com.focusguard.v2. Signed with the permanent production update key. Android versionCode ${CI_VERSION_CODE}. This APK is the only installable update artifact published by this workflow."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Record publication fallback
        if: steps.publish_release.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Canonical signed build completed"
            echo "The production Release APK and AAB passed package and signing-identity verification and were uploaded as workflow artifacts."
            echo "Only the optional GitHub Release publication failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focusguard-release.jks"
