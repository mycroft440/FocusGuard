name: FocusGuard Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: focusguard-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic Android version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          VERSION_CODE="$((1000 + COMMIT_COUNT))"
          echo "CI_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Android versionCode: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four release-signing secrets before publishing a release." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/focusguard-release.jks"
          test -s "$RUNNER_TEMP/focusguard-release.jks"

      - name: Run release checks and build Release APK + Debug APK + AAB
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
        run: |
          set -euo pipefail
          ./gradlew \
            lintRelease \
            testReleaseUnitTest \
            assembleRelease \
            assembleDebug \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$DEBUG_APK" && test -s "$DEBUG_APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p release
          RELEASE_APK="release/FocusGuard-vc${CI_VERSION_CODE}.apk"
          RELEASE_DEBUG_APK="release/FocusGuard-debug-vc${CI_VERSION_CODE}.apk"
          RELEASE_AAB="release/FocusGuard-vc${CI_VERSION_CODE}.aab"
          cp "$APK" "$RELEASE_APK"
          cp "$DEBUG_APK" "$RELEASE_DEBUG_APK"
          cp "$AAB" "$RELEASE_AAB"
          sha256sum "$RELEASE_APK" "$RELEASE_AAB" > release/SHA256SUMS.txt

          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "debug_apk=$RELEASE_DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "aab=$RELEASE_AAB" >> "$GITHUB_OUTPUT"
          echo "tag=build-vc${CI_VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.collect.outputs.apk }}"
          jarsigner -verify "${{ steps.collect.outputs.aab }}"

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-apk-vc${{ steps.version.outputs.version_code }}
          path: ${{ steps.collect.outputs.apk }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-debug-apk-vc${{ steps.version.outputs.version_code }}
          path: ${{ steps.collect.outputs.debug_apk }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-play-aab-vc${{ steps.version.outputs.version_code }}
          path: ${{ steps.collect.outputs.aab }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-checksums-vc${{ steps.version.outputs.version_code }}
          path: release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.collect.outputs.tag }}"
          TITLE="FocusGuard automated release vc${CI_VERSION_CODE}"
          NOTES="Automated signed FocusGuard release from commit ${GITHUB_SHA}. Android versionCode ${CI_VERSION_CODE}. Includes an installable Release APK, a Google Play AAB, and SHA-256 checksums. A Debug APK is also available as a workflow artifact."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focusguard-release.jks"
