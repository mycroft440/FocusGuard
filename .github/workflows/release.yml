name: FocusGuard Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: focusguard-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Build and publish canonical signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic Android version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          VERSION_CODE="$((1000 + COMMIT_COUNT))"
          echo "CI_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Android versionCode: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Robolectric Android runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/robolectric/android-all
            ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: |
            robolectric-runtime-${{ runner.os }}-

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require canonical release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The canonical production signing key is mandatory. No fallback APK will be published." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Decode canonical release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/focusguard-release.jks"
          test -s "$RUNNER_TEMP/focusguard-release.jks"

      - name: Run release lint
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
        run: |
          set -euo pipefail
          ./gradlew lintRelease --no-daemon --stacktrace 2>&1 | tee release-lint-gradle.log

      - name: Run release unit tests
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
          JAVA_TOOL_OPTIONS: >-
            -Drobolectric.dependency.repo.id=central
            -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
        run: |
          set -euo pipefail
          set +e
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee release-unit-tests-gradle.log
          first_status=${PIPESTATUS[0]}
          set -e

          if [ "$first_status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "MavenArtifactFetcher" release-unit-tests-gradle.log && \
             grep -Eq "SocketException|ConnectException|UnknownHostException|SocketTimeoutException" release-unit-tests-gradle.log; then
            echo "::warning::Transient Robolectric dependency transport failure detected; retrying release unit tests once."
            ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee -a release-unit-tests-gradle.log
          else
            exit "$first_status"
          fi

      - name: Build canonical Release APK and AAB
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/focusguard-release.jks
        run: |
          set -euo pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee release-build-gradle.log

      - name: Upload release diagnostics
        id: upload_release_diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ github.run_number }}
          path: |
            release-lint-gradle.log
            release-unit-tests-gradle.log
            release-build-gradle.log
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
          archive: true

      - name: Verify release diagnostics ZIP
        if: always() && steps.upload_release_diagnostics.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_release_diagnostics.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_release_diagnostics.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/release-diagnostics-${{ github.run_number }}.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "$ARCHIVE" \
            --expected-digest "$ARTIFACT_DIGEST"

      - name: Collect canonical release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0c | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p release
          RELEASE_APK="release/HardBlock-vc${CI_VERSION_CODE}.apk"
          RELEASE_AAB="release/HardBlock-vc${CI_VERSION_CODE}.aab"
          cp "$APK" "$RELEASE_APK"
          cp "$AAB" "$RELEASE_AAB"
          sha256sum "$RELEASE_APK" "$RELEASE_AAB" > release/SHA256SUMS.txt

          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "aab=$RELEASE_AAB" >> "$GITHUB_OUTPUT"
          echo "tag=build-vc${CI_VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Verify update identity and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "${{ steps.collect.outputs.apk }}" | tee release/apksigner.txt
          "$AAPT" dump badging "${{ steps.collect.outputs.apk }}" | head -n 1 | tee release/package.txt

          grep -q "package: name='com.focusguard.v2'" release/package.txt
          grep -qi "e8da4209d0012052b052b280fa64becb788bf6929563ce54a0707cb8c3385157" release/apksigner.txt
          jarsigner -verify "${{ steps.collect.outputs.aab }}"

          echo "Canonical package: com.focusguard.v2" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical signer SHA-256: e8da4209d0012052b052b280fa64becb788bf6929563ce54a0707cb8c3385157" >> "$GITHUB_STEP_SUMMARY"

      - name: Create and validate portable release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import zipfile

          vc = os.environ["CI_VERSION_CODE"]
          root = Path("release")
          apk = root / f"HardBlock-vc{vc}.apk"
          aab = root / f"HardBlock-vc{vc}.aab"
          archives = [
              (
                  root / f"HardBlock-vc{vc}-APK.zip",
                  [(apk.name, apk)],
                  zipfile.ZIP_STORED,
              ),
              (
                  root / f"HardBlock-vc{vc}-AAB.zip",
                  [(aab.name, aab)],
                  zipfile.ZIP_STORED,
              ),
              (
                  root / f"HardBlock-vc{vc}-identity.zip",
                  [
                      ("SHA256SUMS.txt", root / "SHA256SUMS.txt"),
                      ("apksigner.txt", root / "apksigner.txt"),
                      ("package.txt", root / "package.txt"),
                  ],
                  zipfile.ZIP_DEFLATED,
              ),
          ]

          for archive, members, compression in archives:
              for _, source in members:
                  if not source.is_file() or source.stat().st_size == 0:
                      raise SystemExit(f"Missing or empty ZIP source: {source}")
              archive.unlink(missing_ok=True)
              with zipfile.ZipFile(
                  archive,
                  mode="w",
                  compression=compression,
                  allowZip64=False,
              ) as zipped:
                  for archive_name, source in members:
                      zipped.write(source, arcname=archive_name)
              with zipfile.ZipFile(archive, mode="r") as zipped:
                  bad = zipped.testzip()
                  if bad is not None:
                      raise SystemExit(f"CRC failure in {archive}: {bad}")
                  actual_names = [info.filename for info in zipped.infolist() if not info.is_dir()]
                  expected_names = [name for name, _ in members]
                  if actual_names != expected_names:
                      raise SystemExit(
                          f"ZIP member mismatch in {archive}: expected {expected_names}, got {actual_names}"
                      )
              print(f"Created valid portable ZIP: {archive} ({archive.stat().st_size} bytes)")
          PY

          python3 scripts/verify_github_artifact_zip.py \
            --archive "release/HardBlock-vc${CI_VERSION_CODE}-APK.zip" \
            --expect "HardBlock-vc${CI_VERSION_CODE}.apk=${{ steps.collect.outputs.apk }}"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "release/HardBlock-vc${CI_VERSION_CODE}-AAB.zip" \
            --expect "HardBlock-vc${CI_VERSION_CODE}.aab=${{ steps.collect.outputs.aab }}"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "release/HardBlock-vc${CI_VERSION_CODE}-identity.zip" \
            --expect "SHA256SUMS.txt=release/SHA256SUMS.txt" \
            --expect "apksigner.txt=release/apksigner.txt" \
            --expect "package.txt=release/package.txt"

          unzip -t "release/HardBlock-vc${CI_VERSION_CODE}-APK.zip"
          unzip -t "release/HardBlock-vc${CI_VERSION_CODE}-AAB.zip"
          unzip -t "release/HardBlock-vc${CI_VERSION_CODE}-identity.zip"

      - name: Upload canonical Release APK ZIP directly
        id: upload_release_apk_zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HardBlock-vc${{ steps.version.outputs.version_code }}-APK.zip
          path: release/HardBlock-vc${{ steps.version.outputs.version_code }}-APK.zip
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          archive: false

      - name: Verify downloaded APK artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_release_apk_zip.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_release_apk_zip.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/HardBlock-vc${CI_VERSION_CODE}-APK-downloaded.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "$ARCHIVE" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --expect "HardBlock-vc${CI_VERSION_CODE}.apk=${{ steps.collect.outputs.apk }}"
          unzip -t "$ARCHIVE"

      - name: Upload Play AAB ZIP directly
        id: upload_release_aab_zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HardBlock-vc${{ steps.version.outputs.version_code }}-AAB.zip
          path: release/HardBlock-vc${{ steps.version.outputs.version_code }}-AAB.zip
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          archive: false

      - name: Verify downloaded AAB artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_release_aab_zip.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_release_aab_zip.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/HardBlock-vc${CI_VERSION_CODE}-AAB-downloaded.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "$ARCHIVE" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --expect "HardBlock-vc${CI_VERSION_CODE}.aab=${{ steps.collect.outputs.aab }}"
          unzip -t "$ARCHIVE"

      - name: Upload identity ZIP directly
        id: upload_release_identity_zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HardBlock-vc${{ steps.version.outputs.version_code }}-identity.zip
          path: release/HardBlock-vc${{ steps.version.outputs.version_code }}-identity.zip
          if-no-files-found: error
          retention-days: 90
          overwrite: true
          archive: false

      - name: Verify downloaded identity artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_release_identity_zip.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload_release_identity_zip.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/HardBlock-vc${CI_VERSION_CODE}-identity-downloaded.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          python3 scripts/verify_github_artifact_zip.py \
            --archive "$ARCHIVE" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --expect "SHA256SUMS.txt=release/SHA256SUMS.txt" \
            --expect "apksigner.txt=release/apksigner.txt" \
            --expect "package.txt=release/package.txt"
          unzip -t "$ARCHIVE"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.collect.outputs.tag }}"
          TITLE="Hard Block update vc${CI_VERSION_CODE}"
          NOTES="Canonical Hard Block update from ${GITHUB_SHA}. Package: com.focusguard.v2. Signed with the permanent production update key. Android versionCode ${CI_VERSION_CODE}. The portable ZIP assets are created, uploaded, downloaded again, and CRC/SHA-256/content validated before publication."
          APK_ZIP="release/HardBlock-vc${CI_VERSION_CODE}-APK.zip"
          AAB_ZIP="release/HardBlock-vc${CI_VERSION_CODE}-AAB.zip"
          IDENTITY_ZIP="release/HardBlock-vc${CI_VERSION_CODE}-identity.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              "$APK_ZIP" \
              "$AAB_ZIP" \
              "$IDENTITY_ZIP" \
              release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.collect.outputs.apk }}" \
              "${{ steps.collect.outputs.aab }}" \
              "$APK_ZIP" \
              "$AAB_ZIP" \
              "$IDENTITY_ZIP" \
              release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Record publication fallback
        if: steps.publish_release.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Canonical signed build completed"
            echo "The production Release APK/AAB and their validated portable ZIPs passed package, signature, local CRC, upload/download round-trip, CRC, and SHA-256/content verification and were uploaded as workflow artifacts."
            echo "Only the optional GitHub Release publication failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focusguard-release.jks"
