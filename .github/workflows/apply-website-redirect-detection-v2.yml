name: Apply website redirect detection v2 fix

on:
  push:
    branches:
      - fix/website-detection-same-tab-v2
    paths:
      - .github/workflows/apply-website-redirect-detection-v2.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/website-detection-same-tab-v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply focused patch
        run: python3 tools/apply_website_redirect_detection_v2.py

      - name: Validate patch
        run: git diff --check

      - name: Run website redirect and race tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests com.focusguard.accessibility.website.redirection.WebsiteRedirectionPlanTest
          --tests com.focusguard.service.WebsiteBlockNavigationTest
          --tests com.focusguard.service.BrowserTransitionRaceTest
          --tests com.focusguard.service.BrowserInspectionCoordinatorTest

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/focusguard/accessibility/website/redirection/WebsiteRedirectionPlan.kt \
            app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt \
            app/src/test/java/com/focusguard/accessibility/website/redirection/WebsiteRedirectionPlanTest.kt \
            app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix same-tab redirect races and browser detection"
          git push origin HEAD:fix/website-detection-same-tab-v2
