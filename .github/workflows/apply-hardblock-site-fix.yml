name: Apply HardBlock site detection fix

on:
  push:
    branches:
      - fix/hardblock-site-detection
    paths:
      - .github/workflows/apply-hardblock-site-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hardblock-site-detection
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply HardBlock fixes
        run: python3 scripts/apply_hardblock_site_fix.py

      - name: Compile and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FocusGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-hardblock-site-fix.yml
          git rm scripts/apply_hardblock_site_fix.py
          git add app/src/main/java/com/focusguard/service/BrowserInspectionOutcome.kt
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git add app/src/test/java/com/focusguard/service/BrowserInspectionOutcomeTest.kt
          git commit -m "Fix HardBlock website detection and fail-closed redirect [hardblock-applied]"
          git push origin HEAD:fix/hardblock-site-detection
