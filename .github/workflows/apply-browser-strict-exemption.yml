name: Apply browser strict-mode exemption

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-test:
    if: github.head_ref == 'fix/browser-close-blocked-tab-only' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Exempt browser windows from strict global interception
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path("app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt")
          text = service_path.read_text()

          old_condition = '''            if (isPomodoroStrictActive &&\n                isWindowTransition\n            ) {\n                handleStrictPomodoro(packageName, event.className?.toString().orEmpty())\n                return\n            }'''
          new_condition = '''            if (shouldApplyStrictPomodoroToWindow(\n                    strictActive = isPomodoroStrictActive,\n                    isWindowTransition = isWindowTransition,\n                    isBrowserWindow = packageName in browserPackages\n                )\n            ) {\n                handleStrictPomodoro(packageName, event.className?.toString().orEmpty())\n                return\n            }'''
          if old_condition not in text:
              raise SystemExit("strict Pomodoro window condition not found")
          text = text.replace(old_condition, new_condition, 1)

          helper_anchor = '''        internal fun chromiumTabSwitcherEntryNamesForTest(): List<String> =\n            CHROMIUM_TAB_SWITCHER_ENTRY_NAMES\n'''
          helper = helper_anchor + '''\n        internal fun shouldApplyStrictPomodoroToWindow(\n            strictActive: Boolean,\n            isWindowTransition: Boolean,\n            isBrowserWindow: Boolean\n        ): Boolean = strictActive && isWindowTransition && !isBrowserWindow\n'''
          if helper_anchor not in text:
              raise SystemExit("browser test helper anchor not found")
          text = text.replace(helper_anchor, helper, 1)
          service_path.write_text(text)

          test_path = Path("app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt")
          test_text = test_path.read_text()
          anchor = '''    @Test\n    fun `Chromium tab closing supports Brave top and bottom tab switchers`() {'''
          new_test = '''    @Test\n    fun `strict Pomodoro does not block browser window transitions`() {\n        assertThat(\n            BlockingAccessibilityService.shouldApplyStrictPomodoroToWindow(\n                strictActive = true,\n                isWindowTransition = true,\n                isBrowserWindow = true\n            )\n        ).isFalse()\n        assertThat(\n            BlockingAccessibilityService.shouldApplyStrictPomodoroToWindow(\n                strictActive = true,\n                isWindowTransition = true,\n                isBrowserWindow = false\n            )\n        ).isTrue()\n    }\n\n'''
          if anchor not in test_text:
              raise SystemExit("test insertion anchor not found")
          test_text = test_text.replace(anchor, new_test + anchor, 1)
          test_path.write_text(test_text)
          PY
      - run: chmod +x gradlew
      - name: Run focused unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --tests com.focusguard.service.WebsiteBlockNavigationTest --no-daemon --stacktrace
      - name: Commit fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt app/src/test/java/com/focusguard/service/WebsiteBlockNavigationTest.kt
          git commit -m "fix: keep browser interactive during strict website blocking"
          git push origin HEAD:${{ github.head_ref }}
