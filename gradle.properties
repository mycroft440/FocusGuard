# ============================================================================
# FocusGuard — Gradle properties
# ============================================================================

# AndroidX package structure (obrigatório para Jetpack)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# ─── Performance ───────────────────────────────────────────────────────────
# Paralelismo: build independent projects em paralelo
org.gradle.parallel=true

# Configuration cache: armazena o grafo de configuração do projeto e reusa
# entre builds. Reduz tempo de configuração em até 90%.
org.gradle.configuration-cache=true

# Build cache: reusa outputs de tarefas entre builds (incluindo CI local)
org.gradle.caching=true

# Daemon: mantém a JVM do Gradle viva entre builds (default true, mas explícito)
org.gradle.daemon=true

# Memória: 2GB para builds com KSP + Compose + R8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ─── KSP ────────────────────────────────────────────────────────────────────
# KSP1 (legacy) em vez de KSP2. Motivo: Room 2.6.1 tem bug conhecido em KSP2
# ("unexpected jvm signature V" — ver https://issuetracker.google.com/issues/345293110)
# que faz kspDebugKotlin falhar. KSP1 é estável com Room 2.6.1.
# Quando Room 2.7.0 for estável, podemos reabilitar KSP2 setando true.
ksp.useKSP2=false
